// ---------- baked library ----------
function renderBaked() {
  const box = $('baked');
  box.innerHTML = '';
  SF.fields.forEach((f, i) => {
    const used = nodes.filter(n => isField(n) && n.fi === i).length;
    const el = document.createElement('div');
    el.className = 'node body' + (i === activeField ? ' sel' : '');
    el.innerHTML =
      `<span class="nm">${f.name}</span>` +
      `<span class="bd">${f.nx}\u00d7${f.ny}\u00d7${f.nz}</span>` +
      `<button class="ic" data-act="place" title="Place one">\uff0b</button>` +
      `<button class="ic" data-act="rename">\u270e</button>` +
      `<button class="ic" data-act="del" title="${used ? used + ' in use' : ''}">\u2715</button>`;
    el.onclick = ev => {
      const act = ev.target.dataset && ev.target.dataset.act;
      if (act === 'place') {
        snapshot();
        // No `round`: the kernel takes a field's sample range through that
        // slot itself, off the library entry, so writing it onto the node
        // would only be a second copy that the next rename could not fix.
        const c = makeNode('field', { fi: i, b: activeBody, p: [0, 0, f.box[2]],
                                      d: f.box.slice() });
        nodes.push(c);
        sel = nodes.length - 1; picked = new Set([c]);
      } else if (act === 'rename') {
        renameField(f); return;
      } else if (act === 'del') {
        if (used) { showErr(`${used} shape(s) still use ${f.name}`); return; }
        snapshot();
        if (f.tex) gl.deleteTexture(f.tex);
        SF.fields.splice(i, 1);
        // instances after it shift down with it
        for (const n of nodes)
          if (isField(n) && n.fi > i) n.fi--;
        activeField = Math.max(0, Math.min(activeField, SF.fields.length - 1));
      } else activeField = i;
      sceneChanged(); renderList(); renderInspector(); save(); needDraw();
    };
    box.appendChild(el);
  });
  $('bakedCount').textContent = SF.fields.length
    ? SF.fields.length + '/' + MAXFIELDS : '';
}

function renameField(f) {
  openModal('Rename baked shape',
    `<input id="bnm" type="text" maxlength="24" value="${f.name.replace(/"/g, '&quot;')}">` +
    '<div class="bar" style="margin-top:10px"><button class="btn" id="bok">Rename</button></div>',
    () => {
      const inp = $('bnm'); inp.focus(); inp.select();
      const go = () => {
        const v = inp.value.trim();
        if (v) { snapshot(); f.name = v; f.b64 = null; }
        closeModal(); renderList(); save();
      };
      $('bok').onclick = go;
      inp.onkeydown = e => { if (e.key === 'Enter') go(); };
    });
}

$('bakeBtn').onclick = () => {
  const res = parseFloat(prompt(
    'Grid spacing in mm for the bake.\n\nFiner is truer but the document '
    + 'grows as the cube of it.', '0.8') || '0');
  if (!(res > 0.05)) return;
  try {
    snapshot();
    const id = activeBody;
    const r = bakeBody(id, res);
    // The body's shapes are replaced by the one baked shape. Its cuts were
    // baked in too, so a cut that reached nothing but this body has done its
    // work and goes; one that also reaches a body still standing has to stay,
    // and will simply find nothing left to do here.
    const live = new Set(bodies.map(x => x.id));
    const spent = n => n.op === 'add'
      ? n.b === id
      : (n.tg ? n.tg.every(t => t === id)
              : [...live].every(t => t === id));
    const gone = new Set(nodes.filter(spent));
    nodes = nodes.filter(n => !gone.has(n));
    const c = makeNode('field', { fi: r.fi, b: id, p: r.centre,
                                  d: r.box.slice() });
    nodes.push(c);
    sel = nodes.indexOf(c); picked = new Set([c]);
    activeField = r.fi;
    syncBodies(); syncPicked();
    sceneChanged(); renderList(); renderInspector(); save(); needDraw();
  } catch (e) { undo(); showErr('bake: ' + e.message); }
};

// ---------- body list ----------
// The whole point of a body is that it is a thing you work on, so it needs to
// be visible without hunting through the shapes: what exists, which one you
// are building into, and a way to get the others out of the way.
function renderBodies() {
  const box = $('bodies');
  box.innerHTML = '';
  bodies.forEach(b => {
    const el = document.createElement('div');
    const count = bodyShapeCount(b.id);
    el.className = 'node body' + (b.id === activeBody ? ' sel' : '') +
                   (b.on === false ? ' off' : '');
    el.innerHTML =
      `<button class="ic" data-act="show">${b.on === false ? '○' : '●'}</button>` +
      `<span class="nm">${b.name}</span>` +
      `<span class="bd">${count} shape${count === 1 ? '' : 's'}</span>` +
      `<button class="ic" data-act="rename">✎</button>` +
      (bodies.length > 1 ? `<button class="ic" data-act="del">✕</button>` : '');
    el.onclick = ev => {
      const act = ev.target.dataset && ev.target.dataset.act;
      if (act === 'show') {
        snapshot(); b.on = b.on === false;
      } else if (act === 'rename') {
        renameBody(b); return;
      } else if (act === 'del') {
        snapshot();
        nodes = nodes.filter(n => !(n.op === 'add' && n.b === b.id));
        bodies = bodies.filter(x => x.id !== b.id);
        sel = Math.max(0, Math.min(sel, nodes.length - 1));
        syncBodies(); syncPicked();
      } else {
        // the body browser is the way to select a body: everything it is
        // made of, its own shapes and the cuts that reach them
        activeBody = b.id;
        pickBody(b.id);
      }
      sceneChanged(); renderList(); renderInspector(); save(); needDraw();
    };
    box.appendChild(el);
  });
  $('bodyCount').textContent = bodies.length;
}

function renameBody(b) {
  openModal('Rename body',
    `<input id="bnm" type="text" maxlength="24" value="${b.name.replace(/"/g, '&quot;')}">` +
    '<div class="bar" style="margin-top:10px"><button class="btn" id="bok">Rename</button></div>',
    () => {
      const inp = $('bnm');
      inp.focus(); inp.select();
      const go = () => {
        const v = inp.value.trim();
        if (v) { snapshot(); b.name = v; }
        closeModal();
        renderList(); renderInspector(); save();
      };
      $('bok').onclick = go;
      inp.onkeydown = e => { if (e.key === 'Enter') go(); };
    });
}

$('addBodyBtn').onclick = () => {
  snapshot();
  activeBody = addBody();
  renderList(); renderInspector(); save();
};

// ---------- shape list ----------
function renderList() {
  const box = $('nodes');
  box.innerHTML = '';
  nodes.forEach((n, i) => {
    const el = document.createElement('div');
    // shapes outside the body you are working on stay legible but step back
    const elsewhere = bodies.length > 1 &&
      (n.op === 'add' ? n.b !== activeBody : !hits(n, activeBody));
    el.className = 'node' + (picked.has(n) ? ' pick' : '') +
                   (i === sel && picked.has(n) ? ' sel' : '') +
                   (n.on ? '' : ' off') + (elsewhere ? ' away' : '');
    const opCls = n.op === 'cut' ? 'cut' : n.op === 'keep' ? 'keep' : '';
    // a one-body model reads exactly as it did before bodies existed
    const badge = bodies.length < 2 ? ''
      : `<span class="bd">${n.op === 'add' ? bodyName(n.b)
          : !n.tg ? 'all'
          : n.tg.length ? n.tg.map(bodyName).join('·')
          : 'none'}</span>`;
    el.innerHTML =
      `<button class="ic" data-act="on">${n.on ? '●' : '○'}</button>` +
      `<span class="nm">${PRIMS[n.t].name}</span>` +
      badge +
      `<span class="op ${opCls}">${OPS.find(o => o[0] === n.op)[1]}</span>` +
      `<button class="ic" data-act="up">▲</button>` +
      `<button class="ic" data-act="down">▼</button>`;
    el.onclick = ev => {
      const act = ev.target.dataset && ev.target.dataset.act;
      if (act === 'on') { snapshot(); n.on = !n.on; sceneChanged(); }
      else if (act === 'up' && i > 0) {
        snapshot(); nodes.splice(i - 1, 0, nodes.splice(i, 1)[0]);
        sel = i - 1; sceneChanged();
      } else if (act === 'down' && i < nodes.length - 1) {
        snapshot(); nodes.splice(i + 1, 0, nodes.splice(i, 1)[0]);
        sel = i + 1; sceneChanged();
      } else {
        // picking a shape also moves you into its body, so the next shape you
        // add lands where you are looking
        pickShape(n);
      }
      renderList(); renderInspector(); save(); needDraw();
    };
    box.appendChild(el);
  });
  // A count, not a ration. This used to read "17/32", and the 32 in it was
  // this GPU's uniform block leaking into the document.
  $('nodeCount').textContent = nodes.length + (rayFits ? '' : ' · meshed view');
  $('selHint').textContent = picked.size > 1
    ? picked.size + ' selected · Place moves and turns them as one'
    : picked.size ? '1 selected'
    : 'Nothing selected · tap a shape, or a body above';
  renderBodies();
  renderBaked();
  syncGizbar();
  scheduleInfo();
}

// ---------- one slider row ----------
// ---------- the icons ----------
// One glyph per row, saying what the row moves. The axis ones are drawn in
// the axis colour, which is the same colour that axis has in the viewport
// widget -- so the red arrow on screen and the red icon in the panel do not
// have to explain that they are the same thing.
const GLYPH = {
  posX:  '<path d="M2.5 8h9"/><path d="M9 5.2 11.5 8 9 10.8"/>',
  posY:  '<path d="M3.5 12.5 12 4"/><path d="M12 8V4H8"/>',
  posZ:  '<path d="M8 13.5v-9"/><path d="M5.2 7 8 4.5l2.8 2.5"/>',
  rotX:  '<path d="M13 8a5 5 0 1 1-2.2-4.1"/><path d="M13.2 2.9v3.3H9.9"/>',
  rotY:  '<path d="M13 8a5 5 0 1 1-2.2-4.1"/><path d="M13.2 2.9v3.3H9.9"/>',
  rotZ:  '<path d="M13 8a5 5 0 1 1-2.2-4.1"/><path d="M13.2 2.9v3.3H9.9"/>',
  scale: '<path d="M3 13 13 3"/><path d="M3 9.5V13h3.5"/><path d="M13 6.5V3H9.5"/>',
  blend: '<circle cx="6" cy="8" r="3.4"/><circle cx="10" cy="8" r="3.4"/>',
  radius:'<circle cx="8" cy="8" r="5.2"/><path d="M8 8h5.2"/>',
  round: '<path d="M2.5 13.5V7A4.5 4.5 0 0 1 7 2.5h6.5"/>',
  sides: '<path d="M8 2.2 13 5v6l-5 2.8L3 11V5z"/>',
  angle: '<path d="M2.5 13h11"/><path d="M2.5 13 11 4.5"/>'
         + '<path d="M8.6 13a6.1 6.1 0 0 0-1.8-4.3"/>',
  sizeX: '<path d="M2 8h12"/><path d="M4.4 5.6 2 8l2.4 2.4"/>'
         + '<path d="M11.6 5.6 14 8l-2.4 2.4"/>',
  sizeY: '<path d="M3 13 13 3"/><path d="M3 9.6V13h3.4"/><path d="M13 6.4V3H9.6"/>',
  sizeZ: '<path d="M8 2v12"/><path d="M5.6 4.4 8 2l2.4 2.4"/>'
         + '<path d="M5.6 11.6 8 14l2.4-2.4"/>',
  span:  '<path d="M3 5v6"/><path d="M13 5v6"/><path d="M3 8h10"/>',
  res:   '<path d="M2.5 2.5h11v11h-11z"/><path d="M2.5 6.2h11M2.5 9.8h11"/>'
         + '<path d="M6.2 2.5v11M9.8 2.5v11"/>'
};
// A dim's label is the kernel's, so the mapping lives here rather than a
// per-primitive icon field the kernel would have to carry for one consumer.
const GLYPH_FOR = [
  [/^Position X$/, 'posX', 'ax'], [/^Position Y$/, 'posY', 'ay'],
  [/^Position Z$/, 'posZ', 'az'],
  [/^Rotate X$/, 'rotX', 'ax'], [/^Rotate Y$/, 'rotY', 'ay'],
  [/^Rotate Z$/, 'rotZ', 'az'],
  [/^Scale$/, 'scale'], [/^Blend$/, 'blend'], [/^Corner round$/, 'round'],
  [/radius$/i, 'radius'], [/^Sides$/, 'sides'], [/^Sweep$/, 'angle'],
  [/^(Size X|Base|Half width)$/, 'sizeX'],
  [/^(Size Y|Half depth)$/, 'sizeY'],
  // a capsule's Length and a link's are along its own Z, like every Height
  [/^(Size Z|Height|Cut height|Length|Half height)$/, 'sizeZ'],
  [/^Size$/, 'span']
];
function glyph(name, axis) {
  const body = GLYPH[name] || GLYPH.span;
  const col = axis ? ` style="color:var(--${axis})"` : '';
  return `<svg class="gl" viewBox="0 0 16 16" fill="none" stroke="currentColor"`
       + ` stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"`
       + `${col} aria-hidden="true">${body}</svg>`;
}
function iconFor(label) {
  for (const [re, name, axis] of GLYPH_FOR)
    if (re.test(label)) return glyph(name, axis);
  return glyph('span');
}

// ---------- typing a value instead of sliding to it ----------
// A slider is the right control for finding a size and the wrong one for
// entering a known one: 0.5 mm steps cannot reach 12.7, and on a phone the
// last millimetre is a fight. So the readout is also a button -- tap it, type
// the number, Enter. Escape leaves it alone.
//
// `commit` is the row's own setter, so a typed value goes through exactly the
// path a dragged one does: the same clamp, the same undo snapshot, the same
// redraw. Shared by the inspector rows and the STL resolution row.
function editableValue(out, num, get, commit, after) {
  const open = () => {
    num.value = String(+(+get()).toFixed(4));
    out.hidden = true; num.hidden = false;
    num.focus(); num.select();
  };
  const close = (apply) => {
    if (num.hidden) return;
    if (apply) {
      // a comma is what half the world's keyboards put on that key
      const v = parseFloat(String(num.value).replace(',', '.'));
      if (isFinite(v)) commit(v);
    }
    num.hidden = true; out.hidden = false;
    if (after) after();
  };
  out.onclick = open;
  out.onkeydown = e => {
    if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); open(); }
  };
  num.onkeydown = e => {
    if (e.key === 'Enter') { e.preventDefault(); close(true); }
    else if (e.key === 'Escape') { e.preventDefault(); close(false); }
  };
  num.onblur = () => close(true);
  return { open, close };
}

// ---------- one slider row ----------
function sliderRow(label, unit, get, set, min, max, step) {
  const row = document.createElement('div');
  row.className = 'row';
  row.innerHTML =
    `<label>${iconFor(label)}<span>${label}</span>` +
    `<b class="tap" role="button" tabindex="0" title="Tap to type a value"></b>` +
    `<input class="numin" type="text" inputmode="decimal" hidden></label>` +
    `<div class="slide"><button class="step">−</button>` +
    `<input type="range" min="${min}" max="${max}" step="${step}">` +
    `<button class="step">＋</button></div>`;
  const out = row.querySelector('b');
  const num = row.querySelector('.numin');
  const inp = row.querySelector('input[type=range]');
  const [minus, plus] = row.querySelectorAll('.step');
  const show = () => {
    const v = get();
    out.textContent = fmt(v) + unit;
    if (document.activeElement !== inp) inp.value = v;
  };
  let touched = false;
  const commit = v => {
    if (!touched) { snapshot(); touched = true; }
    set(Math.min(Math.max(v, min), max));
    show(); save(); needDraw(); scheduleInfo();
  };
  inp.addEventListener('input', () => { commit(parseFloat(inp.value)); markInteracting(false); });
  inp.addEventListener('change', () => { touched = false; needDraw(); });
  const bump = s => () => {
    // round to the step grid, then to 4 places so 0.1 steps stay 0.1
    commit(parseFloat((Math.round((get() + s * step) / step) * step).toFixed(4)));
    touched = false;
  };
  minus.onclick = bump(-1); plus.onclick = bump(1);
  // typing a value is one edit, not a drag, so it closes its own undo step
  editableValue(out, num, get, v => { commit(v); touched = false; }, show);
  row.refresh = show;
  show();
  return row;
}

// ---------- body controls ----------
function chipRow(label, hint) {
  const row = document.createElement('div');
  row.className = 'row';
  row.innerHTML = `<label><span>${label}</span></label>`;
  const box = document.createElement('div');
  box.className = 'toggles';
  row.appendChild(box);
  if (hint) {
    const p = document.createElement('p');
    p.style.cssText = 'color:var(--dim);font-size:11.5px;margin:6px 0 0';
    p.textContent = hint;
    row.appendChild(p);
  }
  row.box = box;
  return row;
}
function chip(text, on, fn) {
  const b = document.createElement('button');
  b.className = 'btn sm' + (on ? ' on' : '');
  b.textContent = text;
  b.onclick = () => {
    snapshot(); fn();
    syncBodies();
    sceneChanged(); renderList(); renderInspector(); save(); needDraw();
  };
  return b;
}

// Which body this shape builds. Everything an `add` does — its blend above
// all — stays inside the body it belongs to.
function bodyRow(n) {
  const row = chipRow('Body');
  bodies.forEach(b => row.box.appendChild(
    chip(b.name, n.b === b.id, () => { n.b = b.id; activeBody = b.id; })));
  row.box.appendChild(chip('＋ New body', false,
    () => { n.b = addBody(); activeBody = n.b; }));
  return row;
}

// Which bodies this cut/keep reaches. "All bodies" also covers bodies made
// later, which is what the build-plate cut wants.
function targetRow(n) {
  const none = n.tg && !n.tg.length;
  const row = chipRow('Applies to', none
    ? 'No bodies left to cut — this shape does nothing. Pick one, or All.'
    : bodies.length < 2
      ? 'Add a second body to a shape above to aim this cut at one of them.'
      : '');
  row.box.appendChild(chip('All bodies', !n.tg, () => n.tg = null));
  bodies.forEach(b => {
    const on = !!n.tg && n.tg.indexOf(b.id) >= 0;
    row.box.appendChild(chip(b.name, on, () => {
      if (!n.tg) { n.tg = [b.id]; return; }      // All -> just this one
      const at = n.tg.indexOf(b.id);
      if (at < 0) n.tg.push(b.id);
      else if (n.tg.length > 1) n.tg.splice(at, 1);
      else n.tg = null;                          // last one off -> back to All
    }));
  });
  return row;
}

let inspectorRows = [];
function refreshInspectorValues() {
  inspectorRows.forEach(r => r.refresh && r.refresh());
  needDraw();
}

function renderInspector() {
  const host = $('inspector');
  host.innerHTML = '';
  inspectorRows = [];
  const n = primaryNode();
  if (!n) {
    const p = document.createElement('p');
    p.style.cssText = 'color:var(--dim);font-size:12px;margin:16px 0';
    p.textContent = 'Nothing selected. Tap a shape to edit it.';
    host.appendChild(p);
    scheduleInfo();
    return;
  }
  const P = PRIMS[n.t];
  const add = el => { host.appendChild(el); if (el.refresh) inspectorRows.push(el); };

  const h = document.createElement('h3');
  // with several picked, Move drags them all but the sliders edit this one
  h.textContent = picked.size > 1
    ? `Editing 1 of ${picked.size} selected` : 'Selected shape';
  host.appendChild(h);

  // type
  const typeRow = document.createElement('div');
  typeRow.className = 'row';
  typeRow.innerHTML = '<label><span>Type</span></label>';
  const selEl = document.createElement('select');
  // What can be turned into, plus whatever this shape already is — a document
  // may carry a primitive this editor would not offer to make, and the type
  // row has to be able to name it.
  const types = offered();
  if (!types.includes(n.t)) types.push(n.t);
  types.forEach(k => {
    const o = document.createElement('option');
    o.value = k; o.textContent = PRIMS[k].name; o.selected = k === n.t;
    selEl.appendChild(o);
  });
  selEl.onchange = () => {
    snapshot();
    n.t = selEl.value;
    n.d = PRIMS[n.t].def.slice();
    sceneChanged(); renderList(); renderInspector(); save(); needDraw();
  };
  typeRow.appendChild(selEl);
  host.appendChild(typeRow);

  // op
  const opRow = document.createElement('div');
  opRow.className = 'row';
  opRow.innerHTML = '<label><span>Operation</span></label>';
  const seg = document.createElement('div');
  seg.className = 'seg';
  OPS.forEach(([k, lbl]) => {
    const b = document.createElement('button');
    b.textContent = lbl; b.className = n.op === k ? 'on' : '';
    b.style.flex = '1';
    b.onclick = () => {
      snapshot(); n.op = k;
      syncBodies();   // an add turned into a cut can strand its old body
      sceneChanged(); renderList(); renderInspector(); save(); needDraw();
    };
    seg.appendChild(b);
  });
  opRow.appendChild(seg);
  host.appendChild(opRow);

  host.appendChild(n.op === 'add' ? bodyRow(n) : targetRow(n));

  add(sliderRow('Blend', ' mm', () => n.k, v => n.k = v, 0, 25, 0.25));

  P.dims.forEach(([lbl, mn, mx, st], i) =>
    add(sliderRow(lbl, dimUnit(n.t, i), () => n.d[i], v => n.d[i] = v, mn, mx, st)));
  if (P.round)
    add(sliderRow('Corner round', ' mm', () => n.round, v => n.round = v, 0, 20, 0.25));

  // With several shapes picked, Place drives the whole selection as one rigid
  // piece: the slider still reads this shape's value, but what it applies is
  // the *change* — translated straight through, or turned about the group's
  // centre. The size and blend rows stay on this shape alone, since there is
  // no sensible way to resize a mixed bag of primitives together.
  const group = picked.size > 1;
  const ph = document.createElement('h3');
  ph.textContent = group ? `Place — ${picked.size} as one` : 'Place';
  host.appendChild(ph);
  ['X', 'Y', 'Z'].forEach((ax, i) =>
    add(sliderRow('Position ' + ax, ' mm', () => n.p[i],
      group ? v => {
        const d = [0, 0, 0];
        d[i] = v - n.p[i];
        translateSelection(d[0], d[1], d[2]);
        refreshInspectorValues();
      } : v => n.p[i] = v,
      -150, 150, 0.5)));
  ['X', 'Y', 'Z'].forEach((ax, i) =>
    add(sliderRow('Rotate ' + ax, '°', () => n.r[i],
      group ? v => { rotateSelection(i, v - n.r[i]); refreshInspectorValues(); }
            : v => n.r[i] = v,
      -180, 180, 1)));
  // Scale has no absolute to read back -- there is no "size" of a mixed bag
  // of shapes -- so the row carries a running factor and applies the ratio
  // between readings. It resets to 1 whenever the selection changes.
  add(sliderRow('Scale', '\u00d7', scaleFactor,
    v => {
      scaleSelection(v / scaleFactor());
      scaleShown = v;
      refreshInspectorValues();
    }, 0.2, 4, 0.01));

  const mr = document.createElement('div');
  mr.className = 'row';
  mr.innerHTML = '<label><span>Mirror</span></label>';
  const tg = document.createElement('div');
  tg.className = 'toggles';
  [['mx', 'X'], ['my', 'Y'], ['mz', 'Z']].forEach(([key, lbl]) => {
    const b = document.createElement('button');
    b.className = 'btn sm' + (n[key] ? ' on' : '');
    b.textContent = 'Mirror ' + lbl;
    b.onclick = () => {
      snapshot(); n[key] = !n[key];
      sceneChanged(); renderInspector(); save(); needDraw();
    };
    tg.appendChild(b);
  });
  mr.appendChild(tg);
  host.appendChild(mr);
  scheduleInfo();
}

// The add-shape AABB is what the mesher sweeps, but it ignores every cut, so
// it is a poor size readout. Probe the real field on a coarse grid instead.
function probeSize(B) {
  const live = buildPlan(nodes);
  // The cost is grid points times shapes, and the shapes are no longer
  // capped — so the grid is. A four-shape model probes exactly as finely as
  // it always did; a two-hundred-shape one probes coarsely rather than
  // freezing the panel for a readout that was never the accurate number
  // anyway. (The STL is. This is a coarse grid and a bisection.)
  const lim = Math.max(8, Math.min(56,
    Math.round(Math.cbrt(1.5e6 / Math.max(planCount(live), 1)))));
  const span = Math.max(B.hi[0] - B.lo[0], B.hi[1] - B.lo[1],
                        B.hi[2] - B.lo[2], 1);
  const cell = span / 32;
  const N = a => Math.max(2, Math.min(lim,
                 Math.ceil((B.hi[a] - B.lo[a]) / cell) + 1));
  const n = [N(0), N(1), N(2)];
  const d = [0, 1, 2].map(a => (B.hi[a] - B.lo[a]) / (n[a] - 1));
  const lo = [1e9, 1e9, 1e9], hi = [-1e9, -1e9, -1e9];
  // For each of the six extremes keep the *deepest* sample in that outermost
  // slab, not the first one found: bisecting from a thin corner of the slab
  // lands short of the real surface, bisecting from the thick middle doesn't.
  const at = [null, null, null, null, null, null];
  const deep = [0, 0, 0, 0, 0, 0];
  let any = false;
  for (let i = 0; i < n[0]; i++) {
    const x = B.lo[0] + i * d[0];
    for (let j = 0; j < n[1]; j++) {
      const y = B.lo[1] + j * d[1];
      for (let k = 0; k < n[2]; k++) {
        const z = B.lo[2] + k * d[2];
        const v = sceneSDF(live, x, y, z);
        if (v >= 0) continue;
        any = true;
        const P = [x, y, z];
        for (let a = 0; a < 3; a++) {
          if (P[a] < lo[a] || (P[a] === lo[a] && v < deep[2 * a])) {
            lo[a] = P[a]; at[2 * a] = P; deep[2 * a] = v;
          }
          if (P[a] > hi[a] || (P[a] === hi[a] && v < deep[2 * a + 1])) {
            hi[a] = P[a]; at[2 * a + 1] = P; deep[2 * a + 1] = v;
          }
        }
      }
    }
  }
  if (!any) return null;
  // the grid only brackets each extreme to half a cell — walk the last
  // inside point outward by bisection to land on the surface itself
  const walk = (P, a, limit) => {
    let ins = P[a], out = limit;
    const q = P.slice();
    for (let it = 0; it < 20; it++) {
      const m = 0.5 * (ins + out);
      q[a] = m;
      if (sceneSDF(live, q[0], q[1], q[2]) < 0) ins = m; else out = m;
    }
    return ins;
  };
  for (let a = 0; a < 3; a++) {
    lo[a] = walk(at[2 * a], a, B.lo[a]);
    hi[a] = walk(at[2 * a + 1], a, B.hi[a]);
  }
  return { lo, hi, cell: d };
}

let infoTimer = 0;
function scheduleInfo() {
  clearTimeout(infoTimer);
  infoTimer = setTimeout(updateInfo, 160);
}
function updateInfo() {
  clearTimeout(infoTimer);
  const B = sceneBounds(shownNodes());
  if (!B) { infoEl.textContent = 'Nothing to print yet — add a shape.'; return; }
  const res = parseFloat($('resInp').value);
  const vox = Math.ceil((B.hi[0] - B.lo[0]) / res + 5) *
              Math.ceil((B.hi[1] - B.lo[1]) / res + 5) *
              Math.ceil((B.hi[2] - B.lo[2]) / res + 5);
  const P = probeSize(B);
  if (!P) {
    infoEl.innerHTML = '<span style="color:var(--note)">Everything is cut ' +
      'away — nothing solid left.</span>';
    return;
  }
  const sz = [0, 1, 2].map(a => P.hi[a] - P.lo[a]);
  const under = P.lo[2] < -P.cell[2];
  infoEl.innerHTML =
    `Size ≈ ${sz.map(v => v.toFixed(1)).join(' × ')} mm` +
    (under ? ' · <span style="color:var(--note)">reaches below the plate — ' +
      'a Plane cut at z 0 gives it a flat base</span>' : '') +
    `<br>STL grid ≈ ${(vox / 1e6).toFixed(1)} M voxels` +
    (vox > 12e6 ? ' <span style="color:var(--note)">(coarsen it on a phone)</span>'
                : '') +
    // Which picture is on the screen, and why. A viewport that quietly
    // changed how it draws would read as the renderer having got worse.
    (rayFits ? '' :
      `<br>${slotAt.size} shapes at once is past what the raymarcher holds ` +
      `(${RAY_N}) — the viewport is meshing instead` +
      (meshTris ? `: ${Math.round(meshTris / 1000)}k triangles at `
                  + `${meshRes.toFixed(2)} mm, ${meshMs} ms on the ${meshOn}` : ''));
}

// ---------- add / duplicate / delete ----------
// Which primitives this editor offers. Everything the kernel can draw from a
// handful of numbers is here, `field` once the document has one to place —
// and the rest of the baked family (profile, wire, sweep, construct) is not,
// because each of those is a *drawing* held in a library on the document, and
// MetaMeld has no surface to draw one on. They stay in the kernel and stay
// working: a document written elsewhere that names one still opens, renders
// and exports here.
const offered = () => PRIM_KEYS.filter(k =>
  !PRIMS[k].baked || (k === 'field' && SF.fields.length));

$('addBtn').onclick = () => {
  openModal('Add a shape',
    `<div class="picker">${offered().map(k =>
      `<button data-prim="${k}">${PRIMS[k].name}</button>`).join('')}</div>`,
    card => {
      card.onclick = e => {
        const b = e.target.closest('button[data-prim]');
        if (!b) return;
        snapshot();
        const fresh = makeNode(b.dataset.prim);
        // a field node carries no dimensions of its own: its box comes from
        // the document's baked grid, and its sample range the kernel reads
        // off the library entry itself
        if (isField(fresh) && SF.fields.length) {
          fresh.fi = Math.min(activeField, SF.fields.length - 1);
          fresh.d = SF.fields[fresh.fi].box.slice();
        }
        fresh.b = activeBody;      // build into the body you are standing in
        nodes.push(fresh);
        sel = nodes.length - 1;
        if (selMode === 'single') picked = new Set();
        picked.add(fresh);
        closeModal();
        sceneChanged(); renderList(); renderInspector(); save(); needDraw();
      };
    });
};
const clone = n => JSON.parse(JSON.stringify(n));
const nudge = c => { c.p[0] = Math.min(c.p[0] + 10, 150); return c; };

$('dupBtn').onclick = () => {
  if (!picked.size) return;
  const src = nodes.filter(n => picked.has(n));    // in list order

  // one shape: copy it beside itself, in the body it already belongs to
  if (src.length === 1) {
    snapshot();
    const c = nudge(clone(src[0]));
    nodes.splice(sel + 1, 0, c);
    sel++;
    resetPicked();
    sceneChanged(); renderList(); renderInspector(); save(); needDraw();
    return;
  }

  // several: this is a body being copied, so the copies become a body of
  // their own — dropping them into the source body would just bury them
  // inside the shape they were copied from.
  const from = [...new Set(src.filter(n => n.op === 'add').map(n => n.b))];
  if (!from.length) { showErr('Nothing to duplicate — no shapes, only cuts'); return; }

  // A cut that named only bodies being copied comes along, repointed at the
  // copies. One that was already global reaches the new bodies anyway, so
  // copying it would just double up; one that also names a body staying put
  // would have the copy cutting the original, so neither is brought over.
  const carried = src.filter(n =>
    n.op === 'add' || (n.tg && n.tg.length && n.tg.every(t => from.includes(t))));

  snapshot();
  const toNew = new Map();
  for (const oldId of from) {
    const id = addBody();
    const nb = bodies.find(x => x.id === id);
    if (nb) nb.name = (bodyName(oldId) + ' copy').slice(0, 24);
    toNew.set(oldId, id);
  }
  const made = carried.map(n => {
    const c = nudge(clone(n));
    if (c.op === 'add') c.b = toNew.get(n.b);
    else c.tg = n.tg.map(t => toNew.get(t));
    return c;
  });
  // Slot the copies in right after the source body's last add, not at the end
  // of the list: a cut only reaches what is above it, so appending would drop
  // the copies below the build-plate cut and leave them without a flat bottom.
  let at = 0;
  for (const n of src)
    if (n.op === 'add') at = Math.max(at, nodes.indexOf(n) + 1);
  nodes.splice(at, 0, ...made);
  activeBody = toNew.get(from[0]);
  picked = new Set(made);
  sel = nodes.indexOf(made[0]);
  syncBodies();
  sceneChanged(); renderList(); renderInspector(); save(); needDraw();
};
$('delBtn').onclick = () => {
  if (!picked.size) return;
  snapshot();
  const doomed = picked;
  const first = nodes.findIndex(n => doomed.has(n));
  nodes = nodes.filter(n => !doomed.has(n));
  sel = Math.max(0, Math.min(first, nodes.length - 1));
  resetPicked();
  syncBodies();   // keep targets and the active body pointing at what is left
  sceneChanged(); renderList(); renderInspector(); save(); needDraw();
};

// ---------- files ----------
// The paste box is fine for a handful of primitives and hopeless once a baked
// field is in the document -- half a megabyte of base64 is not something to
// select by hand. These are the same document, through a file instead.
function currentDoc() {
  return { version: 2, bodies, nodes,
           fields: SF.fields.length ? SF.fields.map(encodeField) : undefined };
}
$('saveBtn').onclick = () => {
  const name = (prompt('Save as', 'metameld_model.json') || '').trim();
  if (!name) return;
  deliver(new Blob([JSON.stringify(currentDoc())], { type: 'application/json' }),
          name.endsWith('.json') ? name : name + '.json');
  setStatus('saved ' + name);
};
// Import merges instead of replacing, which is how two documents that were
// authored apart -- a body from one file, a cutter from another -- end up in
// the same scene. Bodies and baked fields are renumbered on the way in so
// nothing collides with what is already here.
function importDoc(d) {
  const list = (d && (d.nodes || d)) || [];
  if (!Array.isArray(list) || !list.some(n => n && PRIMS[n.t]))
    throw new Error('no shapes in that file');
  const incoming = list.filter(n => n && PRIMS[n.t]).map(n => makeNode(n.t, n));
  const rawF = d.fields || (d.field ? [d.field] : []);
  const newF = rawF.map(decodeField).filter(Boolean);
  if (SF.fields.length + newF.length > MAXFIELDS)
    throw new Error(`that would make ${SF.fields.length + newF.length} baked `
                    + `shapes; the limit is ${MAXFIELDS}`);
  const fBase = SF.fields.length;
  SF.fields = SF.fields.concat(newF);

  const idBase = bodies.reduce((m, b) => Math.max(m, b.id), -1) + 1;
  const srcBodies = (d.bodies || []).filter(b => b && typeof b.id === 'number');
  const remap = new Map();
  for (const b of srcBodies) {
    remap.set(b.id, idBase + remap.size);
    bodies.push({ id: remap.get(b.id),
                  name: String(b.name || 'Body'), on: b.on !== false });
  }
  const mapId = id => remap.has(id) ? remap.get(id)
    : (remap.set(id, idBase + remap.size),
       bodies.push({ id: remap.get(id), name: 'Body', on: true }),
       remap.get(id));
  for (const n of incoming) {
    if (typeof n.b !== 'number') n.b = 0;
    n.b = mapId(n.b);
    if (n.op === 'add') n.tg = null;
    else if (Array.isArray(n.tg)) n.tg = n.tg.map(mapId);
    if (isField(n)) n.fi = fBase + Math.min(Math.max(n.fi || 0, 0),
                                            Math.max(newF.length - 1, 0));
  }
  nodes = nodes.concat(incoming);
  syncBodies();
  picked = new Set(incoming);          // what you just brought in, selected
  sel = nodes.indexOf(incoming[0]);
  if (incoming[0]) activeBody = incoming[0].b;
}

$('openBtn').onclick = () => $('fileInp').click();
$('importBtn').onclick = () => { pendingImport = true; $('fileInp').click(); };
let pendingImport = false;
$('fileInp').onchange = e => {
  const file = e.target.files && e.target.files[0];
  if (!file) return;
  // capture it now: the read is asynchronous, and clearing the flag when the
  // handler returns would leave onload seeing false and replacing the document
  const merge = pendingImport;
  pendingImport = false;
  const r = new FileReader();
  r.onload = () => {
    try {
      const d = JSON.parse(r.result);
      const list = (d && (d.nodes || d)) || [];
      if (!Array.isArray(list) || !list.some(n => n && PRIMS[n.t])) {
        // a fish shape file is curves, which this editor has no evaluator for.
        // It is a reasonable thing to try, so say what to do instead.
        const fish = d && (d.kind === 'flexifish-nurbs'
                           || (d.shape && d.shape.curves) || d.curves);
        throw new Error(fish
          ? 'that is a fish shape file — use Field JSON in the fish editor '
            + 'to bake it, then open that'
          : 'no shapes in that file');
      }
      snapshot();
      if (merge) { importDoc(d); setStatus('imported ' + file.name); }
      else { adopt(d); sel = 0; setStatus('opened ' + file.name); }
      sceneChanged(); renderList(); renderInspector(); save(); frameModel();
    } catch (err) { showErr('open: ' + err.message); }
  };
  r.onerror = () => showErr('open: could not read that file');
  r.readAsText(file);
  e.target.value = '';        // so the same file can be opened twice
};

  v => {

document.body.addEventListener('click', e => {

let building = false, cached = null;      // { key, blob } from the last build
const stlKey = res =>
  JSON.stringify({ n: nodes.filter(n => n.on), b: bodies }) + '@' + res;

$('stlBtn').onclick = () => {
  if (building) return;
  const B = sceneBounds(shownNodes());
  if (!B) { showErr('Nothing to export — add a shape first'); return; }
  const res = parseFloat($('resInp').value);
  // Building runs across several frames, so by the time it ends iOS has
  // forgotten the tap and refuses the share sheet. Keep the blob: this second
  // tap is a fresh gesture, and handing it over now always works.
  if (cached && cached.key === stlKey(res)) {
    deliver(cached.blob, 'metameld_model.stl');
    setStatus('sent metameld_model.stl');
    return;
  }
  const pad = 2 * res;
  const x0 = B.lo[0] - pad, y0 = B.lo[1] - pad, z0 = B.lo[2] - pad;
  const nx = Math.ceil((B.hi[0] - B.lo[0] + 2 * pad) / res) + 1;
  const ny = Math.ceil((B.hi[1] - B.lo[1] + 2 * pad) / res) + 1;
  const nz = Math.ceil((B.hi[2] - B.lo[2] + 2 * pad) / res) + 1;
  const total = nx * ny * nz;
  // the grid is 4 bytes a voxel; iOS kills a tab that asks for too much, so
  // stop well short of that on a phone rather than losing the model with it
  const cap = matchMedia('(pointer: coarse)').matches ? 14e6 : 40e6;
  if (total > cap) {
    showErr('Grid too big (' + (total / 1e6).toFixed(0) + ' M voxels, limit ' +
            (cap / 1e6) + ' M) — raise the resolution number');
    return;
  }
  const live = buildPlan(nodes);
  const t0 = Date.now();
  building = true;
  $('stlBtn').disabled = true;

  // What to do with a finished mesh, whichever way the grid was filled.
  const finish = (mesh) => {
    const nt = mesh ? mesh.indices.length / 3 : 0;
    building = false; $('stlBtn').disabled = false;
    if (!nt) { showErr('The model is empty at this resolution'); setStatus(''); return; }
    const blob = meshToSTL(mesh, 'MetaMeld(TM) model (mm) - metameld');
    cached = { key: stlKey(res), blob };
    setStatus(nt.toLocaleString() + ' triangles · ' +
              ((Date.now() - t0) / 1000).toFixed(1) + ' s');
    deliver(blob, 'metameld_model.stl', () =>
      setStatus(nt.toLocaleString() + ' triangles ready — tap Save STL again'));
  };

  // Filling the grid is one evaluation per corner and essentially all of the
  // cost of an export, so it goes to the GPU when there is a GPU to send it
  // to: the same map(), compiled from the same GLSL, rendered into a float
  // target a slab at a time. What comes back is the grid the loop below would
  // have written, and the kernel's own mesher walks it either way.
  const gpu = sampler() && planCount(live) <= GPU_N ? sampler() : null;
  if (gpu) {
    setStatus('building STL…');
    // one frame first, so the disabled button and the status are painted
    // before the page goes away to do it
    requestAnimationFrame(() => {
      let m = null;
      try { m = SF.mesh(live, { res, bounds: B, sample: gpu, maxSamples: cap }); }
      catch (e) {
        building = false; $('stlBtn').disabled = false;
        showErr('mesh: ' + e.message);
        return;
      }
      finish(m);
    });
    return;
  }

  let vol;
  try { vol = new Float32Array(total); }
  catch (e) {
    building = false; $('stlBtn').disabled = false;
    showErr('Out of memory for the grid — raise the resolution');
    return;
  }
  let i = 0;
  // slice at a time, back to the event loop between slices: a phone stays
  // responsive and Safari never shows the "page is unresponsive" sheet
  const step = () => {
    const until = performance.now() + 24;
    while (i < nx && performance.now() < until) {
      const x = x0 + i * res;
      let idx = i * ny * nz;
      for (let j = 0; j < ny; j++) {
        const y = y0 + j * res;
        for (let k = 0; k < nz; k++)
          vol[idx++] = sceneSDF(live, x, y, z0 + k * res);
      }
      i++;
    }
    setStatus('building STL… ' + Math.round(100 * i / nx) + '%');
    if (i < nx) { requestAnimationFrame(step); return; }
    let mesh;
    try { mesh = surfaceNets(vol, nx, ny, nz, x0, y0, z0, res); }
    catch (e) { showErr('mesh: ' + e.message); building = false;
                $('stlBtn').disabled = false; return; }
    finish(mesh);
  };
  requestAnimationFrame(step);
};

function deliver(blob, name, onRefused) {
  const file = new File([blob], name, { type: 'model/stl' });
  // iOS: the share sheet drops the file straight into Files, AirDrop or a
  // slicer app; a plain download link there is a dead end more often than not
  if (navigator.canShare && navigator.canShare({ files: [file] })) {
    navigator.share({ files: [file], title: name }).catch(err => {
      if (err && err.name === 'AbortError') return;      // user hit cancel
      if (onRefused) onRefused(); else downloadBlob(blob, name);
    });
    return;
  }
  downloadBlob(blob, name);
}
function downloadBlob(blob, name) {
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = name;
  document.body.appendChild(a); a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 2000);
}

// ---------- bottom sheet drag ----------
const panel = $('panel'), grip = $('grip');
const SNAPS = [0.16, 0.52, 0.88];
let sheet = 1, dragFrom = null, dragH = 0;
function setSheet(fr) {
  document.documentElement.style.setProperty('--sheet', (fr * 100).toFixed(1) + 'vh');
  needDraw();
}
grip.addEventListener('pointerdown', e => {
  grip.setPointerCapture(e.pointerId);
  dragFrom = e.clientY;
  dragH = panel.getBoundingClientRect().height;
  panel.classList.add('drag');
});
grip.addEventListener('pointermove', e => {
  if (dragFrom === null) return;
  const h = Math.min(Math.max(dragH - (e.clientY - dragFrom), 60), innerHeight * 0.92);
  setSheet(h / innerHeight);
});
function gripEnd() {
  if (dragFrom === null) return;
  dragFrom = null;
  panel.classList.remove('drag');
  const fr = panel.getBoundingClientRect().height / innerHeight;
  sheet = SNAPS.reduce((b, s, i) =>
    Math.abs(s - fr) < Math.abs(SNAPS[b] - fr) ? i : b, 0);
  setSheet(SNAPS[sheet]);
}
grip.addEventListener('pointerup', gripEnd);
grip.addEventListener('pointercancel', gripEnd);
grip.addEventListener('click', () => {
  if (dragFrom !== null) return;
  sheet = (sheet + 1) % SNAPS.length;
  setSheet(SNAPS[sheet]);
});

// ---------- go ----------
sceneChanged();
renderList();
renderInspector();
$('resVal').textContent = parseFloat($('resInp').value).toFixed(2) + ' mm';
setHint();
frameModel();
setStatus(nodes.length + ' shapes');
needDraw();

} catch (err) {
  showErr('Startup: ' + err.message);
  throw err;
}
</script>
</body>
</html>
