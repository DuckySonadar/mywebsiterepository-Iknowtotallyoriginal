function snapshot() {
  undoStack.push(JSON.stringify({ nodes, bodies, sel, activeBody }));
  if (undoStack.length > 40) undoStack.shift();
  document.getElementById('undoBtn').disabled = false;
}
function undo() {
  const s = undoStack.pop();
  if (!s) return;
  const d = JSON.parse(s);
  nodes = d.nodes; sel = Math.min(d.sel, nodes.length - 1);
  if (Array.isArray(d.bodies) && d.bodies.length) bodies = d.bodies;
  if (typeof d.activeBody === 'number') activeBody = d.activeBody;
  syncBodies(); resetPicked();
  document.getElementById('undoBtn').disabled = !undoStack.length;
  sceneChanged(); renderList(); save(); needDraw();
}
// Every edit ends here — that is what makes this the one place the meshed
// view can be invalidated from without hunting down each mutation. A camera
// move or a resize never saves, which is exactly the distinction the mesh
// cares about: the model changed, so the triangles are of something else.
function save() {
  dropMesh();
  try { localStorage.setItem(STORE, JSON.stringify(
      { nodes, bodies, sel, activeBody,
        fields: SF.fields.length ? SF.fields.map(encodeField) : undefined })); }
  catch (e) { /* private browsing: editing still works, it just won't persist */ }
}

// Takes a stored or pasted document into the editor. Documents written before
// bodies existed have neither `bodies` nor `b`/`tg` on their shapes; they load
// as one body whose cuts are all global, which is what they always meant.
function adopt(doc) {
  const list = (doc && (doc.nodes || doc)) || [];
  if (!Array.isArray(list)) return false;
  const kept = list.filter(n => n && PRIMS[n.t]).map(n => makeNode(n.t, n));
  if (!kept.length) return false;
  // Baked fields, decoded before anything else is committed: a corrupt one
  // should fail the load, not half-apply it. `field` (singular) is the shape
  // the first exports used, still read so those documents keep working.
  const raw = doc.fields || (doc.field ? [doc.field] : []);
  const incoming = raw.slice(0, MAXFIELDS).map(decodeField).filter(Boolean);
  for (const f of SF.fields) if (f.tex) gl.deleteTexture(f.tex);
  SF.fields = incoming;
  nodes = kept;
  bodies = (doc.bodies || []).filter(b => b && typeof b.id === 'number')
             .map(b => ({ id: b.id, name: String(b.name || 'Body ' + (b.id + 1)),
                          on: b.on !== false }));
  // a document may name bodies only on its shapes (v2 pruned empty ones)
  for (const n of nodes)
    if (n.op === 'add' && typeof n.b === 'number' && !bodies.some(b => b.id === n.b))
      bodies.push({ id: n.b, name: 'Body ' + (n.b + 1), on: true });
  activeBody = typeof doc.activeBody === 'number' ? doc.activeBody
             : bodies.length ? bodies[0].id : 0;
  for (const n of nodes) {
    if (typeof n.b !== 'number') n.b = 0;
    if (typeof n.fi !== 'number') n.fi = 0;
    if (isField(n)) n.fi = Math.min(Math.max(n.fi, 0),
                                    Math.max(SF.fields.length - 1, 0));
    if (n.op === 'add') n.tg = null;
    else if (n.tg && !Array.isArray(n.tg)) n.tg = null;
    if (Array.isArray(n.tg)) n.tg = n.tg.filter(id => typeof id === 'number');
  }
  syncBodies();
  picked = new Set();   // open showing the model, not a selection
  return true;
}

function load() {
  try {
    // fall back to the pre-rename key so nobody loses the model they were
    // working on; the next save writes it under the new one
    const raw = localStorage.getItem(STORE) || localStorage.getItem(STORE_OLD);
    const d = JSON.parse(raw || 'null');
    if (adopt(d)) { sel = Math.min(d.sel || 0, nodes.length - 1); return true; }
  } catch (e) {}
  return false;
}
if (!load()) {
  nodes = JSON.parse(JSON.stringify(STARTERS['Ice cream']));
  bodies = [{ id: 0, name: 'Body 1', on: true }];
  activeBody = 0;
  sel = 0;
  picked = new Set();
}

// ======================================================================
// WebGL2 — two ways to draw it
// ======================================================================
// The raymarcher runs the kernel's GLSL per pixel: shadows, ambient
// occlusion, the selection blue mixed across a blend with the same weight the
// distance is. It is the better picture and it is the one this editor is for.
// What it cannot do is scale — every shape in the scene is unrolled into
// `map()`, and `map()` runs a few hundred times per ray.
//
// So there is a second path: mesh the same field with the kernel's own
// surface nets and draw the triangles. Its cost is in the *build*, once per
// edit, and then it draws for nothing however many shapes went into it. That
// makes it the right picture in two places — for a model past what the
// marcher's uniforms hold, and as a stand-in while the camera is moving,
// where the shape is not changing and only the view is.
const canvas = document.getElementById('view');
const gl = canvas.getContext('webgl2', { antialias: false, alpha: false });
if (!gl) {
  showErr('WebGL2 is not available — on iPhone use Safari or Chrome, iOS 15+');
  throw new Error('no webgl2');
}

// ---------- what this GPU can hold ----------
// Three vec4 per shape, plus the camera, the tints and the tolerances. What
// is left of the fragment uniform block after those is how many shapes can be
// handed to a shader at once — a number the driver reports rather than one to
// guess at. GLES 3.0 guarantees 224 vectors and a desktop typically has 1024,
// so this is between 69 and 336 shapes where the old constant said 32.
const UNI = gl.getParameter(gl.MAX_FRAGMENT_UNIFORM_VECTORS) || 224;
const SLOTS = Math.max(8, Math.floor((UNI - 16) / 3));
// glmesh compiles the same map() with none of the shading around it, so it
// gets the whole allowance. Past this the grid is filled in JavaScript
// instead — slower, same answer, and no ceiling.
const GPU_N = SLOTS;
// The marcher stops short of the uniforms, and deliberately. Fitting is not
// the same as being worth drawing: a hundred shapes unrolled into a loop that
// runs 260 times a ray is a slideshow, while the mesh of the same model draws
// in a millisecond. This is where the cheaper of the two changes hands.
const RAY_N = Math.min(SLOTS, matchMedia('(pointer: coarse)').matches ? 48 : 96);
function compile(type, src) {
  const s = gl.createShader(type);
  gl.shaderSource(s, src); gl.compileShader(s);
  if (!gl.getShaderParameter(s, gl.COMPILE_STATUS))
    throw new Error('shader: ' + gl.getShaderInfoLog(s));
  return s;
}
function makeProgram(vs, fs) {
  const pr = gl.createProgram();
  gl.attachShader(pr, compile(gl.VERTEX_SHADER, vs));
  gl.attachShader(pr, compile(gl.FRAGMENT_SHADER, fs));
  gl.linkProgram(pr);
  if (!gl.getProgramParameter(pr, gl.LINK_STATUS))
    throw new Error('link: ' + gl.getProgramInfoLog(pr));
  return pr;
}

const QUAD_VS =
'#version 300 es\n' +
'const vec2 v[3] = vec2[3](vec2(-1.,-1.), vec2(3.,-1.), vec2(-1.,3.));\n' +
'void main(){ gl_Position = vec4(v[gl_VertexID], 0.0, 1.0); }';

// The libraries a slotted primitive's shape comes out of. This editor can
// author only one of the four — baked fields — but a document written
// elsewhere can name any of them, and `slotList` hands back the primitive's
// own default for a slot nothing has filled, so an unknown one draws a shape
// rather than failing to compile.
const slotsFor = plan => ({
  profile: SF.slotList('profile', SF.profiles, GL.maxSlot(plan, 'profile')),
  wire: SF.slotList('wire', SF.wires, GL.maxSlot(plan, 'wire')),
  sweep: SF.slotList('sweep', SF.sweeps, GL.maxSlot(plan, 'sweep')),
  construct: SF.slotList('construct', SF.constructs, GL.maxSlot(plan, 'construct'))
});

function fragSource(plan, mapBody) {
  return `#version 300 es
precision highp float;
out vec4 frag;
uniform vec2 uRes;
uniform vec3 uEye;
uniform mat3 uCam;          // columns: right, up, forward
uniform float uFocal;
uniform vec4 uD[${SLOTS * 3}];
uniform vec3 uTint;
uniform vec3 uSelTint;
// x*t + y: how close a ray has to get before it counts as a hit. Sphere
// tracing stops *near* the surface, not on it, so this is exactly how far
// proud of the real d=0 surface the picture is drawn. Loose while a finger
// is down, tight once the view settles.
uniform vec2 uHit;
${GL.samplerDecls(MAXFIELDS).trimEnd()}
${GL.foldSource()}

// How much of the *accumulated* side survives a smin/smax. The colour has to
// be mixed with the same weight the distance is, or the blue would sit off
// the blend instead of fading across it. Set by map(), read after the hit.
// These are the folds' twins and have to be kept in step with them by hand:
// smin's h, and smax's, which is smin's with the sign of the difference
// turned round.
float gSel;
float wmin(float a, float b, float k){
  return (k <= 0.0) ? ((a < b) ? 1.0 : 0.0)
                    : clamp(0.5 + 0.5*(b - a)/k, 0.0, 1.0);
}
float wmax(float a, float b, float k){
  return (k <= 0.0) ? ((a > b) ? 1.0 : 0.0)
                    : clamp(0.5 - 0.5*(b - a)/k, 0.0, 1.0);
}
${GL.library(PRIM_KEYS)}
${GL.slotBlock(plan, slotsFor(plan))}

float map(vec3 P){
  float d = 1e9, dB, di, w, sw = 0.0, swB = 0.0; vec3 q;
${mapBody}  gSel = sw;
  return d;
}

vec3 normalAt(vec3 p){
  // tetrahedron differences: 4 evaluations instead of 6
  const vec2 e = vec2(1.0, -1.0)*0.0015;
  return normalize(e.xyy*map(p + e.xyy) + e.yyx*map(p + e.yyx) +
                   e.yxy*map(p + e.yxy) + e.xxx*map(p + e.xxx));
}
float shadow(vec3 ro, vec3 rd, float tmax){
  float res = 1.0, t = 0.6;
  for (int i = 0; i < 48; i++){
    float h = map(ro + rd*t);
    res = min(res, 12.0*h/t);
    // smooth blends make map() an over-estimate, so creep along it
    t += clamp(h*0.7, 0.25, 4.0);
    if (res < 0.02 || t > tmax) break;
  }
  return clamp(res, 0.0, 1.0);
}
float ao(vec3 p, vec3 n){
  float occ = 0.0, sca = 1.0;
  for (int i = 0; i < 5; i++){
    float h = 0.4 + 1.6*float(i)/5.0;
    occ += (h - map(p + n*h))*sca;
    sca *= 0.7;
  }
  return clamp(1.0 - 0.9*occ, 0.0, 1.0);
}

void main(){
  vec2 uv = (gl_FragCoord.xy - 0.5*uRes)/uRes.y;
  vec3 rd = normalize(uCam*vec3(uv, uFocal));
  vec3 ro = uEye;

  // model
  float t = 0.0, tMax = 2000.0;
  bool hit = false;
  for (int i = 0; i < 260; i++){
    float d = map(ro + rd*t);
    if (d < uHit.x*t + uHit.y) { hit = true; break; }
    // neither smin nor the ellipsoid bound is a true distance: full steps
    // tunnel through thin blended shoulders and leave banding behind
    t += d*0.72;
    if (t > tMax) break;
  }
  // build plate at z = 0
  float tg = (rd.z < -1e-5) ? (-ro.z/rd.z) : -1.0;
  bool ground = tg > 0.0 && (!hit || tg < t);

  vec3 col;
  if (ground){
    vec3 p = ro + rd*tg;
    float fade = exp(-0.0022*tg);
    vec2 g = abs(fract(p.xy/10.0 + 0.5) - 0.5)/fwidth(p.xy/10.0);
    float minor = 1.0 - min(min(g.x, g.y), 1.0);
    vec2 G = abs(fract(p.xy/50.0 + 0.5) - 0.5)/fwidth(p.xy/50.0);
    float major = 1.0 - min(min(G.x, G.y), 1.0);
    col = mix(vec3(0.055, 0.070, 0.085), vec3(0.16, 0.20, 0.24), minor*0.55);
    col = mix(col, vec3(0.26, 0.32, 0.38), major*0.6);
    float sh = shadow(p + vec3(0.0, 0.0, 0.05), normalize(vec3(0.42, -0.5, 0.76)), 400.0);
    col *= mix(0.35, 1.0, sh)*fade;
    col = mix(vec3(0.063, 0.078, 0.094), col, fade);
  } else if (hit){
    vec3 p = ro + rd*t;
    vec3 n = normalAt(p);
    vec3 L1 = normalize(vec3(0.42, -0.5, 0.76));
    vec3 L2 = normalize(vec3(-0.6, 0.55, 0.25));
    float dif = max(dot(n, L1), 0.0)*0.78*mix(0.35, 1.0, shadow(p + n*0.05, L1, 400.0))
              + max(dot(n, L2), 0.0)*0.22;
    vec3 V = normalize(uEye - p);
    float spec = pow(max(dot(n, normalize(L1 + V)), 0.0), 40.0)*0.35;
    float amb = (0.30 + 0.12*n.z)*ao(p, n);
    // normalAt() ran map() four times, so re-read the field here for gSel
    map(p);
    vec3 base = mix(uTint, uSelTint, clamp(gSel, 0.0, 1.0));
    col = base*(amb + dif) + vec3(spec);
    col = pow(col, vec3(0.62));
  } else {
    col = mix(vec3(0.063, 0.078, 0.094), vec3(0.10, 0.12, 0.145),
              clamp(rd.z*1.6 + 0.4, 0.0, 1.0));
  }
  frag = vec4(col, 1.0);
}`;
}

const lineProg = makeProgram(
'#version 300 es\n' +
'layout(location=0) in vec3 aPos;\n' +
'uniform mat4 uMVP;\n' +
'void main(){ gl_Position = uMVP*vec4(aPos, 1.0); }',
'#version 300 es\n' +
'precision highp float;\n' +
'uniform vec3 uC;\n' +
'out vec4 frag;\n' +
'void main(){ frag = vec4(uC, 1.0); }');
const lineVAO = gl.createVertexArray();
gl.bindVertexArray(lineVAO);
const lineBuf = gl.createBuffer();
gl.bindBuffer(gl.ARRAY_BUFFER, lineBuf);
gl.enableVertexAttribArray(0);
gl.vertexAttribPointer(0, 3, gl.FLOAT, false, 0, 0);
gl.bindVertexArray(null);

const emptyVAO = gl.createVertexArray();
let prog = null, U = {};
// Which uniform slot each shape's data goes in, for whatever was last
// compiled. Empty when the model is past RAY_N and no shader was built.
let slotAt = new Map();
let rayFits = true;
const uData = new Float32Array(SLOTS * 12);

// The *structure* of the model changed: which shapes exist, what type or
// operation they are, which body they build or cut, whether they are mirrored.
// Values — a position, a radius, a blend — do not come through here, because
// they only move uniforms and the compiled shader already reads those.
function sceneChanged() {
  dropMesh();
  const plan = buildPlan(nodes);
  // Slots are per *shape*, not per appearance: a cut aimed at three bodies is
  // emitted three times in map() and packed once.
  const at = new Map();
  for (const part of plan)
    for (const n of part.nodes) if (!at.has(n)) at.set(n, at.size);
  slotAt = at;
  rayFits = at.size <= RAY_N;
  if (!rayFits) {
    // Nothing to compile — the mesh is the picture now. The old program goes
    // back to the driver rather than sitting there holding a model it cannot
    // draw.
    if (prog) { gl.deleteProgram(prog); prog = null; }
    errbar.style.display = 'none';
    scheduleProxy();
    return;
  }
  let body = '';
  for (const part of plan) {
    body += '  dB = 1e9; swB = 0.0;\n';
    for (const n of part.nodes) {
      const i = at.get(n);
      if (i === undefined) continue;
      const b = 3 * i;
      body += '  q = P;\n';
      // mirror the *world* point, so a shape at x = 20 also appears at x = -20
      if (n.mx) body += '  q.x = abs(q.x);\n';
      if (n.my) body += '  q.y = abs(q.y);\n';
      if (n.mz) body += '  q.z = abs(q.z);\n';
      body += `  q = invRot(q - uD[${b}].xyz, uD[${b + 1}].xyz);\n`;
      // GL.call knows the sampler-first calling convention for a baked field
      // and the slot-in-the-name convention for a compiled outline, so this
      // no longer has to. Only a field's slot is a texture unit and only a
      // field's is clamped to the texture budget.
      const fi = isField(n) ? Math.min(Math.max(n.fi || 0, 0), MAXFIELDS - 1)
                            : Math.max(n.fi || 0, 0);
      body += `  di = ${GL.call(n.t, 'q', `uD[${b + 2}].xyz`,
                                `uD[${b + 1}].w`, fi)};\n`;
      // weight first, then the distance: wmin/wmax need the pre-blend dB
      if (n.op === 'add') {
        body += `  w = wmin(dB, di, uD[${b}].w);\n`;
        body += `  dB = smin(dB, di, uD[${b}].w);\n`;
      } else if (n.op === 'cut') {
        body += `  w = wmax(dB, -di, uD[${b}].w);\n`;
        body += `  dB = smax(dB, -di, uD[${b}].w);\n`;
      } else {
        body += `  w = wmax(dB, di, uD[${b}].w);\n`;
        body += `  dB = smax(dB, di, uD[${b}].w);\n`;
      }
      body += `  swB = mix(uD[${b + 2}].w, swB, w);\n`;
    }
    // plain min: bodies must not blend, so the colour switches rather than fades
    body += '  if (dB < d) { d = dB; sw = swB; }\n';
  }
  if (!body) body = '  d = 1e9;\n';
  let np;
  try { np = makeProgram(QUAD_VS, fragSource(plan, body)); }
  catch (e) { showErr(String(e.message).slice(0, 200)); return; }
  if (prog) gl.deleteProgram(prog);
  prog = np;
  U = {};
  for (const k of ['uRes', 'uEye', 'uCam', 'uFocal', 'uTint', 'uSelTint', 'uHit'])
    U[k] = gl.getUniformLocation(prog, k);
  for (let i = 0; i < MAXFIELDS; i++)
    U['uField' + i] = gl.getUniformLocation(prog, 'uField' + i);
  U.uD = gl.getUniformLocation(prog, 'uD[0]');
  errbar.style.display = 'none';
  scheduleProxy();
}

// The field as a 3D texture, uploaded once and left on unit 0. A scene with
// no field still binds something: sampling an unbound sampler3D is undefined,
// and on some drivers it is a black screen rather than a warning.
let blankTex = null;
function bindField() {
  if (!blankTex) {
    blankTex = gl.createTexture();
    gl.bindTexture(gl.TEXTURE_3D, blankTex);
    gl.texStorage3D(gl.TEXTURE_3D, 1, gl.R8, 1, 1, 1);
    gl.texSubImage3D(gl.TEXTURE_3D, 0, 0, 0, 0, 1, 1, 1,
                     gl.RED, gl.UNSIGNED_BYTE, new Uint8Array([255]));
    for (const k of [gl.TEXTURE_MIN_FILTER, gl.TEXTURE_MAG_FILTER])
      gl.texParameteri(gl.TEXTURE_3D, k, gl.LINEAR);
  }
  for (let i = 0; i < MAXFIELDS; i++) {
    const f = SF.fields[i];
    if (f && !f.tex) {
      f.tex = gl.createTexture();
      gl.bindTexture(gl.TEXTURE_3D, f.tex);
      gl.pixelStorei(gl.UNPACK_ALIGNMENT, 1);
      // the grid is stored x-major (x*ny + y)*nz + z, which is exactly the
      // order texImage3D wants with width = nz, height = ny, depth = nx
      gl.texStorage3D(gl.TEXTURE_3D, 1, gl.R8, f.nz, f.ny, f.nx);
      gl.texSubImage3D(gl.TEXTURE_3D, 0, 0, 0, 0, f.nz, f.ny, f.nx,
                       gl.RED, gl.UNSIGNED_BYTE, f.data);
      for (const k of [gl.TEXTURE_MIN_FILTER, gl.TEXTURE_MAG_FILTER])
        gl.texParameteri(gl.TEXTURE_3D, k, gl.LINEAR);
      for (const k of [gl.TEXTURE_WRAP_S, gl.TEXTURE_WRAP_T, gl.TEXTURE_WRAP_R])
        gl.texParameteri(gl.TEXTURE_3D, k, gl.CLAMP_TO_EDGE);
    }
    gl.activeTexture(gl.TEXTURE0 + i);
    gl.bindTexture(gl.TEXTURE_3D, f ? f.tex : blankTex);
    gl.uniform1i(U['uField' + i], i);
  }
}

function packUniforms() {
  // Three vec4 a shape, in a fixed order, is a contract between the source
  // glsl.js generated and whoever fills the array — so it is filled by the
  // same file rather than written out a second time here. That includes the
  // rule that a baked field takes its sample *range* through the slot every
  // other primitive uses for corner rounding: pack `round` there by hand and
  // the field comes out multiplied by zero, which draws as its bounding box
  // and looks exactly like a texture that never arrived.
  GL.packPlan(slotAt, { maxN: SLOTS, roundSlot, into: uData });
  // The twelfth float is the one the kernel has no opinion about. It drives
  // the blue.
  for (const [n, i] of slotAt) uData[12 * i + 11] = picked.has(n) ? 1 : 0;
}

// ======================================================================
// the meshed view
// ======================================================================
// The same field, found the other way: sampled on a grid and walked into
// triangles by the kernel's surface nets — the same mesher the STL comes out
// of, at a coarser spacing. Once built it draws as a vertex buffer, which
// costs the same for four hundred shapes as for four.
//
// Plain by design. It has no selection blue, because a triangle does not know
// which shape it came from and the wireframe boxes already say what is picked;
// no shadows and no ambient occlusion, because those are ray queries against a
// field this path does not have. What it does have is the outline, and the
// outline is the thing you are modelling.
const MESH_VS = `#version 300 es
layout(location=0) in vec3 aP;
layout(location=1) in vec3 aN;
uniform mat4 uMVP;
out vec3 vN; out vec3 vW;
void main(){ vN = aN; vW = aP; gl_Position = uMVP*vec4(aP, 1.0); }`;
const MESH_FS = `#version 300 es
precision highp float;
in vec3 vN; in vec3 vW; out vec4 frag;
uniform vec3 uTint; uniform vec3 uEye;
void main(){
  vec3 n = normalize(vN);
  vec3 L1 = normalize(vec3(0.42, -0.5, 0.76));
  vec3 L2 = normalize(vec3(-0.6, 0.55, 0.25));
  // the marcher's lighting with its two ray queries replaced by their
  // averages, so switching between the pictures is not a change of scene
  float dif = max(dot(n, L1), 0.0)*0.78*0.80 + max(dot(n, L2), 0.0)*0.22;
  vec3 V = normalize(uEye - vW);
  float spec = pow(max(dot(n, normalize(L1 + V)), 0.0), 40.0)*0.35;
  float amb = (0.30 + 0.12*n.z)*0.85;
  frag = vec4(pow(uTint*(amb + dif) + vec3(spec), vec3(0.62)), 1.0);
}`;

let meshProg = null, meshU = {}, meshVao = null, meshBufs = [], meshCount = 0;
let meshStale = true, meshTris = 0, meshMs = 0, meshRes = 0, meshOn = '';

// Marks the triangles as being of a different model. Called from save(), which
// every edit ends with — see the note there.
function dropMesh() { meshStale = true; }

function freeMesh() {
  if (meshVao) gl.deleteVertexArray(meshVao);
  for (const b of meshBufs) gl.deleteBuffer(b);
  meshVao = null; meshBufs = []; meshCount = 0;
}

// glmesh fills the grid by compiling the same map() and rendering it into a
// float target: one SDF evaluation per corner, which is essentially all of the
// cost of meshing, done on the hardware that is good at it. Resolved once,
// because asking makes a context.
let gpuSample;
function sampler() {
  if (gpuSample === undefined)
    gpuSample = (GM && GM.available(gl))
      ? GM.sampler({ gl, maxN: GPU_N, maxFields: MAXFIELDS }) : null;
  return gpuSample;
}
const planCount = plan => {
  const seen = new Set();
  for (const part of plan) for (const n of part.nodes) seen.add(n);
  return seen.size;
};

// Grid spacing for a picture, which is a different question from the STL's.
// Here the answer wanted is "as fine as a few milliseconds buys", so it comes
// from a sample budget and the model's own size rather than from the export
// slider. On the GPU that is a grid around 120 cubed; in JavaScript it has to
// be an order of magnitude coarser, and the picture says so by looking it.
const VIEW_SAMPLES = matchMedia('(pointer: coarse)').matches ? 6e5 : 1.6e6;
function viewRes(B) {
  const vol = [0, 1, 2].reduce((a, i) => a * Math.max(B.hi[i] - B.lo[i], 1), 1);
  const budget = sampler() ? VIEW_SAMPLES : 1.5e5;
  return Math.min(Math.max(Math.cbrt(vol / budget), 0.25), 8);
}

function buildMesh() {
  const t0 = Date.now();
  // whatever happens below, do not come back and try it again next frame
  meshStale = false;
  const plan = buildPlan(nodes);
  const B = sceneBounds(shownNodes());
  if (!B || !plan.length) { freeMesh(); meshTris = 0; return; }
  const res = viewRes(B);
  // Past the GPU's uniform block there is no shader to fill the grid with, so
  // the kernel's own JavaScript does it. Slower by a lot; the same answer.
  const use = sampler() && planCount(plan) <= GPU_N ? sampler() : null;
  let m = null;
  try { m = SF.mesh(plan, { res, bounds: B, sample: use, maxSamples: 8e6 }); }
  catch (e) { freeMesh(); meshTris = 0; showErr('view: ' + e.message); return; }
  if (!m || !m.indices.length) { freeMesh(); meshTris = 0; return; }

  const P = m.positions, I = m.indices;
  const N = new Float32Array(P.length);
  for (let t = 0; t < I.length; t += 3) {
    const a = 3 * I[t], b = 3 * I[t + 1], c = 3 * I[t + 2];
    const ux = P[b] - P[a], uy = P[b + 1] - P[a + 1], uz = P[b + 2] - P[a + 2];
    const vx = P[c] - P[a], vy = P[c + 1] - P[a + 1], vz = P[c + 2] - P[a + 2];
    const nx = uy * vz - uz * vy, ny = uz * vx - ux * vz, nz = ux * vy - uy * vx;
    for (const o of [a, b, c]) { N[o] += nx; N[o + 1] += ny; N[o + 2] += nz; }
  }
  if (!meshProg) {
    meshProg = makeProgram(MESH_VS, MESH_FS);
    for (const k of ['uMVP', 'uTint', 'uEye'])
      meshU[k] = gl.getUniformLocation(meshProg, k);
  }
  // The last mesh's buffers go back to the driver first. An edit rebuilds this
  // every time the view settles, and a vertex array and three buffers apiece
  // is real memory that nothing else was ever going to reclaim.
  freeMesh();
  meshVao = gl.createVertexArray();
  gl.bindVertexArray(meshVao);
  const put = (data, loc) => {
    const buf = gl.createBuffer();
    meshBufs.push(buf);
    gl.bindBuffer(gl.ARRAY_BUFFER, buf);
    gl.bufferData(gl.ARRAY_BUFFER, data, gl.STATIC_DRAW);
    gl.enableVertexAttribArray(loc);
    gl.vertexAttribPointer(loc, 3, gl.FLOAT, false, 0, 0);
  };
  put(P, 0); put(N, 1);
  const eb = gl.createBuffer();
  meshBufs.push(eb);
  gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER, eb);
  gl.bufferData(gl.ELEMENT_ARRAY_BUFFER, I, gl.STATIC_DRAW);
  gl.bindVertexArray(null);
  meshCount = I.length;
  meshTris = I.length / 3;
  meshRes = res;
  meshOn = use ? 'GPU' : 'JS';
  meshMs = Date.now() - t0;
}

// ---------- camera ----------
// One vertical field of view shared by the raymarcher, the line overlay and
// the drag-to-move maths — they disagree visibly if it is written out twice.
const FOV = 45 * Math.PI / 180;
const TAN_HALF_FOV = Math.tan(FOV / 2);
const cam = { yaw: -0.9, pitch: 0.45, dist: 150, tgt: [0, 0, 12] };
function camEye() {
  const cp = Math.cos(cam.pitch);
  return [cam.tgt[0] + cam.dist * cp * Math.cos(cam.yaw),
          cam.tgt[1] + cam.dist * cp * Math.sin(cam.yaw),
          cam.tgt[2] + cam.dist * Math.sin(cam.pitch)];
}
function camBasis() {
  const eye = camEye();
  let f = [cam.tgt[0] - eye[0], cam.tgt[1] - eye[1], cam.tgt[2] - eye[2]];
  const fl = Math.hypot(f[0], f[1], f[2]) || 1;
  f = [f[0] / fl, f[1] / fl, f[2] / fl];
  let r = [f[1], -f[0], 0];                   // f × worldUp(0,0,1)
  const rl = Math.hypot(r[0], r[1], r[2]) || 1;
  r = [r[0] / rl, r[1] / rl, 0];
  const u = [r[1] * f[2] - r[2] * f[1], r[2] * f[0] - r[0] * f[2],
             r[0] * f[1] - r[1] * f[0]];
  return { eye, r, u, f };
}
// The canvas runs full-bleed behind the bottom sheet, so the part of it you
// can actually see is only the band above the sheet — fit the model to that.
function visibleBand() {
  const w = canvas.clientWidth || innerWidth;
  const H = canvas.clientHeight || innerHeight;
  const pr = panel.getBoundingClientRect();
  const overlaps = pr.left < w - 1 && pr.top < H;      // false on the desktop rail
  const hidden = overlaps ? Math.min(Math.max(H - pr.top, 0), H * 0.8) : 0;
  return { w, H, h: H - hidden, hidden };
}
function frameModel() {
  const B = sceneBounds(shownNodes());
  if (!B) { cam.tgt = [0, 0, 12]; cam.dist = 150; needDraw(); return; }
  cam.tgt = [(B.lo[0] + B.hi[0]) / 2, (B.lo[1] + B.hi[1]) / 2,
             (B.lo[2] + B.hi[2]) / 2];
  // bounding sphere, so the fit holds at every orbit angle
  const R = Math.max(0.5 * Math.hypot(B.hi[0] - B.lo[0], B.hi[1] - B.lo[1],
                                      B.hi[2] - B.lo[2]), 5);
  const V = visibleBand();
  // the projection maps the whole canvas height to 2*dist*tan(fov/2); a band
  // of p pixels therefore shows 2*dist*tan(fov/2)*p/H of world
  const fit = Math.min(V.h, V.w);
  cam.dist = Math.min(Math.max(1.1 * R * V.H / (TAN_HALF_FOV * fit), 30), 2000);
  // and push the model up into that band instead of the canvas centre
  if (V.hidden > 1) {
    const { u } = camBasis();
    const mmPerPx = 2 * cam.dist * TAN_HALF_FOV / V.H;
    const shift = V.hidden / 2 * mmPerPx;
    for (let a = 0; a < 3; a++) cam.tgt[a] -= u[a] * shift;
  }
  needDraw();
}

// ---------- matrices for the selection box ----------
function mvpMatrix(aspect) {
  const { eye, r, u, f } = camBasis();
  const near = 1, far = 4000;
  const t = 1 / TAN_HALF_FOV;
  // view = R^T * translate(-eye), with -f as the camera's +Z
  const V = [
    r[0], u[0], -f[0], 0,
    r[1], u[1], -f[1], 0,
    r[2], u[2], -f[2], 0,
    -(r[0] * eye[0] + r[1] * eye[1] + r[2] * eye[2]),
    -(u[0] * eye[0] + u[1] * eye[1] + u[2] * eye[2]),
     (f[0] * eye[0] + f[1] * eye[1] + f[2] * eye[2]), 1];
  const P = [t / aspect, 0, 0, 0, 0, t, 0, 0,
             0, 0, (far + near) / (near - far), -1,
             0, 0, 2 * far * near / (near - far), 0];
  const M = new Float32Array(16);
  for (let c = 0; c < 4; c++)
    for (let rr = 0; rr < 4; rr++) {
      let s = 0;
      for (let k = 0; k < 4; k++) s += P[k * 4 + rr] * V[c * 4 + k];
      M[c * 4 + rr] = s;
    }
  return M;
}
function selectionLines(n) {
  if (!n || PRIMS[n.t].infinite) return null;
  const h = PRIMS[n.t].ext(n.d).map(v => v + (n.round || 0));
  const e = n.r.map(v => v * Math.PI / 180);
  const c = e.map(Math.cos), s = e.map(Math.sin);
  const rot = v => {
    let x = v[0], y = c[0] * v[1] - s[0] * v[2], z = s[0] * v[1] + c[0] * v[2];
    const x2 = c[1] * x + s[1] * z; z = -s[1] * x + c[1] * z; x = x2;
    return [c[2] * x - s[2] * y, s[2] * x + c[2] * y, z];
  };
  const E = [[0,1],[1,3],[3,2],[2,0],[4,5],[5,7],[7,6],[6,4],
             [0,4],[1,5],[2,6],[3,7]];
  const out = [];
  const signs = [[1,1,1]];
  if (n.mx) signs.push(...signs.map(v => [-v[0], v[1], v[2]]));
  if (n.my) signs.push(...signs.map(v => [v[0], -v[1], v[2]]));
  if (n.mz) signs.push(...signs.map(v => [v[0], v[1], -v[2]]));
  for (const sg of signs) {
    const corners = [];
    for (let i = 0; i < 8; i++) {
      const v = rot([(i & 1 ? 1 : -1) * h[0], (i & 2 ? 1 : -1) * h[1],
                     (i & 4 ? 1 : -1) * h[2]]);
      corners.push([sg[0] * (v[0] + n.p[0]), sg[1] * (v[1] + n.p[1]),
                    sg[2] * (v[2] + n.p[2])]);
    }
    for (const [a, b] of E) out.push(...corners[a], ...corners[b]);
  }
  return new Float32Array(out);
}

// one box per selected shape
function selectionOutlines() {
  const parts = [];
  for (const n of picked) {
    if (!n.on) continue;
    const l = selectionLines(n);
    if (l && l.length) parts.push(l);
  }
  if (!parts.length) return null;
  const total = parts.reduce((a, p) => a + p.length, 0);
  const out = new Float32Array(total);
  let at = 0;
  for (const p of parts) { out.set(p, at); at += p.length; }
  return out;
}

// ======================================================================
// tapping a shape, and the widget that appears when you do
// ======================================================================
// Until now the only way to select something was the list. That is fine for a
// model you can see all of and wrong for one you are looking at: the shape
// under your finger is the one you mean, and the list should follow rather
// than lead. So a tap in the viewport is a pick.
//
// The pick is a ray marched against the same field the shader draws, in the
// kernel's JavaScript rather than on the GPU. One tap is a few hundred
// evaluations, which is nothing, and it needs no render target, no readback
// and no second copy of the scene in a picking shader that could disagree
// with the one on screen.

// The ray through a CSS pixel. This has to agree with the fragment shader's
// own construction or the tap lands somewhere other than where you touched:
// uv spans +/-0.5 vertically, the focal length carries that 0.5, and the
// screen's y runs the opposite way to clip space's.
function rayAt(px, py) {
  const { eye, r, u, f } = camBasis();
  const w = canvas.clientWidth || innerWidth, h = canvas.clientHeight || innerHeight;
  const ux = (px - w / 2) / h, uy = -(py - h / 2) / h;
  const fl = 0.5 / TAN_HALF_FOV;
  const d = [r[0] * ux + u[0] * uy + f[0] * fl,
             r[1] * ux + u[1] * uy + f[1] * fl,
             r[2] * ux + u[2] * uy + f[2] * fl];
  const l = Math.hypot(d[0], d[1], d[2]) || 1;
  return { o: eye, d: [d[0] / l, d[1] / l, d[2] / l] };
}

// Which shape owns the surface at a point: the `add` whose own field is
// nearest it. Where two shapes blend there is no single answer — the surface
// there belongs to both — and the nearer one is what anybody pointing at it
// means. Cuts are not candidates: you cannot tap a hole.
function ownerAt(p, plan) {
  const q = [0, 0, 0], e = [0, 0, 0], seen = new Set();
  let best = null, bd = 1e9;
  for (const part of plan) for (const n of part.nodes) {
    if (n.op !== 'add' || seen.has(n)) continue;
    seen.add(n);
    e[0] = n.r[0] * RAD; e[1] = n.r[1] * RAD; e[2] = n.r[2] * RAD;
    invRot((n.mx ? Math.abs(p[0]) : p[0]) - n.p[0],
           (n.my ? Math.abs(p[1]) : p[1]) - n.p[1],
           (n.mz ? Math.abs(p[2]) : p[2]) - n.p[2], e, q);
    const di = Math.abs(PRIMS[n.t].js(q, n.d, roundSlot(n), n));
    if (di < bd) { bd = di; best = n; }
  }
  return best;
}

function pickAt(px, py) {
  const plan = buildPlan(nodes);
  if (!plan.length) return null;
  const { o, d } = rayAt(px, py);
  let t = 1;
  for (let i = 0; i < 220; i++) {
    const x = o[0] + d[0] * t, y = o[1] + d[1] * t, z = o[2] + d[2] * t;
    const dist = sceneSDF(plan, x, y, z);
    if (dist < 0.06) return ownerAt([x, y, z], plan);
    // the same 0.72 the shader steps by: neither smin nor the ellipsoid is a
    // true distance, and a full step tunnels through a thin blended shoulder
    t += Math.max(dist * 0.72, 0.05);
    if (t > 4000) break;
  }
  return null;
}

// ---------- the widget ----------
// Three handles at the selection's pivot — the *same* pivot selCentre() gives
// the Place sliders, so the two controls cannot disagree about what a turn is
// about. Everything a handle does goes through translateSelection,
// rotateSelection and scaleSelection: the widget is a new way to drive the
// operations that were already there, not a second implementation of them.
const AXV = [[1, 0, 0], [0, 1, 0], [0, 0, 1]];
// X red, Y green, Z blue, as every modelling tool has for forty years -- but
// Z pushed towards violet, because a selected shape is drawn in cyan and the
// handle for its up axis was disappearing into it.
const AXCOL = [[1.00, 0.35, 0.43], [0.37, 0.83, 0.55], [0.49, 0.57, 1.00]];
let gizMode = 'move';            // move | rotate | scale
let gizDrag = null;              // the handle being dragged, if any
let gizHot = -1;                 // the handle under the pointer

// Constant on screen rather than in the model: a widget that scaled with the
// shape would be untappable on a small part and swamp the view on a large one.
function gizSize() {
  const C = selCentre(), eye = camBasis().eye;
  const dist = Math.hypot(C[0] - eye[0], C[1] - eye[1], C[2] - eye[2]);
  return Math.max(dist * TAN_HALF_FOV * 0.26, 1);
}

// What a handle can be grabbed by. Sampled along the thing you can see, so
// what is hittable is what is drawn — a ring you can only catch at four points
// feels broken, and an arrow with a hitbox wider than itself feels haunted.
function gizPoints(a, C, L) {
  const out = [];
  if (gizMode === 'rotate') {
    const U = AXV[(a + 1) % 3], V = AXV[(a + 2) % 3];
    for (let i = 0; i < 48; i++) {
      const th = i / 48 * 2 * Math.PI, c = Math.cos(th), s = Math.sin(th);
      out.push([C[0] + (U[0] * c + V[0] * s) * L,
                C[1] + (U[1] * c + V[1] * s) * L,
                C[2] + (U[2] * c + V[2] * s) * L]);
    }
    return out;
  }
  const A = AXV[a];
  for (let i = 3; i <= 10; i++) {
    const f = i / 10;
    out.push([C[0] + A[0] * L * f, C[1] + A[1] * L * f, C[2] + A[2] * L * f]);
  }
  return out;
}

// What it looks like. An arrow for move, a ring for turn, a cube for scale —
// the handle says which of the three it is without reading the toolbar.
function gizLines(a, C, L) {
  const A = AXV[a], U = AXV[(a + 1) % 3], V = AXV[(a + 2) % 3], out = [];
  const at = (t, u, v) => [C[0] + A[0] * t + U[0] * u + V[0] * v,
                           C[1] + A[1] * t + U[1] * u + V[1] * v,
                           C[2] + A[2] * t + U[2] * u + V[2] * v];
  const seg = (p, q) => out.push(p[0], p[1], p[2], q[0], q[1], q[2]);
  if (gizMode === 'rotate') {
    const N = 48;
    for (let i = 0; i < N; i++) {
      const t0 = i / N * 2 * Math.PI, t1 = (i + 1) / N * 2 * Math.PI;
      seg(at(0, Math.cos(t0) * L, Math.sin(t0) * L),
          at(0, Math.cos(t1) * L, Math.sin(t1) * L));
    }
    return new Float32Array(out);
  }
  seg(at(L * 0.16, 0, 0), at(L * 0.78, 0, 0));
  const r = L * 0.105;
  if (gizMode === 'move') {
    const tip = at(L, 0, 0);
    for (let i = 0; i < 6; i++) {
      const th = i / 6 * 2 * Math.PI, th2 = (i + 1) / 6 * 2 * Math.PI;
      const b0 = at(L * 0.78, Math.cos(th) * r, Math.sin(th) * r);
      seg(tip, b0);
      seg(b0, at(L * 0.78, Math.cos(th2) * r, Math.sin(th2) * r));
    }
  } else {
    const o = L * 0.88, C8 = [];
    for (let i = 0; i < 8; i++)
      C8.push(at(o + (i & 4 ? r : -r), (i & 1 ? r : -r), (i & 2 ? r : -r)));
    for (const [x, y] of [[0,1],[1,3],[3,2],[2,0],[4,5],[5,7],[7,6],[6,4],
                          [0,4],[1,5],[2,6],[3,7]]) seg(C8[x], C8[y]);
  }
  return new Float32Array(out);
}

// world point -> CSS pixel, through the same matrix the overlay draws with
function projectPt(P, M, w, h) {
  const cw = M[3] * P[0] + M[7] * P[1] + M[11] * P[2] + M[15];
  if (cw <= 1e-6) return null;
  const x = (M[0] * P[0] + M[4] * P[1] + M[8] * P[2] + M[12]) / cw;
  const y = (M[1] * P[0] + M[5] * P[1] + M[9] * P[2] + M[13]) / cw;
  return [(x * 0.5 + 0.5) * w, (1 - (y * 0.5 + 0.5)) * h];
}

function gizPick(px, py) {
  if (!picked.size) return -1;
  const w = canvas.clientWidth || innerWidth, h = canvas.clientHeight || innerHeight;
  const M = mvpMatrix(w / h), C = selCentre(), L = gizSize();
  let best = -1, bd = 26;                       // a fingertip, in pixels
  for (let a = 0; a < 3; a++)
    for (const P of gizPoints(a, C, L)) {
      const sp = projectPt(P, M, w, h);
      if (!sp) continue;
      const dd = Math.hypot(sp[0] - px, sp[1] - py);
      if (dd < bd) { bd = dd; best = a; }
    }
  return best;
}

// Where the pointer is along a handle's axis, in millimetres from the pivot:
// the point on the axis line closest to the ray through the pointer.
function axisParam(px, py, C, A) {
  const { o, d } = rayAt(px, py);
  const b = A[0] * d[0] + A[1] * d[1] + A[2] * d[2];
  const den = 1 - b * b;
  if (Math.abs(den) < 1e-4) return null;        // sighting straight down it
  const wx = C[0] - o[0], wy = C[1] - o[1], wz = C[2] - o[2];
  const c = A[0] * wx + A[1] * wy + A[2] * wz;
  const f = d[0] * wx + d[1] * wy + d[2] * wz;
  return (b * f - c) / den;
}

// The angle of the pointer around an axis, measured in the plane the ring is
// drawn in rather than on the screen — so a ring seen almost edge-on still
// turns by the amount the finger travelled along it, not by what it looks
// like it travelled.
function ringAngle(px, py, C, a) {
  const A = AXV[a], U = AXV[(a + 1) % 3], V = AXV[(a + 2) % 3];
  const { o, d } = rayAt(px, py);
  const den = d[0] * A[0] + d[1] * A[1] + d[2] * A[2];
  if (Math.abs(den) < 1e-4) return null;        // ring edge-on: no answer
  const s = ((C[0] - o[0]) * A[0] + (C[1] - o[1]) * A[1] + (C[2] - o[2]) * A[2]) / den;
  if (!(s > 0)) return null;
  const P = [o[0] + d[0] * s - C[0], o[1] + d[1] * s - C[1], o[2] + d[2] * s - C[2]];
  return Math.atan2(P[0] * V[0] + P[1] * V[1] + P[2] * V[2],
                    P[0] * U[0] + P[1] * U[1] + P[2] * U[2]);
}

// The pivot is frozen for the length of the drag. It has to be: the selection
// moves under the handle, and recomputing the centre each event would measure
// every delta against the position the previous delta just produced, which
// comes out as no movement at all.
function gizStart(a, px, py) {
  const C = selCentre().slice();
  if (gizMode === 'rotate') {
    const ang = ringAngle(px, py, C, a);
    if (ang === null) return false;
    gizDrag = { a, mode: 'rotate', C, last: ang };
  } else {
    const t = axisParam(px, py, C, AXV[a]);
    if (t === null) return false;
    if (gizMode === 'scale' && Math.abs(t) < 1e-3) return false;
    gizDrag = { a, mode: gizMode, C, last: t };
  }
  snapshot();
  return true;
}

function gizMove(px, py) {
  if (!gizDrag) return;
  const { a, C } = gizDrag, A = AXV[a];
  if (gizDrag.mode === 'rotate') {
    const ang = ringAngle(px, py, C, a);
    if (ang === null) return;
    let dth = ang - gizDrag.last;
    // the short way round, so crossing the seam is not most of a turn
    while (dth > Math.PI) dth -= 2 * Math.PI;
    while (dth < -Math.PI) dth += 2 * Math.PI;
    gizDrag.last = ang;
    rotateSelection(a, dth * 180 / Math.PI);
  } else if (gizDrag.mode === 'move') {
    const t = axisParam(px, py, C, A);
    if (t === null) return;
    const dt = t - gizDrag.last;
    gizDrag.last = t;
    translateSelection(A[0] * dt, A[1] * dt, A[2] * dt);
  } else {
    const t = axisParam(px, py, C, A);
    if (t === null || Math.abs(gizDrag.last) < 1e-4) return;
    // Uniform, exactly like the Scale slider. Per-axis scaling of a rotated
    // assembly is not expressible in this representation — a box turned 30
    // degrees and squashed in x is no longer a box — so it is not offered
    // here either, however much three separate handles look like it is.
    const f = t / gizDrag.last;
    if (!(f > 0)) return;                       // dragged through the pivot
    gizDrag.last = t;
    scaleSelection(Math.min(Math.max(f, 0.5), 2));
  }
  refreshInspectorValues();
  save(); scheduleInfo(); markInteracting(false);
}

function drawGizmo(w, h) {
  if (!picked.size) return;
  const C = selCentre(), L = gizSize();
  gl.disable(gl.DEPTH_TEST);
  gl.useProgram(lineProg);
  gl.bindVertexArray(lineVAO);
  gl.bindBuffer(gl.ARRAY_BUFFER, lineBuf);
  gl.uniformMatrix4fv(gl.getUniformLocation(lineProg, 'uMVP'), false,
                      mvpMatrix(w / h));
  const uC = gl.getUniformLocation(lineProg, 'uC');
  for (let a = 0; a < 3; a++) {
    const data = gizLines(a, C, L);
    const hot = gizDrag ? gizDrag.a === a : gizHot === a;
    const c = AXCOL[a];
    gl.uniform3f(uC, hot ? Math.min(c[0] * 1.3 + 0.3, 1) : c[0],
                     hot ? Math.min(c[1] * 1.3 + 0.3, 1) : c[1],
                     hot ? Math.min(c[2] * 1.3 + 0.3, 1) : c[2]);
    gl.bufferData(gl.ARRAY_BUFFER, data, gl.DYNAMIC_DRAW);
    gl.drawArrays(gl.LINES, 0, data.length / 3);
  }
  gl.bindVertexArray(null);
}

// The widget's mode switch shows only while it has something to act on.
function syncGizbar() {
  const bar = document.getElementById('gizbar');
  bar.classList.toggle('on', picked.size > 0);
  for (const b of bar.children) b.classList.toggle('on', b.dataset.giz === gizMode);
}
document.getElementById('gizbar').onclick = e => {
  const b = e.target.closest('button[data-giz]');
  if (!b) return;
  gizMode = b.dataset.giz;
  syncGizbar(); needDraw();
};

// The build plate, drawn as lines because the meshed view has no shader to
// draw it in. The marcher keeps its own, which fades with distance and takes
// the model's shadow — neither of which this can do.
let gridCache = null;
function plateGrid() {
  const B = sceneBounds(shownNodes());
  const reach = B ? Math.max(...[0, 1].map(a =>
    Math.max(Math.abs(B.lo[a]), Math.abs(B.hi[a])))) : 60;
  const half = Math.max(Math.ceil(reach / 50) * 50, 100);
  if (gridCache && gridCache.half === half) return gridCache.data;
  const out = [];
  for (let v = -half; v <= half; v += 10) {
    out.push(-half, v, 0, half, v, 0);
    out.push(v, -half, 0, v, half, 0);
  }
  gridCache = { half, data: new Float32Array(out) };
  return gridCache.data;
}

// ---------- draw loop ----------
// Full resolution when idle, coarse while a finger is down — and, since there
// are two pictures now, whichever of them can be had for the frame.
//
// Two costs three orders of magnitude apart, and the scheduling follows from
// how far apart they are. A meshed frame is a buffer draw; a raymarched frame
// pays for every shape in the model on every pixel. Meshing costs about what
// one raymarched frame costs — the grid fill runs the same map() over a
// comparable number of points — so a mesh pays for itself on the second frame
// of any drag.
let pending = false, interacting = false, camMoving = false;
let idleTimer = 0, proxyTimer = 0;
function needDraw() {
  if (pending) return;
  pending = true;
  requestAnimationFrame(draw);
}
// `isCamera` is the whole distinction the proxy rests on. A camera move leaves
// the model alone, so a mesh built before it is still a mesh of what is on the
// screen. A slider move does not, and standing a mesh of the previous shape in
// front of the marcher would show the model not following the hand.
function markInteracting(isCamera) {
  interacting = true;
  camMoving = !!isCamera;
  clearTimeout(idleTimer);
  clearTimeout(proxyTimer);
  idleTimer = setTimeout(settle, 180);
  needDraw();
}
function settle() {
  interacting = false;
  needDraw();
  scheduleProxy();
}
// Once the settled picture is up, pay for the mesh that the next drag will
// stand in front of. Two conditions on that, and both are about it being a
// saving rather than a habit: the grid fill has to be on the GPU, since
// meshing in JavaScript costs more than the frames it would save, and the
// scene has to be big enough for a raymarched frame to be worth avoiding. A
// four-shape model already draws in a millisecond, and meshing it every time
// a slider is let go would be pure overhead.
//
// Called from the end of an interaction and from a structural change, so the
// first orbit after opening a document has a mesh to use rather than the
// second.
function scheduleProxy() {
  clearTimeout(proxyTimer);
  proxyTimer = setTimeout(() => {
    if (interacting || !meshStale) return;
    if (!rayFits || (sampler() && slotAt.size >= 8)) {
      buildMesh(); needDraw(); scheduleInfo();
    }
  }, 140);
}

function draw() {
  pending = false;
  // What can be drawn this frame, which is not always what the model would
  // prefer. A stale mesh is a fine stand-in while the camera moves — it is
  // only a stand-in — but never while the model itself is changing.
  const proxy = rayFits && interacting && camMoving && meshCount && !meshStale;
  const meshed = !rayFits || proxy;
  // Past the marcher's budget the mesh is the only picture there is, so it
  // gets built here when it has to be, on a frame a raymarch would have cost
  // about as much anyway. Not while an edit is still in flight, though: the
  // next pointer event would throw it away.
  if (!rayFits && meshStale && (!interacting || !meshCount)) buildMesh();
  if (!meshed && !prog) return;

  const dpr = Math.min(devicePixelRatio || 1, 2);
  // Dropping the render scale is a raymarch trick — it is the per-pixel cost
  // that hurts. A mesh is cheap enough to draw full size with a finger down.
  const scale = (interacting && !meshed) ? 0.55 : 1;
  const cw = canvas.clientWidth || innerWidth, ch = canvas.clientHeight || innerHeight;
  const w = Math.max(1, Math.round(cw * dpr * scale));
  const h = Math.max(1, Math.round(ch * dpr * scale));
  if (canvas.width !== w || canvas.height !== h) { canvas.width = w; canvas.height = h; }
  gl.viewport(0, 0, w, h);

  if (meshed) drawMeshed(w, h); else drawMarched(w, h);
  drawOverlay(w, h, meshed);
  drawGizmo(w, h);
}

function drawMarched(w, h) {
  gl.disable(gl.DEPTH_TEST);
  const { eye, r, u, f } = camBasis();
  packUniforms();
  gl.useProgram(prog);
  gl.uniform2f(U.uRes, w, h);
  gl.uniform3f(U.uEye, eye[0], eye[1], eye[2]);
  gl.uniformMatrix3fv(U.uCam, false,
    new Float32Array([r[0], r[1], r[2], u[0], u[1], u[2], f[0], f[1], f[2]]));
  gl.uniform1f(U.uFocal, 0.5 / TAN_HALF_FOV);
  gl.uniform3f(U.uTint, 0.91, 0.53, 0.22);
  gl.uniform3f(U.uSelTint, 0.24, 0.60, 0.95);
  // the settled picture is worth matching the STL; the dragged one is not
  bindField();
  if (interacting) gl.uniform2f(U.uHit, 0.0015, 0.004);
  else             gl.uniform2f(U.uHit, 0.0004, 0.002);
  gl.uniform4fv(U.uD, uData);
  gl.bindVertexArray(emptyVAO);
  gl.drawArrays(gl.TRIANGLES, 0, 3);
  gl.bindVertexArray(null);
}

function drawMeshed(w, h) {
  gl.enable(gl.DEPTH_TEST);
  gl.clearColor(0.071, 0.086, 0.104, 1);
  gl.clear(gl.COLOR_BUFFER_BIT | gl.DEPTH_BUFFER_BIT);
  if (!meshCount) return;
  const { eye } = camBasis();
  gl.useProgram(meshProg);
  gl.uniformMatrix4fv(meshU.uMVP, false, mvpMatrix(w / h));
  gl.uniform3f(meshU.uTint, 0.91, 0.53, 0.22);
  gl.uniform3f(meshU.uEye, eye[0], eye[1], eye[2]);
  gl.bindVertexArray(meshVao);
  gl.drawElements(gl.TRIANGLES, meshCount, gl.UNSIGNED_INT, 0);
  gl.bindVertexArray(null);
}

// One box per selected shape, in both pictures — which is what carries the
// selection when the meshed one cannot colour it.
function drawOverlay(w, h, meshed) {
  const lines = selectionOutlines();
  const grid = meshed ? plateGrid() : null;
  if (!lines && !grid) return;
  gl.useProgram(lineProg);
  gl.bindVertexArray(lineVAO);
  gl.bindBuffer(gl.ARRAY_BUFFER, lineBuf);
  gl.uniformMatrix4fv(gl.getUniformLocation(lineProg, 'uMVP'), false,
                      mvpMatrix(w / h));
  const uC = gl.getUniformLocation(lineProg, 'uC');
  if (grid) {
    // the plate is *behind* things, so it is the one overlay that keeps its
    // depth test
    gl.enable(gl.DEPTH_TEST);
    gl.bufferData(gl.ARRAY_BUFFER, grid, gl.DYNAMIC_DRAW);
    gl.uniform3f(uC, 0.17, 0.21, 0.26);
    gl.drawArrays(gl.LINES, 0, grid.length / 3);
  }
  if (lines && lines.length) {
    gl.disable(gl.DEPTH_TEST);
    gl.bufferData(gl.ARRAY_BUFFER, lines, gl.DYNAMIC_DRAW);
    gl.uniform3f(uC, 0.37, 0.78, 0.94);
    gl.drawArrays(gl.LINES, 0, lines.length / 3);
  }
  gl.bindVertexArray(null);
}
addEventListener('resize', () => needDraw());

// ======================================================================
// pointer input — one finger orbits (or moves the shape in Move mode),
// two fingers pinch-zoom and pan
// ======================================================================
let mode = 'orbit';
const pts = new Map();
let last1 = null, lastPinch = 0, lastMid = null;

function screenAxes() {
  const { r, u } = camBasis();
  // mm per pixel at the orbit target, for a 45° vertical fov
  const s = 2 * cam.dist * TAN_HALF_FOV / (canvas.clientHeight || innerHeight);
  return { r, u, s };
}
// Move drags the whole selection, which is the point of being able to make one
function moveSelected(dx, dy, dz) {
  if (!picked.size) return;
  translateSelection(dx, dy, dz);
  refreshInspectorValues();
  save(); scheduleInfo();
}
// A tap is a press that went nowhere. Tracked rather than assumed, because
// the same finger that selects also orbits, and telling them apart after the
// fact is the only way to have both on one gesture.
let tapFrom = null, tapMoved = 0, tapAt = 0, grabbed = false;

canvas.addEventListener('pointerdown', e => {
  canvas.setPointerCapture(e.pointerId);
  pts.set(e.pointerId, [e.clientX, e.clientY]);
  if (pts.size === 1) {
    last1 = [e.clientX, e.clientY];
    tapFrom = [e.clientX, e.clientY]; tapMoved = 0; tapAt = Date.now();
    grabbed = false;
    // a widget handle takes the drag ahead of the camera and ahead of Move
    const a = gizPick(e.clientX, e.clientY);
    if (a >= 0 && gizStart(a, e.clientX, e.clientY)) gizHot = a;
  } else {
    last1 = null; lastPinch = 0; lastMid = null;
    // a second finger is a camera gesture; whatever the first was doing stops
    gizDrag = null; tapFrom = null;
  }
});
canvas.addEventListener('pointermove', e => {
  if (!pts.has(e.pointerId)) {
    // nothing pressed: light up the handle under the cursor, which is the
    // only hint a mouse gets that these things are grabbable
    if (picked.size && !gizDrag) {
      const a = gizPick(e.clientX, e.clientY);
      if (a !== gizHot) { gizHot = a; needDraw(); }
    }
    return;
  }
  if (tapFrom) {
    tapMoved += Math.hypot(e.clientX - tapFrom[0], e.clientY - tapFrom[1]);
    tapFrom = [e.clientX, e.clientY];
  }
  if (gizDrag) { gizMove(e.clientX, e.clientY); return; }
  pts.set(e.pointerId, [e.clientX, e.clientY]);
  const P = [...pts.values()];
  // Move mode drags the shape, not the view — so the frame it asks for is not
  // one a mesh of the previous shape may stand in for.
  let camera = true;
  if (P.length === 1 && last1) {
    const dx = e.clientX - last1[0], dy = e.clientY - last1[1];
    last1 = [e.clientX, e.clientY];
    if (mode === 'grab') {
      const { r, u, s } = screenAxes();
      camera = false;
      // one undo step per drag, and none at all for a drag that never was —
      // in Move mode a tap now selects, and a tap must not cost an undo
      if (!grabbed) { snapshot(); grabbed = true; }
      moveSelected((r[0] * dx - u[0] * dy) * s, (r[1] * dx - u[1] * dy) * s,
                   (r[2] * dx - u[2] * dy) * s);
    } else {
      cam.yaw -= dx * 0.006;
      cam.pitch = Math.min(Math.max(cam.pitch + dy * 0.006, -1.45), 1.45);
    }
  } else if (P.length >= 2) {
    const d = Math.hypot(P[0][0] - P[1][0], P[0][1] - P[1][1]);
    const mid = [(P[0][0] + P[1][0]) / 2, (P[0][1] + P[1][1]) / 2];
    if (lastPinch && d) cam.dist = Math.min(Math.max(cam.dist * lastPinch / d, 8), 2000);
    if (lastMid) {
      const dx = mid[0] - lastMid[0], dy = mid[1] - lastMid[1];
      const { r, u, s } = screenAxes();
      if (mode === 'grab' && picked.size) {
        // two fingers in Move mode raise/lower along the build direction
        camera = false;
        if (!grabbed) { snapshot(); grabbed = true; }
        moveSelected(0, 0, -dy * s);
      } else {
        cam.tgt[0] -= (r[0] * dx - u[0] * dy) * s;
        cam.tgt[1] -= (r[1] * dx - u[1] * dy) * s;
        cam.tgt[2] -= (r[2] * dx - u[2] * dy) * s;
      }
    }
    lastPinch = d; lastMid = mid;
  }
  markInteracting(camera);
});
function endPtr(e) {
  const wasGiz = !!gizDrag;
  gizDrag = null;
  pts.delete(e.pointerId);
  const P = [...pts.values()];
  last1 = P.length === 1 ? P[0] : null;
  if (P.length < 2) { lastPinch = 0; lastMid = null; }
  // A press that stayed put and did not drive a handle is a tap, and a tap
  // picks. The thresholds are a finger's worth of wobble and rather less than
  // a long press, so an orbit that happens to end where it started is not
  // mistaken for one.
  if (!wasGiz && !P.length && tapFrom && tapMoved < 8 && Date.now() - tapAt < 700)
    tapPick(e.clientX, e.clientY);
  tapFrom = null;
  markInteracting(true);
}

// Tapping nothing clears the selection, which is also how the widget is put
// away. In Sticky mode it does not, because there the whole point is that the
// selection survives what you tap next.
function tapPick(px, py) {
  const n = pickAt(px, py);
  if (n) pickShape(n);
  else if (selMode !== 'sticky') picked = new Set();
  else return;
  renderList(); renderInspector(); save(); needDraw();
  // bring the row into view: on a long list the shape you just tapped is
  // otherwise marked somewhere you cannot see
  const row = document.querySelector('#nodes .node.sel, #nodes .node.pick');
  if (row) row.scrollIntoView({ block: 'nearest' });
}
canvas.addEventListener('pointerup', endPtr);
canvas.addEventListener('pointercancel', endPtr);
canvas.addEventListener('wheel', e => {
  e.preventDefault();
  cam.dist = Math.min(Math.max(cam.dist * Math.exp(e.deltaY * 0.0012), 8), 2000);
  markInteracting(true);
}, { passive: false });
// iOS fires these on double-tap zoom attempts over the canvas
document.addEventListener('gesturestart', e => e.preventDefault());
document.addEventListener('dblclick', e => e.preventDefault());
