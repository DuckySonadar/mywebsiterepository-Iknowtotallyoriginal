<!-- viewport-fit=cover + safe-area padding below: without it iOS puts the
     bottom sheet under the home indicator -->
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<!-- names the Home Screen shortcut; without it iOS uses the whole title -->
<meta name="apple-mobile-web-app-title" content="MetaMeld">
<meta name="theme-color" content="#101418">
<title>MetaMeld</title>
<style>
  :root { --bg:#101418; --panel:#1a2027f2; --ink:#dfe7ee; --dim:#8fa0af;
          --acc:#f0913b; --err:#ff6b6b; --note:#ffc857; --sel:#5ec8f0;
          /* the three axes, shared by the viewport widget and the panel */
          --ax:#ff5a6e; --ay:#5fd38d; --az:#7d92ff;
          --line:#3a4652; --btn:#2a333d;
          --sheet:52vh; }
  * { box-sizing:border-box; margin:0; -webkit-tap-highlight-color:transparent; }
  html,body { height:100%; background:var(--bg); color:var(--ink); overflow:hidden;
              font:14px/1.4 -apple-system,'Segoe UI',Roboto,sans-serif;
              -webkit-user-select:none; user-select:none;
              overscroll-behavior:none; }
  /* canvas is a replaced element: left+right don't stretch it, so size it
     explicitly or it stays at its intrinsic 300x150 */
  #view { position:fixed; top:0; left:0; width:100vw; height:100vh;
          height:100dvh; touch-action:none; display:block; }
  #topbar { position:fixed; top:0; left:0; right:0; z-index:6;
            padding:calc(env(safe-area-inset-top) + 8px) 12px 8px;
            display:flex; gap:8px; align-items:center; flex-wrap:wrap;
            background:linear-gradient(#101418dd,#10141800); pointer-events:none; }
  #topbar > * { pointer-events:auto; }
  #status { color:var(--dim); font-size:12px; margin-left:auto; text-align:right;
            max-width:52vw; }
  .btn { background:var(--btn); color:var(--ink); border:1px solid var(--line);
         border-radius:9px; padding:8px 12px; font-size:13px; cursor:pointer;
         min-height:38px; font-family:inherit; }
  .btn:active { background:#38434f; }
  .btn.on { background:var(--acc); border-color:var(--acc); color:#181818;
            font-weight:600; }
  .btn:disabled { opacity:.4; }
  .btn.sm { padding:5px 9px; min-height:32px; font-size:12px; }
  .seg { display:flex; border:1px solid var(--line); border-radius:9px;
         overflow:hidden; background:#1a2027cc; }
  .seg button { background:none; border:0; color:var(--dim); padding:8px 12px;
                font-size:13px; cursor:pointer; font-family:inherit;
                min-height:38px; }
  .seg button.on { background:var(--acc); color:#181818; font-weight:600; }
  /* text, not a button: the tool's own controls should win the top bar */
  #back { color:var(--dim); text-decoration:none; font-size:12.5px;
          padding:8px 2px; white-space:nowrap; }
  #back:hover, #back:focus-visible { color:var(--acc); }
  /* full-screen off the Home Screen there is no tab to read the name from */
  #brand { color:var(--ink); font-size:13px; font-weight:600;
           letter-spacing:.02em; white-space:nowrap; padding:8px 0; }
  .tm { font-size:.62em; vertical-align:.5em; opacity:.75; margin-left:.5px; }
  /* a phone needs the width for the controls, and its shortcut is labelled */
  @media (max-width:560px) { #brand { display:none; } }
  #errbar { position:fixed; top:calc(env(safe-area-inset-top) + 52px);
            left:50%; transform:translateX(-50%); background:#4a1520;
            color:#ffb3b3; border:1px solid #7a2535; border-radius:8px;
            padding:6px 12px; font-size:12px; display:none; max-width:92vw;
            z-index:30; }
  #hint { position:fixed; left:12px; z-index:4; bottom:calc(var(--sheet) + 8px);
          color:var(--dim); font-size:11.5px; pointer-events:none;
          max-width:min(60vw,420px); text-shadow:0 1px 3px #000; }

  /* ---- bottom sheet (phone) / right rail (desktop) ---- */
  #panel { position:fixed; left:0; right:0; bottom:0; height:var(--sheet);
           background:var(--panel); backdrop-filter:blur(8px);
           border-top:1px solid var(--line); z-index:5;
           display:flex; flex-direction:column;
           transition:height .18s ease; }
  #panel.drag { transition:none; }
  #grip { height:26px; flex:0 0 auto; display:flex; align-items:center;
          justify-content:center; touch-action:none; cursor:grab; }
  #grip div { width:44px; height:5px; border-radius:3px; background:#4a5764; }
  #sheetBody { flex:1 1 auto; overflow-y:auto; -webkit-overflow-scrolling:touch;
               padding:0 12px calc(env(safe-area-inset-bottom) + 16px); }
  h3 { font-size:10.5px; letter-spacing:.12em; text-transform:uppercase;
       color:var(--acc); margin:14px 0 6px; }
  #nodes { display:flex; flex-direction:column; gap:5px; }
  .node { display:flex; align-items:center; gap:8px; padding:7px 9px;
          border:1px solid var(--line); border-radius:9px; background:#20272f;
          font-size:13px; }
  .node.sel { border-color:var(--sel); background:#22313a; }
  .node.off { opacity:.45; }
  .node .nm { flex:1 1 auto; overflow:hidden; text-overflow:ellipsis;
              white-space:nowrap; }
  .node .op { font-size:10px; letter-spacing:.06em; text-transform:uppercase;
              padding:2px 6px; border-radius:5px; background:#33404b;
              color:var(--dim); }
  .node.away { opacity:.55; }
  /* selected reads blue, the same blue the model is tinted with */
  .node.pick { border-color:var(--sel); background:#1a2c36; }
  .node.pick .nm { color:#cfe9f6; }
  /* the primary — what the sliders edit — carries a bar down its edge */
  .node.pick.sel { box-shadow:inset 3px 0 0 var(--sel); }
  .node.body .nm { font-weight:600; }
  .node.body.sel { border-color:var(--acc); background:#2b2519; }
  #bodies { display:flex; flex-direction:column; gap:5px; }
  #bnm { width:100%; background:#10141a; color:var(--ink); font:inherit;
         border:1px solid var(--line); border-radius:8px; padding:9px 10px; }
  .node .bd { font-size:10px; letter-spacing:.04em; padding:2px 6px;
              border-radius:5px; border:1px solid var(--line); color:var(--dim);
              max-width:96px; overflow:hidden; text-overflow:ellipsis;
              white-space:nowrap; }
  .node .op.cut { background:#4a2530; color:#ffb3b3; }
  .node .op.keep { background:#2a3d4a; color:#a8d8ee; }
  .node .ic { width:26px; height:26px; border:0; background:none; color:var(--dim);
              font-size:15px; cursor:pointer; padding:0; }
  .row { margin:9px 0; }
  .row label { display:flex; align-items:center; gap:7px;
               color:var(--dim); font-size:12px; margin-bottom:3px; }
  /* The icon says which handle in the viewport this row drives. Axis rows are
     drawn in the axis colour, so a red arrow on screen and a red icon in the
     panel are the same thing without either having to say so. */
  .row label .gl { width:15px; height:15px; flex:0 0 auto; display:block; }
  .row label b { color:var(--ink); font-weight:600; margin-left:auto;
                 font-variant-numeric:tabular-nums; }
  /* the value is a button: tap it and type the number you actually want,
     which a slider with a 0.5 mm step cannot give you */
  .row label b.tap { cursor:pointer; padding:1px 5px; margin-right:-5px;
                     border-radius:5px; border:1px dashed transparent; }
  .row label b.tap:hover { border-color:var(--line); }
  .row label b.tap:active { color:var(--acc); border-color:var(--acc); }
  .numin { width:92px; margin-left:auto; background:#10141a; color:var(--ink);
           border:1px solid var(--acc); border-radius:6px; padding:2px 6px;
           font:600 12px/1.35 inherit; font-variant-numeric:tabular-nums;
           text-align:right; -webkit-user-select:text; user-select:text; }
  .slide { display:flex; align-items:center; gap:8px; }
  .slide input[type=range] { flex:1 1 auto; accent-color:var(--acc);
                             height:30px; }
  .step { width:32px; height:32px; flex:0 0 auto; border:1px solid var(--line);
          border-radius:8px; background:var(--btn); color:var(--ink);
          font-size:16px; line-height:1; cursor:pointer; padding:0; }
  /* The widget's own mode switch. Docked to the edge rather than floating by
     the selection: a bar that follows the model covers the model, and on a
     phone it ends up under the thumb that is trying to drag a handle. */
  #gizbar { position:fixed; left:10px; top:50%; transform:translateY(-50%);
            display:none; flex-direction:column; gap:7px; z-index:6; }
  #gizbar.on { display:flex; }
  #gizbar button { width:44px; height:44px; padding:0; cursor:pointer;
                   border:1px solid var(--line); border-radius:12px;
                   background:#1a2027e6; color:var(--dim);
                   display:flex; align-items:center; justify-content:center;
                   -webkit-backdrop-filter:blur(6px); backdrop-filter:blur(6px); }
  #gizbar button.on { border-color:var(--acc); color:var(--acc);
                      background:#2b2519f2; }
  #gizbar svg { width:22px; height:22px; display:block; }
  .grid3 { display:grid; grid-template-columns:repeat(3,1fr); gap:6px; }
  .toggles { display:flex; gap:6px; flex-wrap:wrap; }
  select { width:100%; background:#10141a; color:var(--ink); font-family:inherit;
           border:1px solid var(--line); border-radius:8px; padding:9px;
           font-size:14px; }
  .bar { display:flex; gap:6px; flex-wrap:wrap; }
  .bar .btn { flex:1 1 auto; }
  #modal { position:fixed; inset:0; background:#000b; z-index:40; display:none;
           align-items:center; justify-content:center; padding:16px; }
  #modal .card { background:#1a2027; border:1px solid var(--line);
                 border-radius:14px; padding:16px; width:min(520px,94vw);
                 max-height:86vh; overflow-y:auto; }
  #modal h4 { font-size:14px; margin-bottom:10px; }
  #modal p { color:var(--dim); font-size:12px; margin:8px 0; }
  textarea { width:100%; height:170px; background:#10141a; color:#cfe3c8;
             border:1px solid var(--line); border-radius:8px; padding:8px;
             font:12px ui-monospace,SFMono-Regular,monospace;
             -webkit-user-select:text; user-select:text; }
  .picker { display:grid; grid-template-columns:repeat(auto-fill,minmax(96px,1fr));
            gap:8px; }
  .picker button { background:var(--btn); border:1px solid var(--line);
                   border-radius:10px; color:var(--ink); padding:12px 6px;
                   font-size:12.5px; cursor:pointer; font-family:inherit; }
  @media (min-width:761px) {
    #panel { top:0; left:auto; width:340px; height:auto !important;
             border-top:0; border-left:1px solid var(--line); }
    #view { width:calc(100vw - 340px); }
    #topbar { right:340px; }                 /* keep it off the side rail */
    #grip { display:none; }
    #sheetBody { padding-top:48px; }
    #hint { bottom:12px; }
  }
</style>
</head>
<body>
<canvas id="view"></canvas>

<div id="topbar">
  <!-- target=_top so the link home escapes the iframe when the editor is
       embedded in the site's EDITOR section; a no-op when it runs standalone -->
  <a id="back" href="https://josiahsmakercave.xyz/" target="_top">‹ Maker Cave</a>
  <!-- the visible wordmark asserts the mark; the Home Screen label and
       <title> stay plain, since a shortcut name with a (TM) in it reads
       badly and the claim is already made here and in TRADEMARK.md -->
  <span id="brand">MetaMeld<sup class="tm">™</sup></span>
  <div class="seg" id="modeSeg">
    <button data-mode="orbit" class="on">Orbit</button>
    <button data-mode="grab">Move</button>
  </div>
  <button class="btn" id="undoBtn" title="Undo">↶</button>
  <button class="btn" id="viewBtn" title="Frame the model">⤢</button>
  <div id="status">starting…</div>
</div>
<div id="errbar"></div>
<div id="hint"></div>

<!-- The move / rotate / scale widget's mode switch. Hidden until something is
     selected, because the widget it drives is drawn at the selection. -->
<div id="gizbar">
  <button data-giz="move" class="on" title="Move along an axis" aria-label="Move">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"
         stroke-linecap="round" stroke-linejoin="round">
      <path d="M12 3v18M3 12h18"/><path d="M12 3 9.5 5.8M12 3l2.5 2.8"/>
      <path d="M12 21l-2.5-2.8M12 21l2.5-2.8"/>
      <path d="M3 12l2.8-2.5M3 12l2.8 2.5"/><path d="M21 12l-2.8-2.5M21 12l-2.8 2.5"/>
    </svg>
  </button>
  <button data-giz="rotate" title="Turn about an axis" aria-label="Rotate">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"
         stroke-linecap="round" stroke-linejoin="round">
      <path d="M20 12a8 8 0 1 1-3.2-6.4"/><path d="M20.5 4v4.6h-4.6"/>
    </svg>
  </button>
  <button data-giz="scale" title="Scale about the centre" aria-label="Scale">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"
         stroke-linecap="round" stroke-linejoin="round">
      <path d="M4 20 20 4"/><path d="M14 4h6v6"/><path d="M10 20H4v-6"/>
    </svg>
  </button>
</div>

<div id="panel">
  <div id="grip"><div></div></div>
  <div id="sheetBody">
    <h3>Baked <span style="color:var(--dim);text-transform:none;letter-spacing:0"
        id="bakedCount"></span></h3>
    <div id="baked"></div>
    <div class="bar" style="margin-top:6px">
      <button class="btn sm" id="bakeBtn">Bake this body</button>
    </div>
    <h3>Bodies <span style="color:var(--dim);text-transform:none;letter-spacing:0"
        id="bodyCount"></span></h3>
    <div id="bodies"></div>
    <div class="bar" style="margin-top:6px">
      <button class="btn sm" id="addBodyBtn">＋ Body</button>
    </div>
    <h3>Shapes <span style="color:var(--dim);text-transform:none;letter-spacing:0"
        id="nodeCount"></span></h3>
    <div class="seg" id="selSeg" style="margin-bottom:7px">
      <button data-s="single" class="on">Single</button>
      <button data-s="sticky">Sticky</button>
    </div>
    <div id="nodes"></div>
    <p id="selHint" style="color:var(--dim);font-size:11px;margin:6px 0 0"></p>
    <div class="bar" style="margin-top:8px">
      <button class="btn" id="addBtn">＋ Add shape</button>
      <button class="btn" id="dupBtn">Duplicate</button>
      <button class="btn" id="delBtn">Delete</button>
    </div>
    <div id="inspector"></div>
    <h3>Model</h3>
    <div class="bar">
      <button class="btn" id="stlBtn">Save STL</button>
      <button class="btn" id="jsonBtn">JSON</button>
      <button class="btn" id="saveBtn">Save</button>
      <button class="btn" id="openBtn">Open</button>
      <button class="btn" id="importBtn">Import</button>
      <input type="file" id="fileInp" accept=".json,application/json"
             style="display:none">
      <button class="btn" id="startBtn">Starters</button>
    </div>
    <div class="row" id="resRow">
      <label><span>STL resolution</span><b id="resVal" class="tap" role="button"
             tabindex="0" title="Tap to type a value">0.5 mm</b>
        <input class="numin" id="resNum" type="text" inputmode="decimal" hidden></label>
      <div class="slide">
        <button class="step" data-step="res:-1">−</button>
        <input type="range" id="resInp" min="0.2" max="2" step="0.05" value="0.5">
        <button class="step" data-step="res:1">＋</button>
      </div>
    </div>
    <p style="color:var(--dim);font-size:11.5px;margin:10px 0 4px" id="info"></p>
  </div>
</div>

<div id="modal"><div class="card" id="modalCard"></div></div>

<script>
"use strict";
// ======================================================================
// visible error reporting — a phone has no console to open
// ======================================================================
const errbar = document.getElementById('errbar');
function showErr(msg) { errbar.textContent = msg; errbar.style.display = 'block'; }
addEventListener('error', e => {
  const m = e.message || (e.target && e.target.tagName
    ? e.target.tagName + ' failed to load' : 'unknown error');
  showErr('Error: ' + m + (e.lineno ? ' @' + e.lineno : ''));
});
addEventListener('unhandledrejection',
  e => showErr('Error: ' + ((e.reason && e.reason.message) || e.reason)));
</script>

<!-- @sinterform -->

<!-- Optional in the strongest sense: the kernel does not import it, does not
     know it exists, and meshes perfectly well without it. It fills the
     mesher's sample grid on the GPU rather than in JavaScript, which is the
     difference between a meshed viewport that keeps up with an edit and one
     that stops the page for a second. -->
<!-- @sinterform-glmesh -->

<script>
"use strict";
try {
// ======================================================================
// MetaMeld — the application. Everything above is SinterForm, under a
// different licence; see TRADEMARK.md and the header on that block.
//
// The kernel's names are bound once here so the code below reads the way it
// did before the two were separated. `fields` is deliberately NOT bound: it
// is mutable state living in the kernel, so it is reached through SF every
// time rather than captured once.
// ======================================================================
const SF = SinterForm;
// The shader half of the primitives. SinterForm ships the functions; the
// budgets are ours, because they are properties of *this* packing: three vec4
// of uniforms per shape, and four 3D texture units. A consumer that packed
// shapes into an SSBO would have neither limit, which is why the kernel does
// not carry these numbers.
const GL = SinterFormGLSL;
// And the third module, which is optional: it fills the mesher's sample grid
// on the GPU. Everything works without it, more slowly.
const GM = typeof SinterGLMesh !== 'undefined' ? SinterGLMesh : null;
const MAXFIELDS = 4;
// There is no MAXN here any more. How many shapes fit in a uniform block is
// still ours to know, but it is not a constant and it is not a rule about
// documents: it is read off the driver below, and a model past it is *drawn*
// differently rather than refused. See "two ways to draw it".
const { PRIMS, PRIM_KEYS, OPS, RAD, dimIsLength, dimUnit, roundSlot,
        decodeField, encodeField, sampleField,
        smin, smax, invRot,
        sceneSDF, sceneBounds, surfaceNets, meshToSTL } = SF;

// `baked` on a primitive means its shape is not in the node: it lives in a
// library on the document and the node's `fi` says which entry. The kernel
// marks its profile, wire, sweep and construct that way too, so where this
// editor means a baked *field* — the only one of them it can author, and the
// only one whose `fi` is a texture unit — it says so rather than asking
// whether the primitive is baked.
const isField = n => n && n.t === 'field';

// ======================================================================
// document / state
// ======================================================================
const STORE = 'metameld_doc_v1';
const STORE_OLD = 'sdf_editor_doc_v1';   // pre-rename; read once, then migrated
let nodes = [], sel = 0, undoStack = [];

function makeNode(type, over) {
  const P = PRIMS[type];
  return Object.assign({
    t: type, on: true, op: 'add', k: 0,
    // b: which body an `add` builds. tg: which bodies a cut/keep reaches,
    // null meaning all of them (including bodies made after the cut).
    b: 0, tg: null, fi: 0,          // fi: which baked field, for t='field'
    p: [0, 0, type === 'plane' ? 0 : (P.ext(P.def.slice())[2] || 10)],
    r: [0, 0, 0], d: P.def.slice(), round: 0,
    mx: false, my: false, mz: false
  }, over || {});
}

// ======================================================================
// bodies
// ======================================================================
// A body is one buildable part. Its shapes fold onto their *own* running
// distance, so an add only ever blends inside its own body and a cut only
// reaches the bodies it names — which is what lets a pocket be carved into
// one part while the part next to it stays whole. The finished bodies are
// hard-min'd together at the end, never smin'd, or they would melt back
// into one lump.
let bodies = [{ id: 0, name: 'Body 1', on: true }];
// the body new shapes join, and the one the shape list highlights
let activeBody = 0;

const bodyById = id => bodies.find(b => b.id === id);
const bodyName = id => (bodyById(id) || {}).name || '?';
const bodyShown = id => { const b = bodyById(id); return !b || b.on !== false; };
const hits = (n, id) => !n.tg || n.tg.indexOf(id) >= 0;

// Bodies are an explicit list, not one derived from the shapes: you can make
// an empty one and then build into it, which is the natural order to work in.
function addBody() {
  const id = bodies.reduce((m, b) => Math.max(m, b.id), -1) + 1;
  bodies.push({ id, name: 'Body ' + (id + 1), on: true });
  return id;
}

// Keeps the list self-consistent after any edit: never empty, no shape
// pointing at a body that is gone, no cut naming one. A cut left targeting
// nothing stays inert on purpose — promoting it to "all" would have it
// suddenly carve into parts it was never pointed at.
function syncBodies() {
  if (!bodies.length) bodies = [{ id: 0, name: 'Body 1', on: true }];
  bodies.sort((a, b) => a.id - b.id);
  const live = new Set(bodies.map(b => b.id));
  for (const n of nodes) {
    if (n.op === 'add') { if (!live.has(n.b)) n.b = bodies[0].id; }
    else if (n.tg) n.tg = n.tg.filter(id => live.has(id));
  }
  if (!live.has(activeBody)) activeBody = bodies[0].id;
}

const bodyShapeCount = id => nodes.filter(n => n.op === 'add' && n.b === id).length;

// ======================================================================
// baking
// ======================================================================
// Freeze a body — however many shapes, however they were combined — into one
// sampled field, and put it in the library. What comes back is a single shape
// you can place, move, cut with and cut against like any primitive, and which
// costs one texture lookup however complicated the thing it replaced was.
let activeField = 0;

function bakeBody(id, res) {
  if (SF.fields.length >= MAXFIELDS)
    throw new Error(`the library holds ${MAXFIELDS}; delete one first`);
  const own = nodes.filter(n => n.op === 'add' ? n.b === id : hits(n, id));
  if (!own.some(n => n.op === 'add')) throw new Error('that body is empty');
  const B = sceneBounds(own);
  if (!B) throw new Error('nothing with a size to bake');
  // a margin so the surface is never flush with the grid wall, where the
  // clamped sampler would read a plateau instead of a gradient
  const pad = Math.max(2 * res, 1.5);
  const lo = [0, 1, 2].map(a => B.lo[a] - pad);
  const hi = [0, 1, 2].map(a => B.hi[a] + pad);
  const n = [0, 1, 2].map(a => Math.max(2, Math.ceil((hi[a] - lo[a]) / res) + 1));
  const total = n[0] * n[1] * n[2];
  if (total > 24e6) throw new Error(
    `${(total / 1e6).toFixed(0)} M samples — coarsen it`);
  const plan = [{ id, nodes: own.filter(x => x.on) }];
  const data = new Uint8Array(total);
  const range = 8.0;
  let i = 0;
  for (let a = 0; a < n[0]; a++) {
    const x = lo[0] + a * res;
    for (let b = 0; b < n[1]; b++) {
      const y = lo[1] + b * res;
      for (let c = 0; c < n[2]; c++) {
        const t = Math.max(-1, Math.min(1,
          sceneSDF(plan, x, y, lo[2] + c * res) / range));
        data[i++] = Math.round((t + 1) / 2 * 255);
      }
    }
  }
  const box = [0, 1, 2].map(a => (hi[a] - lo[a]) / 2);
  SF.fields.push({ name: (bodyById(id) || {}).name || 'Baked',
                nx: n[0], ny: n[1], nz: n[2], box, range, data, tex: null });
  return { fi: SF.fields.length - 1,
           centre: [0, 1, 2].map(a => (lo[a] + hi[a]) / 2), box, range };
}

// ======================================================================
// selection
// ======================================================================
// `picked` is the selection proper. It holds the shape objects rather than
// their indices, so reordering with ▲▼ cannot rot it. `sel` is only which
// member the inspector edits — the primary.
let picked = new Set();
let selMode = 'single';        // single | sticky | body

// The Scale row has no absolute to show, so it carries a running factor and
// applies the ratio between readings. It has to go back to 1 when the
// selection changes, or the next drag would scale by the leftover ratio --
// so the factor is keyed to which shapes are picked.
let scaleShown = 1, scaleSig = null;
function scaleFactor() {
  const sig = [...picked].map(n => nodes.indexOf(n)).sort().join(',');
  if (sig !== scaleSig) { scaleSig = sig; scaleShown = 1; }
  return scaleShown;
}

// the member the inspector edits; keeps `sel` honest if it drifted out
function primaryNode() {
  const n = nodes[sel];
  if (n && picked.has(n)) return n;
  const i = nodes.findIndex(x => picked.has(x));
  if (i >= 0) { sel = i; return nodes[i]; }
  return null;
}
// Everything a body is made of: its own adds plus every cut or keep that
// reaches it — the same set buildPlan folds to get the body's field. Picking
// only the adds left the cuts behind, which is not what "select body" means.
const bodyMembers = id =>
  nodes.filter(n => n.op === 'add' ? n.b === id : hits(n, id));

function pickShape(n) {
  if (selMode === 'sticky') {
    // sticky is a toggle: tapping something already in the selection is how
    // you take it back out
    if (picked.has(n)) { unpick(n); return; }
    picked.add(n);
  } else {
    picked = new Set([n]);
  }
  if (n.op === 'add') activeBody = n.b;
  sel = nodes.indexOf(n);
}

function pickBody(id) {
  const list = bodyMembers(id);
  if (selMode === 'sticky') list.forEach(n => picked.add(n));
  else picked = new Set(list);
  if (list.length) sel = nodes.indexOf(list[0]);
}

// long press: take it back out of the selection, whichever mode you are in
function unpick(n) {
  picked.delete(n);
  if (nodes[sel] === n) {
    const i = nodes.findIndex(x => picked.has(x));
    if (i >= 0) sel = i;
  }
}

// ---------- moving a selection as one rigid piece ----------
// Each shape keeps its own rotation, so turning a group means composing a
// world-axis rotation onto every one of them *and* orbiting their positions
// about the group's centre. Angles are stored as Rz*Ry*Rx Euler triples, so
// the composed matrix has to be read back out in that same order — adding the
// angle to each shape instead would only be a rigid turn about Z, and would
// shear the group apart about X and Y.
const D2R = Math.PI / 180, R2D = 180 / Math.PI;
const POSLIM = 150;                      // matches the Position sliders

function eulerToM(r) {
  const a = r[0] * D2R, b = r[1] * D2R, g = r[2] * D2R;
  const ca = Math.cos(a), sa = Math.sin(a), cb = Math.cos(b), sb = Math.sin(b),
        cg = Math.cos(g), sg = Math.sin(g);
  return [cg * cb, cg * sb * sa - sg * ca, cg * sb * ca + sg * sa,
          sg * cb, sg * sb * sa + cg * ca, sg * sb * ca - cg * sa,
          -sb,     cb * sa,                cb * ca];
}
function mToEuler(m) {
  const b = Math.asin(Math.min(Math.max(-m[6], -1), 1));
  if (Math.abs(Math.cos(b)) > 1e-6)
    return [Math.atan2(m[7], m[8]) * R2D, b * R2D, Math.atan2(m[3], m[0]) * R2D];
  // gimbal lock: at ±90° pitch the roll and yaw axes coincide, so put the
  // whole turn in roll rather than letting the two of them fight
  return [Math.atan2(-m[5], m[4]) * R2D, b * R2D, 0];
}
function mMul(A, B) {
  const o = new Array(9);
  for (let r = 0; r < 3; r++)
    for (let c = 0; c < 3; c++)
      o[3 * r + c] = A[3 * r] * B[c] + A[3 * r + 1] * B[3 + c] + A[3 * r + 2] * B[6 + c];
  return o;
}
function axisM(ax, deg) {
  const c = Math.cos(deg * D2R), s = Math.sin(deg * D2R);
  if (ax === 0) return [1, 0, 0, 0, c, -s, 0, s, c];
  if (ax === 1) return [c, 0, s, 0, 1, 0, -s, 0, c];
  return [c, -s, 0, s, c, 0, 0, 0, 1];
}
const mApply = (m, v) => [m[0] * v[0] + m[1] * v[1] + m[2] * v[2],
                          m[3] * v[0] + m[4] * v[1] + m[5] * v[2],
                          m[6] * v[0] + m[7] * v[1] + m[8] * v[2]];

// what the group turns about: the mean of the selected shapes' own origins
function selCentre() {
  const c = [0, 0, 0];
  for (const n of picked) { c[0] += n.p[0]; c[1] += n.p[1]; c[2] += n.p[2]; }
  const k = picked.size || 1;
  return [c[0] / k, c[1] / k, c[2] / k];
}

// Clamp the *shared* delta, not each shape: clamping them one at a time would
// stop the ones that hit the limit while the rest kept going, and the group
// would come apart at the edge of the build volume.
function translateSelection(dx, dy, dz) {
  if (!picked.size) return;
  const d = [dx, dy, dz];
  for (const n of picked)
    for (let i = 0; i < 3; i++) {
      d[i] = Math.min(d[i], POSLIM - n.p[i]);
      d[i] = Math.max(d[i], -POSLIM - n.p[i]);
    }
  for (const n of picked)
    for (let i = 0; i < 3; i++) n.p[i] += d[i];
}

// Uniform only. Per-axis scaling of a rotated assembly is not expressible in
// this representation -- a box turned 30 degrees and squashed in x is no
// longer a box -- so offering it would quietly lie about what it did.
// Everything with a length scales: the shapes' own dimensions, their offset
// from the centre, and the blend and corner radii, which are lengths too and
// would otherwise grow in proportion as the model shrank.
function scaleSelection(f) {
  if (!picked.size || !(f > 0) || f === 1) return;
  const C = selCentre();
  for (const n of picked) {
    for (let i = 0; i < 3; i++)
      n.p[i] = Math.min(Math.max(C[i] + (n.p[i] - C[i]) * f, -POSLIM), POSLIM);
    const P = PRIMS[n.t];
    // a plane has no size; a baked field's box is the grid it samples, and
    // scaling that would resample it wrong, so both are left alone. Within a
    // shape, only the dims that are lengths scale: a hexagon scaled by 1.5 is
    // a bigger hexagon, not a nine-sided one, and a 90° arc stays 90°.
    if (!P.infinite && !P.baked)
      for (let i = 0; i < n.d.length; i++)
        if (dimIsLength(n.t, i)) n.d[i] *= f;
    n.k *= f;
    if (n.round) n.round *= f;
  }
}

function rotateSelection(ax, deg) {
  if (!picked.size || !deg) return;
  const D = axisM(ax, deg), C = selCentre();
  for (const n of picked) {
    const v = mApply(D, [n.p[0] - C[0], n.p[1] - C[1], n.p[2] - C[2]]);
    for (let i = 0; i < 3; i++)
      n.p[i] = Math.min(Math.max(C[i] + v[i], -POSLIM), POSLIM);
    n.r = mToEuler(mMul(D, eulerToM(n.r)));
  }
}

// after nodes are replaced or spliced, drop members that are no longer there
const syncPicked = () =>
  picked = new Set([...picked].filter(n => nodes.indexOf(n) >= 0));
const resetPicked = () => picked = new Set(nodes[sel] ? [nodes[sel]] : []);

// sceneBounds() is defined in an earlier script block, so it cannot reach
// bodyShown — hand it a list with the hidden bodies already taken out.
const shownNodes = () => nodes.filter(n => n.op !== 'add' || bodyShown(n.b));

// One entry per body, holding the shapes that body is folded from: its own
// adds plus every cut/keep aimed at it, in list order. Bodies with nothing
// to build are dropped so they cost no shader.
function buildPlan(list) {
  const live = list.filter(n => n.on);
  const plan = [];
  for (const b of bodies) {
    if (b.on === false) continue;          // hidden: out of the view and the STL
    const own = live.filter(n => n.op === 'add' ? n.b === b.id : hits(n, b.id));
    if (own.some(n => n.op === 'add')) plan.push({ id: b.id, nodes: own });
  }
  return plan;
}

// A Plane cut with no rotation keeps everything above its own z — that is
// the flat-belly cut every print-in-place part wants.
const STARTERS = {
  // The opening model. Cone tipped point-down with its apex 3 mm under the

  'Ice cream': [

    makeNode('cone', { p: [0, 0, 19], d: [3, 17, 44], round: 1 }),
    makeNode('torus', { p: [0, 0, 44.5], d: [16.5, 5, 0], k: 1.25 }),
    makeNode('plane', { op: 'cut', p: [0, 0, 0], k: 2.75 })
  ],
  'Blob': [

    makeNode('capsule', { p: [22, 0, 12], r: [0, 90, 0], d: [8, 44, 0], k: 8 }),
    makeNode('sphere', { p: [46, 0, 14], d: [9, 0, 0], k: 6 }),
    makeNode('plane', { op: 'cut', p: [0, 0, 0] })
  ],
  'Vase': [
    makeNode('cone', { p: [0, 0, 30], d: [16, 22, 60], round: 3 }),
    makeNode('cone', { op: 'cut', p: [0, 0, 32], d: [13.4, 19.4, 60], round: 3 }),
    makeNode('torus', { p: [0, 0, 58], d: [21, 2.5, 0], k: 2 })
  ],
  'Keytag': [
    makeNode('box', { p: [0, 0, 2], d: [46, 20, 4], round: 2 }),
    makeNode('cylinder', { op: 'cut', p: [-17, 0, 2], d: [3, 20, 0] }),
    makeNode('sphere', { op: 'cut', p: [6, 0, 8.5], d: [7, 0, 0], k: 1.5 })
  ],
  'Bracket': [
    makeNode('box', { p: [0, 0, 2.5], d: [60, 30, 5] }),
    makeNode('box', { p: [-27.5, 0, 13], d: [5, 30, 26], k: 5 }),
    makeNode('cylinder', { op: 'cut', p: [18, 9, 2.5], d: [2.6, 20, 0],
                           mx: true, my: true }),
    makeNode('plane', { op: 'cut', p: [0, 0, 0] })
  ]
