  const vol = [0, 1, 2].reduce((a, i) => a * Math.max(B.hi[i] - B.lo[i], 1), 1);
  const budget = sampler() ? VIEW_SAMPLES : 1.5e5;
  return Math.min(Math.max(Math.cbrt(vol / budget), 0.25), 8);
}

function buildMesh() {
  const t0 = Date.now();
  // whatever happens below, do not come back and try it again next frame
  meshStale = false;
  const plan = buildPlan(nodes);
  const B = sceneBounds(shownNodes());
  if (!B || !plan.length) { freeMesh(); meshTris = 0; return; }
  const res = viewRes(B);
  // Past the GPU's uniform block there is no shader to fill the grid with, so
  // the kernel's own JavaScript does it. Slower by a lot; the same answer.
  const use = sampler() && planCount(plan) <= GPU_N ? sampler() : null;
  let m = null;
  try { m = SF.mesh(plan, { res, bounds: B, sample: use, maxSamples: 8e6 }); }
  catch (e) { freeMesh(); meshTris = 0; showErr('view: ' + e.message); return; }
  if (!m || !m.indices.length) { freeMesh(); meshTris = 0; return; }

  const P = m.positions, I = m.indices;
  const N = new Float32Array(P.length);
  for (let t = 0; t < I.length; t += 3) {
    const a = 3 * I[t], b = 3 * I[t + 1], c = 3 * I[t + 2];
    const ux = P[b] - P[a], uy = P[b + 1] - P[a + 1], uz = P[b + 2] - P[a + 2];
    const vx = P[c] - P[a], vy = P[c + 1] - P[a + 1], vz = P[c + 2] - P[a + 2];
    const nx = uy * vz - uz * vy, ny = uz * vx - ux * vz, nz = ux * vy - uy * vx;
    for (const o of [a, b, c]) { N[o] += nx; N[o + 1] += ny; N[o + 2] += nz; }
  }
  if (!meshProg) {
    meshProg = makeProgram(MESH_VS, MESH_FS);
    for (const k of ['uMVP', 'uTint', 'uEye'])
      meshU[k] = gl.getUniformLocation(meshProg, k);
  }
  // The last mesh's buffers go back to the driver first. An edit rebuilds this
  // every time the view settles, and a vertex array and three buffers apiece
  // is real memory that nothing else was ever going to reclaim.
  freeMesh();
  meshVao = gl.createVertexArray();
  gl.bindVertexArray(meshVao);
  const put = (data, loc) => {
    const buf = gl.createBuffer();
    meshBufs.push(buf);
    gl.bindBuffer(gl.ARRAY_BUFFER, buf);
    gl.bufferData(gl.ARRAY_BUFFER, data, gl.STATIC_DRAW);
    gl.enableVertexAttribArray(loc);
    gl.vertexAttribPointer(loc, 3, gl.FLOAT, false, 0, 0);
  };
  put(P, 0); put(N, 1);
  const eb = gl.createBuffer();
  meshBufs.push(eb);
  gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER, eb);
  gl.bufferData(gl.ELEMENT_ARRAY_BUFFER, I, gl.STATIC_DRAW);
  gl.bindVertexArray(null);
  meshCount = I.length;
  meshTris = I.length / 3;
  meshRes = res;
  meshOn = use ? 'GPU' : 'JS';
  meshMs = Date.now() - t0;
}

// ---------- camera ----------
// One vertical field of view shared by the raymarcher, the line overlay and
// the drag-to-move maths — they disagree visibly if it is written out twice.
const FOV = 45 * Math.PI / 180;
const TAN_HALF_FOV = Math.tan(FOV / 2);
const cam = { yaw: -0.9, pitch: 0.45, dist: 150, tgt: [0, 0, 12] };
function camEye() {
  const cp = Math.cos(cam.pitch);
  return [cam.tgt[0] + cam.dist * cp * Math.cos(cam.yaw),
          cam.tgt[1] + cam.dist * cp * Math.sin(cam.yaw),
          cam.tgt[2] + cam.dist * Math.sin(cam.pitch)];
}
function camBasis() {
  const eye = camEye();
  let f = [cam.tgt[0] - eye[0], cam.tgt[1] - eye[1], cam.tgt[2] - eye[2]];
  const fl = Math.hypot(f[0], f[1], f[2]) || 1;
  f = [f[0] / fl, f[1] / fl, f[2] / fl];
  let r = [f[1], -f[0], 0];                   // f × worldUp(0,0,1)
  const rl = Math.hypot(r[0], r[1], r[2]) || 1;
  r = [r[0] / rl, r[1] / rl, 0];
  const u = [r[1] * f[2] - r[2] * f[1], r[2] * f[0] - r[0] * f[2],
             r[0] * f[1] - r[1] * f[0]];
  return { eye, r, u, f };
}
// The canvas runs full-bleed behind the bottom sheet, so the part of it you
// can actually see is only the band above the sheet — fit the model to that.
function visibleBand() {
  const w = canvas.clientWidth || innerWidth;
  const H = canvas.clientHeight || innerHeight;
  const pr = panel.getBoundingClientRect();
  const overlaps = pr.left < w - 1 && pr.top < H;      // false on the desktop rail
  const hidden = overlaps ? Math.min(Math.max(H - pr.top, 0), H * 0.8) : 0;
  return { w, H, h: H - hidden, hidden };
}
function frameModel() {
  const B = sceneBounds(shownNodes());
  if (!B) { cam.tgt = [0, 0, 12]; cam.dist = 150; needDraw(); return; }
  cam.tgt = [(B.lo[0] + B.hi[0]) / 2, (B.lo[1] + B.hi[1]) / 2,
             (B.lo[2] + B.hi[2]) / 2];
  // bounding sphere, so the fit holds at every orbit angle
  const R = Math.max(0.5 * Math.hypot(B.hi[0] - B.lo[0], B.hi[1] - B.lo[1],
                                      B.hi[2] - B.lo[2]), 5);
  const V = visibleBand();
  // the projection maps the whole canvas height to 2*dist*tan(fov/2); a band
  // of p pixels therefore shows 2*dist*tan(fov/2)*p/H of world
  const fit = Math.min(V.h, V.w);
  cam.dist = Math.min(Math.max(1.1 * R * V.H / (TAN_HALF_FOV * fit), 30), 2000);
  // and push the model up into that band instead of the canvas centre
  if (V.hidden > 1) {
    const { u } = camBasis();
    const mmPerPx = 2 * cam.dist * TAN_HALF_FOV / V.H;
    const shift = V.hidden / 2 * mmPerPx;
    for (let a = 0; a < 3; a++) cam.tgt[a] -= u[a] * shift;
  }
  needDraw();
}

// ---------- matrices for the selection box ----------
function mvpMatrix(aspect) {
  const { eye, r, u, f } = camBasis();
  const near = 1, far = 4000;
  const t = 1 / TAN_HALF_FOV;
  // view = R^T * translate(-eye), with -f as the camera's +Z
  const V = [
    r[0], u[0], -f[0], 0,
    r[1], u[1], -f[1], 0,
    r[2], u[2], -f[2], 0,
    -(r[0] * eye[0] + r[1] * eye[1] + r[2] * eye[2]),
    -(u[0] * eye[0] + u[1] * eye[1] + u[2] * eye[2]),
     (f[0] * eye[0] + f[1] * eye[1] + f[2] * eye[2]), 1];
  const P = [t / aspect, 0, 0, 0, 0, t, 0, 0,
             0, 0, (far + near) / (near - far), -1,
             0, 0, 2 * far * near / (near - far), 0];
  const M = new Float32Array(16);
  for (let c = 0; c < 4; c++)
    for (let rr = 0; rr < 4; rr++) {
      let s = 0;
      for (let k = 0; k < 4; k++) s += P[k * 4 + rr] * V[c * 4 + k];
      M[c * 4 + rr] = s;
    }
  return M;
}
function selectionLines(n) {
  if (!n || PRIMS[n.t].infinite) return null;
  const h = PRIMS[n.t].ext(n.d).map(v => v + (n.round || 0));
  const e = n.r.map(v => v * Math.PI / 180);
  const c = e.map(Math.cos), s = e.map(Math.sin);
  const rot = v => {
    let x = v[0], y = c[0] * v[1] - s[0] * v[2], z = s[0] * v[1] + c[0] * v[2];
    const x2 = c[1] * x + s[1] * z; z = -s[1] * x + c[1] * z; x = x2;
    return [c[2] * x - s[2] * y, s[2] * x + c[2] * y, z];
  };
  const E = [[0,1],[1,3],[3,2],[2,0],[4,5],[5,7],[7,6],[6,4],
             [0,4],[1,5],[2,6],[3,7]];
  const out = [];
  const signs = [[1,1,1]];
  if (n.mx) signs.push(...signs.map(v => [-v[0], v[1], v[2]]));
  if (n.my) signs.push(...signs.map(v => [v[0], -v[1], v[2]]));
  if (n.mz) signs.push(...signs.map(v => [v[0], v[1], -v[2]]));
  for (const sg of signs) {
    const corners = [];
    for (let i = 0; i < 8; i++) {
      const v = rot([(i & 1 ? 1 : -1) * h[0], (i & 2 ? 1 : -1) * h[1],
                     (i & 4 ? 1 : -1) * h[2]]);
      corners.push([sg[0] * (v[0] + n.p[0]), sg[1] * (v[1] + n.p[1]),
                    sg[2] * (v[2] + n.p[2])]);
    }
    for (const [a, b] of E) out.push(...corners[a], ...corners[b]);
  }
  return new Float32Array(out);
}

// one box per selected shape
function selectionOutlines() {
  const parts = [];
  for (const n of picked) {
    if (!n.on) continue;
    const l = selectionLines(n);
    if (l && l.length) parts.push(l);
  }
  if (!parts.length) return null;
  const total = parts.reduce((a, p) => a + p.length, 0);
  const out = new Float32Array(total);
  let at = 0;
  for (const p of parts) { out.set(p, at); at += p.length; }
  return out;
}

// ======================================================================
// tapping a shape, and the widget that appears when you do
// ======================================================================
// Until now the only way to select something was the list. That is fine for a
// model you can see all of and wrong for one you are looking at: the shape
// under your finger is the one you mean, and the list should follow rather
// than lead. So a tap in the viewport is a pick.
//
// The pick is a ray marched against the same field the shader draws, in the
// kernel's JavaScript rather than on the GPU. One tap is a few hundred
// evaluations, which is nothing, and it needs no render target, no readback
// and no second copy of the scene in a picking shader that could disagree
// with the one on screen.

// The ray through a CSS pixel. This has to agree with the fragment shader's
// own construction or the tap lands somewhere other than where you touched:
// uv spans +/-0.5 vertically, the focal length carries that 0.5, and the
// screen's y runs the opposite way to clip space's.
function rayAt(px, py) {
  const { eye, r, u, f } = camBasis();
  const w = canvas.clientWidth || innerWidth, h = canvas.clientHeight || innerHeight;
  const ux = (px - w / 2) / h, uy = -(py - h / 2) / h;
  const fl = 0.5 / TAN_HALF_FOV;
  const d = [r[0] * ux + u[0] * uy + f[0] * fl,
             r[1] * ux + u[1] * uy + f[1] * fl,
             r[2] * ux + u[2] * uy + f[2] * fl];
  const l = Math.hypot(d[0], d[1], d[2]) || 1;
  return { o: eye, d: [d[0] / l, d[1] / l, d[2] / l] };
}

// Which shape owns the surface at a point: the `add` whose own field is
// nearest it. Where two shapes blend there is no single answer — the surface
// there belongs to both — and the nearer one is what anybody pointing at it
// means. Cuts are not candidates: you cannot tap a hole.
function ownerAt(p, plan) {
  const q = [0, 0, 0], e = [0, 0, 0], seen = new Set();
  let best = null, bd = 1e9;
  for (const part of plan) for (const n of part.nodes) {
    if (n.op !== 'add' || seen.has(n)) continue;
    seen.add(n);
    e[0] = n.r[0] * RAD; e[1] = n.r[1] * RAD; e[2] = n.r[2] * RAD;
    invRot((n.mx ? Math.abs(p[0]) : p[0]) - n.p[0],
           (n.my ? Math.abs(p[1]) : p[1]) - n.p[1],
           (n.mz ? Math.abs(p[2]) : p[2]) - n.p[2], e, q);
    const di = Math.abs(PRIMS[n.t].js(q, n.d, roundSlot(n), n));
    if (di < bd) { bd = di; best = n; }
  }
  return best;
}

function pickAt(px, py) {
  const plan = buildPlan(nodes);
  if (!plan.length) return null;
  const { o, d } = rayAt(px, py);
  let t = 1;
  for (let i = 0; i < 220; i++) {
    const x = o[0] + d[0] * t, y = o[1] + d[1] * t, z = o[2] + d[2] * t;
    const dist = sceneSDF(plan, x, y, z);
    if (dist < 0.06) return ownerAt([x, y, z], plan);
    // the same 0.72 the shader steps by: neither smin nor the ellipsoid is a
    // true distance, and a full step tunnels through a thin blended shoulder
    t += Math.max(dist * 0.72, 0.05);
    if (t > 4000) break;
  }
  return null;
}

// ---------- the widget ----------
// Three handles at the selection's pivot — the *same* pivot selCentre() gives
// the Place sliders, so the two controls cannot disagree about what a turn is
// about. Everything a handle does goes through translateSelection,
// rotateSelection and scaleSelection: the widget is a new way to drive the
// operations that were already there, not a second implementation of them.
const AXV = [[1, 0, 0], [0, 1, 0], [0, 0, 1]];
// X red, Y green, Z blue, as every modelling tool has for forty years -- but
// Z pushed towards violet, because a selected shape is drawn in cyan and the
// handle for its up axis was disappearing into it.
const AXCOL = [[1.00, 0.35, 0.43], [0.37, 0.83, 0.55], [0.49, 0.57, 1.00]];
let gizMode = 'move';            // move | rotate | scale
let gizDrag = null;              // the handle being dragged, if any
let gizHot = -1;                 // the handle under the pointer

// Constant on screen rather than in the model: a widget that scaled with the
// shape would be untappable on a small part and swamp the view on a large one.
function gizSize() {
  const C = selCentre(), eye = camBasis().eye;
  const dist = Math.hypot(C[0] - eye[0], C[1] - eye[1], C[2] - eye[2]);
  return Math.max(dist * TAN_HALF_FOV * 0.26, 1);
}

// What a handle can be grabbed by. Sampled along the thing you can see, so
// what is hittable is what is drawn — a ring you can only catch at four points
// feels broken, and an arrow with a hitbox wider than itself feels haunted.
function gizPoints(a, C, L) {
  const out = [];
  if (gizMode === 'rotate') {
    const U = AXV[(a + 1) % 3], V = AXV[(a + 2) % 3];
    for (let i = 0; i < 48; i++) {
      const th = i / 48 * 2 * Math.PI, c = Math.cos(th), s = Math.sin(th);
      out.push([C[0] + (U[0] * c + V[0] * s) * L,
                C[1] + (U[1] * c + V[1] * s) * L,
                C[2] + (U[2] * c + V[2] * s) * L]);
    }
    return out;
  }
  const A = AXV[a];
  for (let i = 3; i <= 10; i++) {
    const f = i / 10;
    out.push([C[0] + A[0] * L * f, C[1] + A[1] * L * f, C[2] + A[2] * L * f]);
  }
  return out;
}

// What it looks like. An arrow for move, a ring for turn, a cube for scale —
// the handle says which of the three it is without reading the toolbar.
function gizLines(a, C, L) {
  const A = AXV[a], U = AXV[(a + 1) % 3], V = AXV[(a + 2) % 3], out = [];
  const at = (t, u, v) => [C[0] + A[0] * t + U[0] * u + V[0] * v,
                           C[1] + A[1] * t + U[1] * u + V[1] * v,
                           C[2] + A[2] * t + U[2] * u + V[2] * v];
  const seg = (p, q) => out.push(p[0], p[1], p[2], q[0], q[1], q[2]);
  if (gizMode === 'rotate') {
    const N = 48;
    for (let i = 0; i < N; i++) {
      const t0 = i / N * 2 * Math.PI, t1 = (i + 1) / N * 2 * Math.PI;
      seg(at(0, Math.cos(t0) * L, Math.sin(t0) * L),
          at(0, Math.cos(t1) * L, Math.sin(t1) * L));
    }
    return new Float32Array(out);
  }
  seg(at(L * 0.16, 0, 0), at(L * 0.78, 0, 0));
  const r = L * 0.105;
  if (gizMode === 'move') {
    const tip = at(L, 0, 0);
    for (let i = 0; i < 6; i++) {
      const th = i / 6 * 2 * Math.PI, th2 = (i + 1) / 6 * 2 * Math.PI;
      const b0 = at(L * 0.78, Math.cos(th) * r, Math.sin(th) * r);
      seg(tip, b0);
      seg(b0, at(L * 0.78, Math.cos(th2) * r, Math.sin(th2) * r));
    }
  } else {
    const o = L * 0.88, C8 = [];
    for (let i = 0; i < 8; i++)
      C8.push(at(o + (i & 4 ? r : -r), (i & 1 ? r : -r), (i & 2 ? r : -r)));
    for (const [x, y] of [[0,1],[1,3],[3,2],[2,0],[4,5],[5,7],[7,6],[6,4],
                          [0,4],[1,5],[2,6],[3,7]]) seg(C8[x], C8[y]);
  }
  return new Float32Array(out);
}

// world point -> CSS pixel, through the same matrix the overlay draws with
function projectPt(P, M, w, h) {
  const cw = M[3] * P[0] + M[7] * P[1] + M[11] * P[2] + M[15];
  if (cw <= 1e-6) return null;
  const x = (M[0] * P[0] + M[4] * P[1] + M[8] * P[2] + M[12]) / cw;
  const y = (M[1] * P[0] + M[5] * P[1] + M[9] * P[2] + M[13]) / cw;
  return [(x * 0.5 + 0.5) * w, (1 - (y * 0.5 + 0.5)) * h];
}

function gizPick(px, py) {
  if (!picked.size) return -1;
  const w = canvas.clientWidth || innerWidth, h = canvas.clientHeight || innerHeight;
  const M = mvpMatrix(w / h), C = selCentre(), L = gizSize();
  let best = -1, bd = 26;                       // a fingertip, in pixels
  for (let a = 0; a < 3; a++)
    for (const P of gizPoints(a, C, L)) {
      const sp = projectPt(P, M, w, h);
      if (!sp) continue;
      const dd = Math.hypot(sp[0] - px, sp[1] - py);
      if (dd < bd) { bd = dd; best = a; }
    }
  return best;
}

// Where the pointer is along a handle's axis, in millimetres from the pivot:
// the point on the axis line closest to the ray through the pointer.
function axisParam(px, py, C, A) {
  const { o, d } = rayAt(px, py);
  const b = A[0] * d[0] + A[1] * d[1] + A[2] * d[2];
  const den = 1 - b * b;
  if (Math.abs(den) < 1e-4) return null;        // sighting straight down it
  const wx = C[0] - o[0], wy = C[1] - o[1], wz = C[2] - o[2];
  const c = A[0] * wx + A[1] * wy + A[2] * wz;
  const f = d[0] * wx + d[1] * wy + d[2] * wz;
  return (b * f - c) / den;
}

// The angle of the pointer around an axis, measured in the plane the ring is
// drawn in rather than on the screen — so a ring seen almost edge-on still
// turns by the amount the finger travelled along it, not by what it looks
// like it travelled.
function ringAngle(px, py, C, a) {
  const A = AXV[a], U = AXV[(a + 1) % 3], V = AXV[(a + 2) % 3];
  const { o, d } = rayAt(px, py);
  const den = d[0] * A[0] + d[1] * A[1] + d[2] * A[2];
  if (Math.abs(den) < 1e-4) return null;        // ring edge-on: no answer
  const s = ((C[0] - o[0]) * A[0] + (C[1] - o[1]) * A[1] + (C[2] - o[2]) * A[2]) / den;
  if (!(s > 0)) return null;
  const P = [o[0] + d[0] * s - C[0], o[1] + d[1] * s - C[1], o[2] + d[2] * s - C[2]];
  return Math.atan2(P[0] * V[0] + P[1] * V[1] + P[2] * V[2],
                    P[0] * U[0] + P[1] * U[1] + P[2] * U[2]);
}

// The pivot is frozen for the length of the drag. It has to be: the selection
// moves under the handle, and recomputing the centre each event would measure
// every delta against the position the previous delta just produced, which
// comes out as no movement at all.
function gizStart(a, px, py) {
  const C = selCentre().slice();
  if (gizMode === 'rotate') {
    const ang = ringAngle(px, py, C, a);
    if (ang === null) return false;
    gizDrag = { a, mode: 'rotate', C, last: ang };
  } else {
    const t = axisParam(px, py, C, AXV[a]);
    if (t === null) return false;
    if (gizMode === 'scale' && Math.abs(t) < 1e-3) return false;
    gizDrag = { a, mode: gizMode, C, last: t };
  }
  snapshot();
  return true;
}

function gizMove(px, py) {
  if (!gizDrag) return;
  const { a, C } = gizDrag, A = AXV[a];
  if (gizDrag.mode === 'rotate') {
    const ang = ringAngle(px, py, C, a);
    if (ang === null) return;
    let dth = ang - gizDrag.last;
    // the short way round, so crossing the seam is not most of a turn
    while (dth > Math.PI) dth -= 2 * Math.PI;
    while (dth < -Math.PI) dth += 2 * Math.PI;
    gizDrag.last = ang;
    rotateSelection(a, dth * 180 / Math.PI);
  } else if (gizDrag.mode === 'move') {
    const t = axisParam(px, py, C, A);
    if (t === null) return;
    const dt = t - gizDrag.last;
    gizDrag.last = t;
    translateSelection(A[0] * dt, A[1] * dt, A[2] * dt);
  } else {
    const t = axisParam(px, py, C, A);
    if (t === null || Math.abs(gizDrag.last) < 1e-4) return;
    // Uniform, exactly like the Scale slider. Per-axis scaling of a rotated
    // assembly is not expressible in this representation — a box turned 30
    // degrees and squashed in x is no longer a box — so it is not offered
    // here either, however much three separate handles look like it is.
    const f = t / gizDrag.last;
    if (!(f > 0)) return;                       // dragged through the pivot
    gizDrag.last = t;
    scaleSelection(Math.min(Math.max(f, 0.5), 2));
  }
  refreshInspectorValues();
  save(); scheduleInfo(); markInteracting(false);
}

function drawGizmo(w, h) {
  if (!picked.size) return;
  const C = selCentre(), L = gizSize();
  gl.disable(gl.DEPTH_TEST);
  gl.useProgram(lineProg);
  gl.bindVertexArray(lineVAO);
  gl.bindBuffer(gl.ARRAY_BUFFER, lineBuf);
  gl.uniformMatrix4fv(gl.getUniformLocation(lineProg, 'uMVP'), false,
                      mvpMatrix(w / h));
  const uC = gl.getUniformLocation(lineProg, 'uC');
  for (let a = 0; a < 3; a++) {
    const data = gizLines(a, C, L);
    const hot = gizDrag ? gizDrag.a === a : gizHot === a;
    const c = AXCOL[a];
    gl.uniform3f(uC, hot ? Math.min(c[0] * 1.3 + 0.3, 1) : c[0],
                     hot ? Math.min(c[1] * 1.3 + 0.3, 1) : c[1],
                     hot ? Math.min(c[2] * 1.3 + 0.3, 1) : c[2]);
    gl.bufferData(gl.ARRAY_BUFFER, data, gl.DYNAMIC_DRAW);
    gl.drawArrays(gl.LINES, 0, data.length / 3);
  }
  gl.bindVertexArray(null);
}

// The widget's mode switch shows only while it has something to act on.
function syncGizbar() {
  const bar = document.getElementById('gizbar');
  bar.classList.toggle('on', picked.size > 0);
  for (const b of bar.children) b.classList.toggle('on', b.dataset.giz === gizMode);
}
document.getElementById('gizbar').onclick = e => {
  const b = e.target.closest('button[data-giz]');
  if (!b) return;
  gizMode = b.dataset.giz;
  syncGizbar(); needDraw();
};

// The build plate, drawn as lines because the meshed view has no shader to
// draw it in. The marcher keeps its own, which fades with distance and takes
// the model's shadow — neither of which this can do.
let gridCache = null;
function plateGrid() {
  const B = sceneBounds(shownNodes());
  const reach = B ? Math.max(...[0, 1].map(a =>
    Math.max(Math.abs(B.lo[a]), Math.abs(B.hi[a])))) : 60;
  const half = Math.max(Math.ceil(reach / 50) * 50, 100);
  if (gridCache && gridCache.half === half) return gridCache.data;
  const out = [];
  for (let v = -half; v <= half; v += 10) {
    out.push(-half, v, 0, half, v, 0);
    out.push(v, -half, 0, v, half, 0);
  }
  gridCache = { half, data: new Float32Array(out) };
  return gridCache.data;
}

// ---------- draw loop ----------
// Full resolution when idle, coarse while a finger is down — and, since there
// are two pictures now, whichever of them can be had for the frame.
//
// Two costs three orders of magnitude apart, and the scheduling follows from
// how far apart they are. A meshed frame is a buffer draw; a raymarched frame
// pays for every shape in the model on every pixel. Meshing costs about what
// one raymarched frame costs — the grid fill runs the same map() over a
// comparable number of points — so a mesh pays for itself on the second frame
// of any drag.
let pending = false, interacting = false, camMoving = false;
let idleTimer = 0, proxyTimer = 0;
function needDraw() {
  if (pending) return;
  pending = true;
  requestAnimationFrame(draw);
}
// `isCamera` is the whole distinction the proxy rests on. A camera move leaves
// the model alone, so a mesh built before it is still a mesh of what is on the
// screen. A slider move does not, and standing a mesh of the previous shape in
// front of the marcher would show the model not following the hand.
function markInteracting(isCamera) {
  interacting = true;
  camMoving = !!isCamera;
  clearTimeout(idleTimer);
  clearTimeout(proxyTimer);
  idleTimer = setTimeout(settle, 180);
  needDraw();
}
function settle() {
  interacting = false;
  needDraw();
  scheduleProxy();
}
// Once the settled picture is up, pay for the mesh that the next drag will
// stand in front of. Two conditions on that, and both are about it being a
// saving rather than a habit: the grid fill has to be on the GPU, since
// meshing in JavaScript costs more than the frames it would save, and the
// scene has to be big enough for a raymarched frame to be worth avoiding. A
// four-shape model already draws in a millisecond, and meshing it every time
// a slider is let go would be pure overhead.
//
// Called from the end of an interaction and from a structural change, so the
// first orbit after opening a document has a mesh to use rather than the
// second.
function scheduleProxy() {
  clearTimeout(proxyTimer);
  proxyTimer = setTimeout(() => {
    if (interacting || !meshStale) return;
    if (!rayFits || (sampler() && slotAt.size >= 8)) {
      buildMesh(); needDraw(); scheduleInfo();
    }
  }, 140);
}

function draw() {
  pending = false;
  // What can be drawn this frame, which is not always what the model would
  // prefer. A stale mesh is a fine stand-in while the camera moves — it is
  // only a stand-in — but never while the model itself is changing.
  const proxy = rayFits && interacting && camMoving && meshCount && !meshStale;
  const meshed = !rayFits || proxy;
  // Past the marcher's budget the mesh is the only picture there is, so it
  // gets built here when it has to be, on a frame a raymarch would have cost
  // about as much anyway. Not while an edit is still in flight, though: the
  // next pointer event would throw it away.
  if (!rayFits && meshStale && (!interacting || !meshCount)) buildMesh();
  if (!meshed && !prog) return;

  const dpr = Math.min(devicePixelRatio || 1, 2);
  // Dropping the render scale is a raymarch trick — it is the per-pixel cost
  // that hurts. A mesh is cheap enough to draw full size with a finger down.
  const scale = (interacting && !meshed) ? 0.55 : 1;
  const cw = canvas.clientWidth || innerWidth, ch = canvas.clientHeight || innerHeight;
  const w = Math.max(1, Math.round(cw * dpr * scale));
  const h = Math.max(1, Math.round(ch * dpr * scale));
  if (canvas.width !== w || canvas.height !== h) { canvas.width = w; canvas.height = h; }
  gl.viewport(0, 0, w, h);

  if (meshed) drawMeshed(w, h); else drawMarched(w, h);
  drawOverlay(w, h, meshed);
  drawGizmo(w, h);
}

function drawMarched(w, h) {
  gl.disable(gl.DEPTH_TEST);
  const { eye, r, u, f } = camBasis();
  packUniforms();
  gl.useProgram(prog);
  gl.uniform2f(U.uRes, w, h);
  gl.uniform3f(U.uEye, eye[0], eye[1], eye[2]);
  gl.uniformMatrix3fv(U.uCam, false,
    new Float32Array([r[0], r[1], r[2], u[0], u[1], u[2], f[0], f[1], f[2]]));
  gl.uniform1f(U.uFocal, 0.5 / TAN_HALF_FOV);
  gl.uniform3f(U.uTint, 0.91, 0.53, 0.22);
  gl.uniform3f(U.uSelTint, 0.24, 0.60, 0.95);
  // the settled picture is worth matching the STL; the dragged one is not
  bindField();
  if (interacting) gl.uniform2f(U.uHit, 0.0015, 0.004);
  else             gl.uniform2f(U.uHit, 0.0004, 0.002);
  gl.uniform4fv(U.uD, uData);
  gl.bindVertexArray(emptyVAO);
  gl.drawArrays(gl.TRIANGLES, 0, 3);
  gl.bindVertexArray(null);
}

function drawMeshed(w, h) {
  gl.enable(gl.DEPTH_TEST);
  gl.clearColor(0.071, 0.086, 0.104, 1);
  gl.clear(gl.COLOR_BUFFER_BIT | gl.DEPTH_BUFFER_BIT);
  if (!meshCount) return;
  const { eye } = camBasis();
  gl.useProgram(meshProg);
  gl.uniformMatrix4fv(meshU.uMVP, false, mvpMatrix(w / h));
  gl.uniform3f(meshU.uTint, 0.91, 0.53, 0.22);
  gl.uniform3f(meshU.uEye, eye[0], eye[1], eye[2]);
  gl.bindVertexArray(meshVao);
  gl.drawElements(gl.TRIANGLES, meshCount, gl.UNSIGNED_INT, 0);
  gl.bindVertexArray(null);
}

// One box per selected shape, in both pictures — which is what carries the
// selection when the meshed one cannot colour it.
function drawOverlay(w, h, meshed) {
  const lines = selectionOutlines();
  const grid = meshed ? plateGrid() : null;
  if (!lines && !grid) return;
  gl.useProgram(lineProg);
  gl.bindVertexArray(lineVAO);
  gl.bindBuffer(gl.ARRAY_BUFFER, lineBuf);
  gl.uniformMatrix4fv(gl.getUniformLocation(lineProg, 'uMVP'), false,
                      mvpMatrix(w / h));
  const uC = gl.getUniformLocation(lineProg, 'uC');
  if (grid) {
    // the plate is *behind* things, so it is the one overlay that keeps its
    // depth test
    gl.enable(gl.DEPTH_TEST);
    gl.bufferData(gl.ARRAY_BUFFER, grid, gl.DYNAMIC_DRAW);
    gl.uniform3f(uC, 0.17, 0.21, 0.26);
    gl.drawArrays(gl.LINES, 0, grid.length / 3);
  }
  if (lines && lines.length) {
    gl.disable(gl.DEPTH_TEST);
    gl.bufferData(gl.ARRAY_BUFFER, lines, gl.DYNAMIC_DRAW);
    gl.uniform3f(uC, 0.37, 0.78, 0.94);
    gl.drawArrays(gl.LINES, 0, lines.length / 3);
  }
  gl.bindVertexArray(null);
}
addEventListener('resize', () => needDraw());

// ======================================================================
// pointer input — one finger orbits (or moves the shape in Move mode),
// two fingers pinch-zoom and pan
// ======================================================================
let mode = 'orbit';
const pts = new Map();
let last1 = null, lastPinch = 0, lastMid = null;

function screenAxes() {
  const { r, u } = camBasis();
  // mm per pixel at the orbit target, for a 45° vertical fov
  const s = 2 * cam.dist * TAN_HALF_FOV / (canvas.clientHeight || innerHeight);
  return { r, u, s };
}
// Move drags the whole selection, which is the point of being able to make one
function moveSelected(dx, dy, dz) {
  if (!picked.size) return;
  translateSelection(dx, dy, dz);
  refreshInspectorValues();
  save(); scheduleInfo();
}
// A tap is a press that went nowhere. Tracked rather than assumed, because
// the same finger that selects also orbits, and telling them apart after the
// fact is the only way to have both on one gesture.
let tapFrom = null, tapMoved = 0, tapAt = 0, grabbed = false;

canvas.addEventListener('pointerdown', e => {
  canvas.setPointerCapture(e.pointerId);
  pts.set(e.pointerId, [e.clientX, e.clientY]);
  if (pts.size === 1) {
    last1 = [e.clientX, e.clientY];
    tapFrom = [e.clientX, e.clientY]; tapMoved = 0; tapAt = Date.now();
    grabbed = false;
    // a widget handle takes the drag ahead of the camera and ahead of Move
    const a = gizPick(e.clientX, e.clientY);
    if (a >= 0 && gizStart(a, e.clientX, e.clientY)) gizHot = a;
  } else {
    last1 = null; lastPinch = 0; lastMid = null;
    // a second finger is a camera gesture; whatever the first was doing stops
    gizDrag = null; tapFrom = null;
  }
});
canvas.addEventListener('pointermove', e => {
  if (!pts.has(e.pointerId)) {
    // nothing pressed: light up the handle under the cursor, which is the
    // only hint a mouse gets that these things are grabbable
    if (picked.size && !gizDrag) {
      const a = gizPick(e.clientX, e.clientY);
      if (a !== gizHot) { gizHot = a; needDraw(); }
    }
    return;
  }
  if (tapFrom) {
    tapMoved += Math.hypot(e.clientX - tapFrom[0], e.clientY - tapFrom[1]);
    tapFrom = [e.clientX, e.clientY];
  }
  if (gizDrag) { gizMove(e.clientX, e.clientY); return; }
  pts.set(e.pointerId, [e.clientX, e.clientY]);
  const P = [...pts.values()];
  // Move mode drags the shape, not the view — so the frame it asks for is not
  // one a mesh of the previous shape may stand in for.
  let camera = true;
  if (P.length === 1 && last1) {
    const dx = e.clientX - last1[0], dy = e.clientY - last1[1];
    last1 = [e.clientX, e.clientY];
    if (mode === 'grab') {
      const { r, u, s } = screenAxes();
      camera = false;
      // one undo step per drag, and none at all for a drag that never was —
      // in Move mode a tap now selects, and a tap must not cost an undo
      if (!grabbed) { snapshot(); grabbed = true; }
      moveSelected((r[0] * dx - u[0] * dy) * s, (r[1] * dx - u[1] * dy) * s,
                   (r[2] * dx - u[2] * dy) * s);
    } else {
      cam.yaw -= dx * 0.006;
      cam.pitch = Math.min(Math.max(cam.pitch + dy * 0.006, -1.45), 1.45);
    }
  } else if (P.length >= 2) {
    const d = Math.hypot(P[0][0] - P[1][0], P[0][1] - P[1][1]);
    const mid = [(P[0][0] + P[1][0]) / 2, (P[0][1] + P[1][1]) / 2];
    if (lastPinch && d) cam.dist = Math.min(Math.max(cam.dist * lastPinch / d, 8), 2000);
    if (lastMid) {
      const dx = mid[0] - lastMid[0], dy = mid[1] - lastMid[1];
      const { r, u, s } = screenAxes();
      if (mode === 'grab' && picked.size) {
        // two fingers in Move mode raise/lower along the build direction
        camera = false;
        if (!grabbed) { snapshot(); grabbed = true; }
        moveSelected(0, 0, -dy * s);
      } else {
        cam.tgt[0] -= (r[0] * dx - u[0] * dy) * s;
        cam.tgt[1] -= (r[1] * dx - u[1] * dy) * s;
        cam.tgt[2] -= (r[2] * dx - u[2] * dy) * s;
      }
    }
    lastPinch = d; lastMid = mid;
  }
  markInteracting(camera);
});
function endPtr(e) {
  const wasGiz = !!gizDrag;
  gizDrag = null;
  pts.delete(e.pointerId);
  const P = [...pts.values()];
  last1 = P.length === 1 ? P[0] : null;
  if (P.length < 2) { lastPinch = 0; lastMid = null; }
  // A press that stayed put and did not drive a handle is a tap, and a tap
  // picks. The thresholds are a finger's worth of wobble and rather less than
  // a long press, so an orbit that happens to end where it started is not
  // mistaken for one.
  if (!wasGiz && !P.length && tapFrom && tapMoved < 8 && Date.now() - tapAt < 700)
    tapPick(e.clientX, e.clientY);
  tapFrom = null;
  markInteracting(true);
}

// Tapping nothing clears the selection, which is also how the widget is put
// away. In Sticky mode it does not, because there the whole point is that the
// selection survives what you tap next.
function tapPick(px, py) {
  const n = pickAt(px, py);
  if (n) pickShape(n);
  else if (selMode !== 'sticky') picked = new Set();
  else return;
  renderList(); renderInspector(); save(); needDraw();
  // bring the row into view: on a long list the shape you just tapped is
  // otherwise marked somewhere you cannot see
  const row = document.querySelector('#nodes .node.sel, #nodes .node.pick');
  if (row) row.scrollIntoView({ block: 'nearest' });
}
canvas.addEventListener('pointerup', endPtr);
canvas.addEventListener('pointercancel', endPtr);
canvas.addEventListener('wheel', e => {
  e.preventDefault();
  cam.dist = Math.min(Math.max(cam.dist * Math.exp(e.deltaY * 0.0012), 8), 2000);
  markInteracting(true);
}, { passive: false });
// iOS fires these on double-tap zoom attempts over the canvas
document.addEventListener('gesturestart', e => e.preventDefault());
document.addEventListener('dblclick', e => e.preventDefault());

                                    : Math.round(v).toString());

// ---------- baked library ----------
function renderBaked() {
  const box = $('baked');
  box.innerHTML = '';
  SF.fields.forEach((f, i) => {
    const used = nodes.filter(n => isField(n) && n.fi === i).length;
    const el = document.createElement('div');
    el.className = 'node body' + (i === activeField ? ' sel' : '');
    el.innerHTML =
      `<span class="nm">${f.name}</span>` +
      `<span class="bd">${f.nx}\u00d7${f.ny}\u00d7${f.nz}</span>` +
      `<button class="ic" data-act="place" title="Place one">\uff0b</button>` +
      `<button class="ic" data-act="rename">\u270e</button>` +
      `<button class="ic" data-act="del" title="${used ? used + ' in use' : ''}">\u2715</button>`;
    el.onclick = ev => {
      const act = ev.target.dataset && ev.target.dataset.act;
      if (act === 'place') {
        snapshot();
        // No `round`: the kernel takes a field's sample range through that
        // slot itself, off the library entry, so writing it onto the node
        // would only be a second copy that the next rename could not fix.
        const c = makeNode('field', { fi: i, b: activeBody, p: [0, 0, f.box[2]],
                                      d: f.box.slice() });
        nodes.push(c);
        sel = nodes.length - 1; picked = new Set([c]);
      } else if (act === 'rename') {
        renameField(f); return;
      } else if (act === 'del') {
        if (used) { showErr(`${used} shape(s) still use ${f.name}`); return; }
        snapshot();
        if (f.tex) gl.deleteTexture(f.tex);
        SF.fields.splice(i, 1);
        // instances after it shift down with it
        for (const n of nodes)
          if (isField(n) && n.fi > i) n.fi--;
        activeField = Math.max(0, Math.min(activeField, SF.fields.length - 1));
      } else activeField = i;
      sceneChanged(); renderList(); renderInspector(); save(); needDraw();
    };
    box.appendChild(el);
  });
  $('bakedCount').textContent = SF.fields.length
    ? SF.fields.length + '/' + MAXFIELDS : '';
}

function renameField(f) {
  openModal('Rename baked shape',
    `<input id="bnm" type="text" maxlength="24" value="${f.name.replace(/"/g, '&quot;')}">` +
    '<div class="bar" style="margin-top:10px"><button class="btn" id="bok">Rename</button></div>',
    () => {
      const inp = $('bnm'); inp.focus(); inp.select();
      const go = () => {
        const v = inp.value.trim();
        if (v) { snapshot(); f.name = v; f.b64 = null; }
        closeModal(); renderList(); save();
      };
      $('bok').onclick = go;
      inp.onkeydown = e => { if (e.key === 'Enter') go(); };
    });
}

$('bakeBtn').onclick = () => {
  const res = parseFloat(prompt(
    'Grid spacing in mm for the bake.\n\nFiner is truer but the document '
    + 'grows as the cube of it.', '0.8') || '0');
  if (!(res > 0.05)) return;
  try {
    snapshot();
    const id = activeBody;
    const r = bakeBody(id, res);
    // The body's shapes are replaced by the one baked shape. Its cuts were
    // baked in too, so a cut that reached nothing but this body has done its
    // work and goes; one that also reaches a body still standing has to stay,
    // and will simply find nothing left to do here.
    const live = new Set(bodies.map(x => x.id));
    const spent = n => n.op === 'add'
      ? n.b === id
      : (n.tg ? n.tg.every(t => t === id)
              : [...live].every(t => t === id));
    const gone = new Set(nodes.filter(spent));
    nodes = nodes.filter(n => !gone.has(n));
    const c = makeNode('field', { fi: r.fi, b: id, p: r.centre,
                                  d: r.box.slice() });
    nodes.push(c);
    sel = nodes.indexOf(c); picked = new Set([c]);
    activeField = r.fi;
    syncBodies(); syncPicked();
    sceneChanged(); renderList(); renderInspector(); save(); needDraw();
  } catch (e) { undo(); showErr('bake: ' + e.message); }
};

// ---------- body list ----------
// The whole point of a body is that it is a thing you work on, so it needs to
// be visible without hunting through the shapes: what exists, which one you
// are building into, and a way to get the others out of the way.
function renderBodies() {
  const box = $('bodies');
  box.innerHTML = '';
  bodies.forEach(b => {
    const el = document.createElement('div');
    const count = bodyShapeCount(b.id);
    el.className = 'node body' + (b.id === activeBody ? ' sel' : '') +
                   (b.on === false ? ' off' : '');
    el.innerHTML =
      `<button class="ic" data-act="show">${b.on === false ? '○' : '●'}</button>` +
      `<span class="nm">${b.name}</span>` +
      `<span class="bd">${count} shape${count === 1 ? '' : 's'}</span>` +
      `<button class="ic" data-act="rename">✎</button>` +
      (bodies.length > 1 ? `<button class="ic" data-act="del">✕</button>` : '');
    el.onclick = ev => {
      const act = ev.target.dataset && ev.target.dataset.act;
      if (act === 'show') {
        snapshot(); b.on = b.on === false;
      } else if (act === 'rename') {
        renameBody(b); return;
      } else if (act === 'del') {
        snapshot();
        nodes = nodes.filter(n => !(n.op === 'add' && n.b === b.id));
        bodies = bodies.filter(x => x.id !== b.id);
        sel = Math.max(0, Math.min(sel, nodes.length - 1));
        syncBodies(); syncPicked();
      } else {
        // the body browser is the way to select a body: everything it is
        // made of, its own shapes and the cuts that reach them
        activeBody = b.id;
        pickBody(b.id);
      }
      sceneChanged(); renderList(); renderInspector(); save(); needDraw();
    };
    box.appendChild(el);
  });
  $('bodyCount').textContent = bodies.length;
}

function renameBody(b) {
  openModal('Rename body',
    `<input id="bnm" type="text" maxlength="24" value="${b.name.replace(/"/g, '&quot;')}">` +
    '<div class="bar" style="margin-top:10px"><button class="btn" id="bok">Rename</button></div>',
    () => {
      const inp = $('bnm');
      inp.focus(); inp.select();
      const go = () => {
        const v = inp.value.trim();
        if (v) { snapshot(); b.name = v; }
        closeModal();
        renderList(); renderInspector(); save();
      };
      $('bok').onclick = go;
      inp.onkeydown = e => { if (e.key === 'Enter') go(); };
    });
}

$('addBodyBtn').onclick = () => {
  snapshot();
  activeBody = addBody();
  renderList(); renderInspector(); save();
};

// ---------- shape list ----------
function renderList() {
  const box = $('nodes');
  box.innerHTML = '';
  nodes.forEach((n, i) => {
    const el = document.createElement('div');
    // shapes outside the body you are working on stay legible but step back
    const elsewhere = bodies.length > 1 &&
      (n.op === 'add' ? n.b !== activeBody : !hits(n, activeBody));
    el.className = 'node' + (picked.has(n) ? ' pick' : '') +
                   (i === sel && picked.has(n) ? ' sel' : '') +
                   (n.on ? '' : ' off') + (elsewhere ? ' away' : '');
    const opCls = n.op === 'cut' ? 'cut' : n.op === 'keep' ? 'keep' : '';
    // a one-body model reads exactly as it did before bodies existed
    const badge = bodies.length < 2 ? ''
      : `<span class="bd">${n.op === 'add' ? bodyName(n.b)
          : !n.tg ? 'all'
          : n.tg.length ? n.tg.map(bodyName).join('·')
          : 'none'}</span>`;
    el.innerHTML =
      `<button class="ic" data-act="on">${n.on ? '●' : '○'}</button>` +
      `<span class="nm">${PRIMS[n.t].name}</span>` +
      badge +
      `<span class="op ${opCls}">${OPS.find(o => o[0] === n.op)[1]}</span>` +
      `<button class="ic" data-act="up">▲</button>` +
      `<button class="ic" data-act="down">▼</button>`;
    el.onclick = ev => {
      const act = ev.target.dataset && ev.target.dataset.act;
      if (act === 'on') { snapshot(); n.on = !n.on; sceneChanged(); }
      else if (act === 'up' && i > 0) {
        snapshot(); nodes.splice(i - 1, 0, nodes.splice(i, 1)[0]);
        sel = i - 1; sceneChanged();
      } else if (act === 'down' && i < nodes.length - 1) {
        snapshot(); nodes.splice(i + 1, 0, nodes.splice(i, 1)[0]);
        sel = i + 1; sceneChanged();
      } else {
        // picking a shape also moves you into its body, so the next shape you
        // add lands where you are looking
        pickShape(n);
      }
      renderList(); renderInspector(); save(); needDraw();
    };
    box.appendChild(el);
  });
  // A count, not a ration. This used to read "17/32", and the 32 in it was
  // this GPU's uniform block leaking into the document.
  $('nodeCount').textContent = nodes.length + (rayFits ? '' : ' · meshed view');
  $('selHint').textContent = picked.size > 1
    ? picked.size + ' selected · Place moves and turns them as one'
    : picked.size ? '1 selected'
    : 'Nothing selected · tap a shape, or a body above';
  renderBodies();
  renderBaked();
  syncGizbar();
  scheduleInfo();
}

// ---------- one slider row ----------
// ---------- the icons ----------
// One glyph per row, saying what the row moves. The axis ones are drawn in
// the axis colour, which is the same colour that axis has in the viewport
// widget -- so the red arrow on screen and the red icon in the panel do not
// have to explain that they are the same thing.
const GLYPH = {
  posX:  '<path d="M2.5 8h9"/><path d="M9 5.2 11.5 8 9 10.8"/>',
  posY:  '<path d="M3.5 12.5 12 4"/><path d="M12 8V4H8"/>',
  posZ:  '<path d="M8 13.5v-9"/><path d="M5.2 7 8 4.5l2.8 2.5"/>',
  rotX:  '<path d="M13 8a5 5 0 1 1-2.2-4.1"/><path d="M13.2 2.9v3.3H9.9"/>',
  rotY:  '<path d="M13 8a5 5 0 1 1-2.2-4.1"/><path d="M13.2 2.9v3.3H9.9"/>',
  rotZ:  '<path d="M13 8a5 5 0 1 1-2.2-4.1"/><path d="M13.2 2.9v3.3H9.9"/>',
  scale: '<path d="M3 13 13 3"/><path d="M3 9.5V13h3.5"/><path d="M13 6.5V3H9.5"/>',
  blend: '<circle cx="6" cy="8" r="3.4"/><circle cx="10" cy="8" r="3.4"/>',
  radius:'<circle cx="8" cy="8" r="5.2"/><path d="M8 8h5.2"/>',
  round: '<path d="M2.5 13.5V7A4.5 4.5 0 0 1 7 2.5h6.5"/>',
  sides: '<path d="M8 2.2 13 5v6l-5 2.8L3 11V5z"/>',
  angle: '<path d="M2.5 13h11"/><path d="M2.5 13 11 4.5"/>'
         + '<path d="M8.6 13a6.1 6.1 0 0 0-1.8-4.3"/>',
  sizeX: '<path d="M2 8h12"/><path d="M4.4 5.6 2 8l2.4 2.4"/>'
         + '<path d="M11.6 5.6 14 8l-2.4 2.4"/>',
  sizeY: '<path d="M3 13 13 3"/><path d="M3 9.6V13h3.4"/><path d="M13 6.4V3H9.6"/>',
  sizeZ: '<path d="M8 2v12"/><path d="M5.6 4.4 8 2l2.4 2.4"/>'
         + '<path d="M5.6 11.6 8 14l2.4-2.4"/>',
  span:  '<path d="M3 5v6"/><path d="M13 5v6"/><path d="M3 8h10"/>',
  res:   '<path d="M2.5 2.5h11v11h-11z"/><path d="M2.5 6.2h11M2.5 9.8h11"/>'
         + '<path d="M6.2 2.5v11M9.8 2.5v11"/>'
};
// A dim's label is the kernel's, so the mapping lives here rather than a
// per-primitive icon field the kernel would have to carry for one consumer.
const GLYPH_FOR = [
  [/^Position X$/, 'posX', 'ax'], [/^Position Y$/, 'posY', 'ay'],
  [/^Position Z$/, 'posZ', 'az'],
  [/^Rotate X$/, 'rotX', 'ax'], [/^Rotate Y$/, 'rotY', 'ay'],
  [/^Rotate Z$/, 'rotZ', 'az'],
  [/^Scale$/, 'scale'], [/^Blend$/, 'blend'], [/^Corner round$/, 'round'],
  [/radius$/i, 'radius'], [/^Sides$/, 'sides'], [/^Sweep$/, 'angle'],
  [/^(Size X|Base|Half width)$/, 'sizeX'],
  [/^(Size Y|Half depth)$/, 'sizeY'],
  // a capsule's Length and a link's are along its own Z, like every Height
  [/^(Size Z|Height|Cut height|Length|Half height)$/, 'sizeZ'],
  [/^Size$/, 'span']
];
function glyph(name, axis) {
  const body = GLYPH[name] || GLYPH.span;
  const col = axis ? ` style="color:var(--${axis})"` : '';
  return `<svg class="gl" viewBox="0 0 16 16" fill="none" stroke="currentColor"`
       + ` stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"`
       + `${col} aria-hidden="true">${body}</svg>`;
}
function iconFor(label) {
  for (const [re, name, axis] of GLYPH_FOR)
    if (re.test(label)) return glyph(name, axis);
  return glyph('span');
}

// ---------- typing a value instead of sliding to it ----------
// A slider is the right control for finding a size and the wrong one for
// entering a known one: 0.5 mm steps cannot reach 12.7, and on a phone the
// last millimetre is a fight. So the readout is also a button -- tap it, type
// the number, Enter. Escape leaves it alone.
//
// `commit` is the row's own setter, so a typed value goes through exactly the
// path a dragged one does: the same clamp, the same undo snapshot, the same
// redraw. Shared by the inspector rows and the STL resolution row.
function editableValue(out, num, get, commit, after) {
  const open = () => {
    num.value = String(+(+get()).toFixed(4));
    out.hidden = true; num.hidden = false;
    num.focus(); num.select();
  };
  const close = (apply) => {
    if (num.hidden) return;
    if (apply) {
      // a comma is what half the world's keyboards put on that key
      const v = parseFloat(String(num.value).replace(',', '.'));
      if (isFinite(v)) commit(v);
    }
    num.hidden = true; out.hidden = false;
    if (after) after();
  };
  out.onclick = open;
  out.onkeydown = e => {
    if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); open(); }
  };
  num.onkeydown = e => {
    if (e.key === 'Enter') { e.preventDefault(); close(true); }
    else if (e.key === 'Escape') { e.preventDefault(); close(false); }
  };
  num.onblur = () => close(true);
  return { open, close };
}

// ---------- one slider row ----------
function sliderRow(label, unit, get, set, min, max, step) {
  const row = document.createElement('div');
  row.className = 'row';
  row.innerHTML =
    `<label>${iconFor(label)}<span>${label}</span>` +
    `<b class="tap" role="button" tabindex="0" title="Tap to type a value"></b>` +
    `<input class="numin" type="text" inputmode="decimal" hidden></label>` +
    `<div class="slide"><button class="step">−</button>` +
    `<input type="range" min="${min}" max="${max}" step="${step}">` +
    `<button class="step">＋</button></div>`;
  const out = row.querySelector('b');
  const num = row.querySelector('.numin');
  const inp = row.querySelector('input[type=range]');
  const [minus, plus] = row.querySelectorAll('.step');
  const show = () => {
    const v = get();
    out.textContent = fmt(v) + unit;
    if (document.activeElement !== inp) inp.value = v;
  };
  let touched = false;
  const commit = v => {
    if (!touched) { snapshot(); touched = true; }
    set(Math.min(Math.max(v, min), max));
    show(); save(); needDraw(); scheduleInfo();
  };
  inp.addEventListener('input', () => { commit(parseFloat(inp.value)); markInteracting(false); });
  inp.addEventListener('change', () => { touched = false; needDraw(); });
  const bump = s => () => {
    // round to the step grid, then to 4 places so 0.1 steps stay 0.1
    commit(parseFloat((Math.round((get() + s * step) / step) * step).toFixed(4)));
    touched = false;
  };
  minus.onclick = bump(-1); plus.onclick = bump(1);
  // typing a value is one edit, not a drag, so it closes its own undo step
  editableValue(out, num, get, v => { commit(v); touched = false; }, show);
  row.refresh = show;
  show();
  return row;
}

// ---------- body controls ----------
function chipRow(label, hint) {
  const row = document.createElement('div');
  row.className = 'row';
  row.innerHTML = `<label><span>${label}</span></label>`;
  const box = document.createElement('div');
  box.className = 'toggles';
  row.appendChild(box);
  if (hint) {
    const p = document.createElement('p');
    p.style.cssText = 'color:var(--dim);font-size:11.5px;margin:6px 0 0';
    p.textContent = hint;
    row.appendChild(p);
  }
  row.box = box;
  return row;
}
function chip(text, on, fn) {
  const b = document.createElement('button');
  b.className = 'btn sm' + (on ? ' on' : '');
  b.textContent = text;
  b.onclick = () => {
    snapshot(); fn();
    syncBodies();
    sceneChanged(); renderList(); renderInspector(); save(); needDraw();
  };
  return b;
}

// Which body this shape builds. Everything an `add` does — its blend above
// all — stays inside the body it belongs to.
function bodyRow(n) {
  const row = chipRow('Body');
  bodies.forEach(b => row.box.appendChild(
    chip(b.name, n.b === b.id, () => { n.b = b.id; activeBody = b.id; })));
  row.box.appendChild(chip('＋ New body', false,
    () => { n.b = addBody(); activeBody = n.b; }));
  return row;
}

// Which bodies this cut/keep reaches. "All bodies" also covers bodies made
// later, which is what the build-plate cut wants.
function targetRow(n) {
  const none = n.tg && !n.tg.length;
  const row = chipRow('Applies to', none
    ? 'No bodies left to cut — this shape does nothing. Pick one, or All.'
    : bodies.length < 2
      ? 'Add a second body to a shape above to aim this cut at one of them.'
      : '');
  row.box.appendChild(chip('All bodies', !n.tg, () => n.tg = null));
  bodies.forEach(b => {
    const on = !!n.tg && n.tg.indexOf(b.id) >= 0;
    row.box.appendChild(chip(b.name, on, () => {
      if (!n.tg) { n.tg = [b.id]; return; }      // All -> just this one
      const at = n.tg.indexOf(b.id);
      if (at < 0) n.tg.push(b.id);
      else if (n.tg.length > 1) n.tg.splice(at, 1);
      else n.tg = null;                          // last one off -> back to All
    }));
  });
  return row;
}

let inspectorRows = [];
function refreshInspectorValues() {
  inspectorRows.forEach(r => r.refresh && r.refresh());
  needDraw();
}

function renderInspector() {
  const host = $('inspector');
  host.innerHTML = '';
  inspectorRows = [];
  const n = primaryNode();
  if (!n) {
    const p = document.createElement('p');
    p.style.cssText = 'color:var(--dim);font-size:12px;margin:16px 0';
    p.textContent = 'Nothing selected. Tap a shape to edit it.';
    host.appendChild(p);
    scheduleInfo();
    return;
  }
  const P = PRIMS[n.t];
  const add = el => { host.appendChild(el); if (el.refresh) inspectorRows.push(el); };

  const h = document.createElement('h3');
  // with several picked, Move drags them all but the sliders edit this one
  h.textContent = picked.size > 1
    ? `Editing 1 of ${picked.size} selected` : 'Selected shape';
  host.appendChild(h);

  // type
  const typeRow = document.createElement('div');
  typeRow.className = 'row';
  typeRow.innerHTML = '<label><span>Type</span></label>';
  const selEl = document.createElement('select');
  // What can be turned into, plus whatever this shape already is — a document
  // may carry a primitive this editor would not offer to make, and the type
  // row has to be able to name it.
  const types = offered();
  if (!types.includes(n.t)) types.push(n.t);
  types.forEach(k => {
    const o = document.createElement('option');
    o.value = k; o.textContent = PRIMS[k].name; o.selected = k === n.t;
    selEl.appendChild(o);
  });
  selEl.onchange = () => {
    snapshot();
    n.t = selEl.value;
    n.d = PRIMS[n.t].def.slice();
    sceneChanged(); renderList(); renderInspector(); save(); needDraw();
  };
  typeRow.appendChild(selEl);
  host.appendChild(typeRow);

  // op
  const opRow = document.createElement('div');
  opRow.className = 'row';
  opRow.innerHTML = '<label><span>Operation</span></label>';
  const seg = document.createElement('div');
  seg.className = 'seg';
  OPS.forEach(([k, lbl]) => {
    const b = document.createElement('button');
    b.textContent = lbl; b.className = n.op === k ? 'on' : '';
    b.style.flex = '1';
    b.onclick = () => {
      snapshot(); n.op = k;
      syncBodies();   // an add turned into a cut can strand its old body
      sceneChanged(); renderList(); renderInspector(); save(); needDraw();
    };
    seg.appendChild(b);
  });
  opRow.appendChild(seg);
  host.appendChild(opRow);

  host.appendChild(n.op === 'add' ? bodyRow(n) : targetRow(n));

  add(sliderRow('Blend', ' mm', () => n.k, v => n.k = v, 0, 25, 0.25));

  P.dims.forEach(([lbl, mn, mx, st], i) =>
    add(sliderRow(lbl, dimUnit(n.t, i), () => n.d[i], v => n.d[i] = v, mn, mx, st)));
  if (P.round)
    add(sliderRow('Corner round', ' mm', () => n.round, v => n.round = v, 0, 20, 0.25));

  // With several shapes picked, Place drives the whole selection as one rigid
  // piece: the slider still reads this shape's value, but what it applies is
  // the *change* — translated straight through, or turned about the group's
  // centre. The size and blend rows stay on this shape alone, since there is
  // no sensible way to resize a mixed bag of primitives together.
  const group = picked.size > 1;
  const ph = document.createElement('h3');
  ph.textContent = group ? `Place — ${picked.size} as one` : 'Place';
  host.appendChild(ph);
  ['X', 'Y', 'Z'].forEach((ax, i) =>
    add(sliderRow('Position ' + ax, ' mm', () => n.p[i],
      group ? v => {
        const d = [0, 0, 0];
        d[i] = v - n.p[i];
        translateSelection(d[0], d[1], d[2]);
        refreshInspectorValues();
      } : v => n.p[i] = v,
      -150, 150, 0.5)));
  ['X', 'Y', 'Z'].forEach((ax, i) =>
    add(sliderRow('Rotate ' + ax, '°', () => n.r[i],
      group ? v => { rotateSelection(i, v - n.r[i]); refreshInspectorValues(); }
            : v => n.r[i] = v,
      -180, 180, 1)));
  // Scale has no absolute to read back -- there is no "size" of a mixed bag
  // of shapes -- so the row carries a running factor and applies the ratio
  // between readings. It resets to 1 whenever the selection changes.
  add(sliderRow('Scale', '\u00d7', scaleFactor,
    v => {
      scaleSelection(v / scaleFactor());
      scaleShown = v;
      refreshInspectorValues();
    }, 0.2, 4, 0.01));

  const mr = document.createElement('div');
  mr.className = 'row';
  mr.innerHTML = '<label><span>Mirror</span></label>';
  const tg = document.createElement('div');
  tg.className = 'toggles';
  [['mx', 'X'], ['my', 'Y'], ['mz', 'Z']].forEach(([key, lbl]) => {
    const b = document.createElement('button');
    b.className = 'btn sm' + (n[key] ? ' on' : '');
    b.textContent = 'Mirror ' + lbl;
    b.onclick = () => {
      snapshot(); n[key] = !n[key];
      sceneChanged(); renderInspector(); save(); needDraw();
    };
    tg.appendChild(b);
  });
  mr.appendChild(tg);
  host.appendChild(mr);
  scheduleInfo();
}

// The add-shape AABB is what the mesher sweeps, but it ignores every cut, so
// it is a poor size readout. Probe the real field on a coarse grid instead.
function probeSize(B) {
  const live = buildPlan(nodes);
  // The cost is grid points times shapes, and the shapes are no longer
  // capped — so the grid is. A four-shape model probes exactly as finely as
  // it always did; a two-hundred-shape one probes coarsely rather than
  // freezing the panel for a readout that was never the accurate number
  // anyway. (The STL is. This is a coarse grid and a bisection.)
  const lim = Math.max(8, Math.min(56,
    Math.round(Math.cbrt(1.5e6 / Math.max(planCount(live), 1)))));
  const span = Math.max(B.hi[0] - B.lo[0], B.hi[1] - B.lo[1],
                        B.hi[2] - B.lo[2], 1);
  const cell = span / 32;
  const N = a => Math.max(2, Math.min(lim,
                 Math.ceil((B.hi[a] - B.lo[a]) / cell) + 1));
  const n = [N(0), N(1), N(2)];
  const d = [0, 1, 2].map(a => (B.hi[a] - B.lo[a]) / (n[a] - 1));
  const lo = [1e9, 1e9, 1e9], hi = [-1e9, -1e9, -1e9];
  // For each of the six extremes keep the *deepest* sample in that outermost
  // slab, not the first one found: bisecting from a thin corner of the slab
  // lands short of the real surface, bisecting from the thick middle doesn't.
  const at = [null, null, null, null, null, null];
  const deep = [0, 0, 0, 0, 0, 0];
  let any = false;
  for (let i = 0; i < n[0]; i++) {
    const x = B.lo[0] + i * d[0];
    for (let j = 0; j < n[1]; j++) {
      const y = B.lo[1] + j * d[1];
      for (let k = 0; k < n[2]; k++) {
        const z = B.lo[2] + k * d[2];
        const v = sceneSDF(live, x, y, z);
        if (v >= 0) continue;
        any = true;
        const P = [x, y, z];
        for (let a = 0; a < 3; a++) {
          if (P[a] < lo[a] || (P[a] === lo[a] && v < deep[2 * a])) {
            lo[a] = P[a]; at[2 * a] = P; deep[2 * a] = v;
          }
          if (P[a] > hi[a] || (P[a] === hi[a] && v < deep[2 * a + 1])) {
            hi[a] = P[a]; at[2 * a + 1] = P; deep[2 * a + 1] = v;
          }
        }
      }
    }
  }
  if (!any) return null;
  // the grid only brackets each extreme to half a cell — walk the last
  // inside point outward by bisection to land on the surface itself
  const walk = (P, a, limit) => {
    let ins = P[a], out = limit;
    const q = P.slice();
    for (let it = 0; it < 20; it++) {
      const m = 0.5 * (ins + out);
      q[a] = m;
      if (sceneSDF(live, q[0], q[1], q[2]) < 0) ins = m; else out = m;
    }
    return ins;
  };
  for (let a = 0; a < 3; a++) {
    lo[a] = walk(at[2 * a], a, B.lo[a]);
    hi[a] = walk(at[2 * a + 1], a, B.hi[a]);
  }
  return { lo, hi, cell: d };
}

let infoTimer = 0;
function scheduleInfo() {
  clearTimeout(infoTimer);
  infoTimer = setTimeout(updateInfo, 160);
}
function updateInfo() {
  clearTimeout(infoTimer);
  const B = sceneBounds(shownNodes());
  if (!B) { infoEl.textContent = 'Nothing to print yet — add a shape.'; return; }
  const res = parseFloat($('resInp').value);
  const vox = Math.ceil((B.hi[0] - B.lo[0]) / res + 5) *
              Math.ceil((B.hi[1] - B.lo[1]) / res + 5) *
              Math.ceil((B.hi[2] - B.lo[2]) / res + 5);
  const P = probeSize(B);
  if (!P) {
    infoEl.innerHTML = '<span style="color:var(--note)">Everything is cut ' +
      'away — nothing solid left.</span>';
    return;
  }
  const sz = [0, 1, 2].map(a => P.hi[a] - P.lo[a]);
  const under = P.lo[2] < -P.cell[2];
  infoEl.innerHTML =
    `Size ≈ ${sz.map(v => v.toFixed(1)).join(' × ')} mm` +
    (under ? ' · <span style="color:var(--note)">reaches below the plate — ' +
      'a Plane cut at z 0 gives it a flat base</span>' : '') +
    `<br>STL grid ≈ ${(vox / 1e6).toFixed(1)} M voxels` +
    (vox > 12e6 ? ' <span style="color:var(--note)">(coarsen it on a phone)</span>'
                : '') +
    // Which picture is on the screen, and why. A viewport that quietly
    // changed how it draws would read as the renderer having got worse.
    (rayFits ? '' :
      `<br>${slotAt.size} shapes at once is past what the raymarcher holds ` +
      `(${RAY_N}) — the viewport is meshing instead` +
      (meshTris ? `: ${Math.round(meshTris / 1000)}k triangles at `
                  + `${meshRes.toFixed(2)} mm, ${meshMs} ms on the ${meshOn}` : ''));
}

// ---------- add / duplicate / delete ----------
// Which primitives this editor offers. Everything the kernel can draw from a
// handful of numbers is here, `field` once the document has one to place —
// and the rest of the baked family (profile, wire, sweep, construct) is not,
// because each of those is a *drawing* held in a library on the document, and
// MetaMeld has no surface to draw one on. They stay in the kernel and stay
// working: a document written elsewhere that names one still opens, renders
// and exports here.
const offered = () => PRIM_KEYS.filter(k =>
  !PRIMS[k].baked || (k === 'field' && SF.fields.length));

$('addBtn').onclick = () => {
  openModal('Add a shape',
    `<div class="picker">${offered().map(k =>
      `<button data-prim="${k}">${PRIMS[k].name}</button>`).join('')}</div>`,
    card => {
      card.onclick = e => {
        const b = e.target.closest('button[data-prim]');
        if (!b) return;
        snapshot();
        const fresh = makeNode(b.dataset.prim);
        // a field node carries no dimensions of its own: its box comes from
        // the document's baked grid, and its sample range the kernel reads
        // off the library entry itself
        if (isField(fresh) && SF.fields.length) {
          fresh.fi = Math.min(activeField, SF.fields.length - 1);
          fresh.d = SF.fields[fresh.fi].box.slice();
        }
        fresh.b = activeBody;      // build into the body you are standing in
        nodes.push(fresh);
        sel = nodes.length - 1;
        if (selMode === 'single') picked = new Set();
        picked.add(fresh);
        closeModal();
        sceneChanged(); renderList(); renderInspector(); save(); needDraw();
      };
    });
};
const clone = n => JSON.parse(JSON.stringify(n));
const nudge = c => { c.p[0] = Math.min(c.p[0] + 10, 150); return c; };

$('dupBtn').onclick = () => {
  if (!picked.size) return;
  const src = nodes.filter(n => picked.has(n));    // in list order

  // one shape: copy it beside itself, in the body it already belongs to
  if (src.length === 1) {
    snapshot();
    const c = nudge(clone(src[0]));
    nodes.splice(sel + 1, 0, c);
    sel++;
    resetPicked();
    sceneChanged(); renderList(); renderInspector(); save(); needDraw();
    return;
  }

  // several: this is a body being copied, so the copies become a body of
  // their own — dropping them into the source body would just bury them
  // inside the shape they were copied from.
  const from = [...new Set(src.filter(n => n.op === 'add').map(n => n.b))];
  if (!from.length) { showErr('Nothing to duplicate — no shapes, only cuts'); return; }

  // A cut that named only bodies being copied comes along, repointed at the
  // copies. One that was already global reaches the new bodies anyway, so
  // copying it would just double up; one that also names a body staying put
  // would have the copy cutting the original, so neither is brought over.
  const carried = src.filter(n =>
    n.op === 'add' || (n.tg && n.tg.length && n.tg.every(t => from.includes(t))));

  snapshot();
  const toNew = new Map();
  for (const oldId of from) {
    const id = addBody();
    const nb = bodies.find(x => x.id === id);
    if (nb) nb.name = (bodyName(oldId) + ' copy').slice(0, 24);
    toNew.set(oldId, id);
  }
  const made = carried.map(n => {
    const c = nudge(clone(n));
    if (c.op === 'add') c.b = toNew.get(n.b);
    else c.tg = n.tg.map(t => toNew.get(t));
    return c;
  });
  // Slot the copies in right after the source body's last add, not at the end
  // of the list: a cut only reaches what is above it, so appending would drop
  // the copies below the build-plate cut and leave them without a flat bottom.
  let at = 0;
  for (const n of src)
    if (n.op === 'add') at = Math.max(at, nodes.indexOf(n) + 1);
  nodes.splice(at, 0, ...made);
  activeBody = toNew.get(from[0]);
  picked = new Set(made);
  sel = nodes.indexOf(made[0]);
  syncBodies();
  sceneChanged(); renderList(); renderInspector(); save(); needDraw();
};
$('delBtn').onclick = () => {
  if (!picked.size) return;
  snapshot();
  const doomed = picked;
  const first = nodes.findIndex(n => doomed.has(n));
  nodes = nodes.filter(n => !doomed.has(n));
  sel = Math.max(0, Math.min(first, nodes.length - 1));
  resetPicked();
  syncBodies();   // keep targets and the active body pointing at what is left
  sceneChanged(); renderList(); renderInspector(); save(); needDraw();
};

// ---------- modal ----------
const modal = $('modal'), modalCard = $('modalCard');
function openModal(title, html, after) {
  modalCard.innerHTML = `<h4>${title}</h4>${html}` +
    '<div class="bar" style="margin-top:12px"><button class="btn" id="mClose">Close</button></div>';
  modal.style.display = 'flex';
  $('mClose').onclick = closeModal;
  if (after) after(modalCard);
}
function closeModal() { modal.style.display = 'none'; modalCard.innerHTML = ''; }
modal.onclick = e => { if (e.target === modal) closeModal(); };

// ---------- starters ----------
$('startBtn').onclick = () => {
  openModal('Start from',
    `<div class="picker">${Object.keys(STARTERS).map(k =>
      `<button data-st="${k}">${k}</button>`).join('')}</div>` +
    '<p>This replaces the current model. Undo brings it back.</p>',
    card => {
      card.onclick = e => {
        const b = e.target.closest('button[data-st]');
        if (!b) return;
        snapshot();
        nodes = JSON.parse(JSON.stringify(STARTERS[b.dataset.st]));
        bodies = [{ id: 0, name: 'Body 1', on: true }];
        activeBody = 0;
        syncBodies();
        sel = 0;
        picked = new Set();
        closeModal();
        sceneChanged(); renderList(); renderInspector(); save();
        frameModel();
      };
    });
};

// ---------- files ----------
// The paste box is fine for a handful of primitives and hopeless once a baked
// field is in the document -- half a megabyte of base64 is not something to
// select by hand. These are the same document, through a file instead.
function currentDoc() {
  return { version: 2, bodies, nodes,
           fields: SF.fields.length ? SF.fields.map(encodeField) : undefined };
}
$('saveBtn').onclick = () => {
  const name = (prompt('Save as', 'metameld_model.json') || '').trim();
  if (!name) return;
  deliver(new Blob([JSON.stringify(currentDoc())], { type: 'application/json' }),
          name.endsWith('.json') ? name : name + '.json');
  setStatus('saved ' + name);
};
// Import merges instead of replacing, which is how two documents that were
// authored apart -- a body from one file, a cutter from another -- end up in
// the same scene. Bodies and baked fields are renumbered on the way in so
// nothing collides with what is already here.
function importDoc(d) {
  const list = (d && (d.nodes || d)) || [];
  if (!Array.isArray(list) || !list.some(n => n && PRIMS[n.t]))
    throw new Error('no shapes in that file');
  const incoming = list.filter(n => n && PRIMS[n.t]).map(n => makeNode(n.t, n));
  const rawF = d.fields || (d.field ? [d.field] : []);
  const newF = rawF.map(decodeField).filter(Boolean);
  if (SF.fields.length + newF.length > MAXFIELDS)
    throw new Error(`that would make ${SF.fields.length + newF.length} baked `
                    + `shapes; the limit is ${MAXFIELDS}`);
  const fBase = SF.fields.length;
  SF.fields = SF.fields.concat(newF);

  const idBase = bodies.reduce((m, b) => Math.max(m, b.id), -1) + 1;
  const srcBodies = (d.bodies || []).filter(b => b && typeof b.id === 'number');
  const remap = new Map();
  for (const b of srcBodies) {
    remap.set(b.id, idBase + remap.size);
    bodies.push({ id: remap.get(b.id),
                  name: String(b.name || 'Body'), on: b.on !== false });
  }
  const mapId = id => remap.has(id) ? remap.get(id)
    : (remap.set(id, idBase + remap.size),
       bodies.push({ id: remap.get(id), name: 'Body', on: true }),
       remap.get(id));
  for (const n of incoming) {
    if (typeof n.b !== 'number') n.b = 0;
    n.b = mapId(n.b);
    if (n.op === 'add') n.tg = null;
    else if (Array.isArray(n.tg)) n.tg = n.tg.map(mapId);
    if (isField(n)) n.fi = fBase + Math.min(Math.max(n.fi || 0, 0),
                                            Math.max(newF.length - 1, 0));
  }
  nodes = nodes.concat(incoming);
  syncBodies();
  picked = new Set(incoming);          // what you just brought in, selected
  sel = nodes.indexOf(incoming[0]);
  if (incoming[0]) activeBody = incoming[0].b;
}

$('openBtn').onclick = () => $('fileInp').click();
$('importBtn').onclick = () => { pendingImport = true; $('fileInp').click(); };
let pendingImport = false;
$('fileInp').onchange = e => {
  const file = e.target.files && e.target.files[0];
  if (!file) return;
  // capture it now: the read is asynchronous, and clearing the flag when the
  // handler returns would leave onload seeing false and replacing the document
  const merge = pendingImport;
  pendingImport = false;
  const r = new FileReader();
  r.onload = () => {
    try {
      const d = JSON.parse(r.result);
      const list = (d && (d.nodes || d)) || [];
      if (!Array.isArray(list) || !list.some(n => n && PRIMS[n.t])) {
        // a fish shape file is curves, which this editor has no evaluator for.
        // It is a reasonable thing to try, so say what to do instead.
        const fish = d && (d.kind === 'flexifish-nurbs'
                           || (d.shape && d.shape.curves) || d.curves);
        throw new Error(fish
          ? 'that is a fish shape file — use Field JSON in the fish editor '
            + 'to bake it, then open that'
          : 'no shapes in that file');
      }
      snapshot();
      if (merge) { importDoc(d); setStatus('imported ' + file.name); }
      else { adopt(d); sel = 0; setStatus('opened ' + file.name); }
      sceneChanged(); renderList(); renderInspector(); save(); frameModel();
    } catch (err) { showErr('open: ' + err.message); }
  };
  r.onerror = () => showErr('open: could not read that file');
  r.readAsText(file);
  e.target.value = '';        // so the same file can be opened twice
};

// ---------- JSON in / out ----------
$('jsonBtn').onclick = () => {
  openModal('Model JSON',
    '<textarea id="jsonTa" spellcheck="false"></textarea>' +
    '<div class="bar" style="margin-top:8px">' +
    '<button class="btn" id="jsCopy">Copy</button>' +
    '<button class="btn" id="jsLoad">Load from box</button></div>' +
    '<p>Paste a model here and press Load. Copy keeps a backup anywhere ' +
    'you can paste text.</p>',
    () => {
      const ta = $('jsonTa');
      ta.value = JSON.stringify(
        { version: 2, bodies, nodes,
          fields: SF.fields.length ? SF.fields.map(encodeField) : undefined },
        null, 1);
      $('jsCopy').onclick = () => {
        ta.select();
        if (navigator.clipboard) navigator.clipboard.writeText(ta.value).catch(() => {});
        else { try { document.execCommand('copy'); } catch (e) {} }
        setStatus('JSON copied');
      };
      $('jsLoad').onclick = () => {
        try {
          const d = JSON.parse(ta.value);
          const list = (d && (d.nodes || d)) || [];
          // check before snapshotting, so a bad paste leaves no undo step
          if (!Array.isArray(list) || !list.some(n => n && PRIMS[n.t]))
            throw new Error('no shapes found');
          snapshot();
          adopt(d);
          sel = 0;
          closeModal();
          sceneChanged(); renderList(); renderInspector(); save(); frameModel();
        } catch (e) { showErr('JSON: ' + e.message); }
      };
    });
};

// ---------- STL ----------
$('resInp').oninput = () => {
  $('resVal').textContent = parseFloat($('resInp').value).toFixed(2) + ' mm';
  scheduleInfo();
};
// the same icon and the same tap-to-type as every row in the inspector
$('resRow').querySelector('label').insertAdjacentHTML('afterbegin', glyph('res'));
editableValue($('resVal'), $('resNum'),
  () => parseFloat($('resInp').value),
  v => {
    $('resInp').value = Math.min(Math.max(v, 0.2), 2).toFixed(2);
    $('resInp').oninput();
  });
document.body.addEventListener('click', e => {
  const s = e.target.dataset && e.target.dataset.step;
  if (s !== 'res:-1' && s !== 'res:1') return;
  const inp = $('resInp');
  inp.value = (parseFloat(inp.value) + (s === 'res:1' ? 0.05 : -0.05)).toFixed(2);
  inp.oninput();
});

let building = false, cached = null;      // { key, blob } from the last build
const stlKey = res =>
  JSON.stringify({ n: nodes.filter(n => n.on), b: bodies }) + '@' + res;

$('stlBtn').onclick = () => {
  if (building) return;
  const B = sceneBounds(shownNodes());
  if (!B) { showErr('Nothing to export — add a shape first'); return; }
  const res = parseFloat($('resInp').value);
  // Building runs across several frames, so by the time it ends iOS has
  // forgotten the tap and refuses the share sheet. Keep the blob: this second
  // tap is a fresh gesture, and handing it over now always works.
  if (cached && cached.key === stlKey(res)) {
    deliver(cached.blob, 'metameld_model.stl');
    setStatus('sent metameld_model.stl');
    return;
  }
  const pad = 2 * res;
  const x0 = B.lo[0] - pad, y0 = B.lo[1] - pad, z0 = B.lo[2] - pad;
  const nx = Math.ceil((B.hi[0] - B.lo[0] + 2 * pad) / res) + 1;
  const ny = Math.ceil((B.hi[1] - B.lo[1] + 2 * pad) / res) + 1;
  const nz = Math.ceil((B.hi[2] - B.lo[2] + 2 * pad) / res) + 1;
  const total = nx * ny * nz;
  // the grid is 4 bytes a voxel; iOS kills a tab that asks for too much, so
  // stop well short of that on a phone rather than losing the model with it
  const cap = matchMedia('(pointer: coarse)').matches ? 14e6 : 40e6;
  if (total > cap) {
    showErr('Grid too big (' + (total / 1e6).toFixed(0) + ' M voxels, limit ' +
            (cap / 1e6) + ' M) — raise the resolution number');
    return;
  }
  const live = buildPlan(nodes);
  const t0 = Date.now();
  building = true;
  $('stlBtn').disabled = true;

  // What to do with a finished mesh, whichever way the grid was filled.
  const finish = (mesh) => {
    const nt = mesh ? mesh.indices.length / 3 : 0;
    building = false; $('stlBtn').disabled = false;
    if (!nt) { showErr('The model is empty at this resolution'); setStatus(''); return; }
    const blob = meshToSTL(mesh, 'MetaMeld(TM) model (mm) - metameld');
    cached = { key: stlKey(res), blob };
    setStatus(nt.toLocaleString() + ' triangles · ' +
              ((Date.now() - t0) / 1000).toFixed(1) + ' s');
    deliver(blob, 'metameld_model.stl', () =>
      setStatus(nt.toLocaleString() + ' triangles ready — tap Save STL again'));
  };

  // Filling the grid is one evaluation per corner and essentially all of the
  // cost of an export, so it goes to the GPU when there is a GPU to send it
  // to: the same map(), compiled from the same GLSL, rendered into a float
  // target a slab at a time. What comes back is the grid the loop below would
  // have written, and the kernel's own mesher walks it either way.
  const gpu = sampler() && planCount(live) <= GPU_N ? sampler() : null;
  if (gpu) {
    setStatus('building STL…');
    // one frame first, so the disabled button and the status are painted
    // before the page goes away to do it
    requestAnimationFrame(() => {
      let m = null;
      try { m = SF.mesh(live, { res, bounds: B, sample: gpu, maxSamples: cap }); }
      catch (e) {
        building = false; $('stlBtn').disabled = false;
        showErr('mesh: ' + e.message);
        return;
      }
      finish(m);
    });
    return;
  }

  let vol;
  try { vol = new Float32Array(total); }
  catch (e) {
    building = false; $('stlBtn').disabled = false;
    showErr('Out of memory for the grid — raise the resolution');
    return;
  }
  let i = 0;
  // slice at a time, back to the event loop between slices: a phone stays
  // responsive and Safari never shows the "page is unresponsive" sheet
  const step = () => {
    const until = performance.now() + 24;
    while (i < nx && performance.now() < until) {
      const x = x0 + i * res;
      let idx = i * ny * nz;
      for (let j = 0; j < ny; j++) {
        const y = y0 + j * res;
        for (let k = 0; k < nz; k++)
          vol[idx++] = sceneSDF(live, x, y, z0 + k * res);
      }
      i++;
    }
    setStatus('building STL… ' + Math.round(100 * i / nx) + '%');
    if (i < nx) { requestAnimationFrame(step); return; }
    let mesh;
    try { mesh = surfaceNets(vol, nx, ny, nz, x0, y0, z0, res); }
    catch (e) { showErr('mesh: ' + e.message); building = false;
                $('stlBtn').disabled = false; return; }
    finish(mesh);
  };
  requestAnimationFrame(step);
};

function deliver(blob, name, onRefused) {
  const file = new File([blob], name, { type: 'model/stl' });
  // iOS: the share sheet drops the file straight into Files, AirDrop or a
  // slicer app; a plain download link there is a dead end more often than not
  if (navigator.canShare && navigator.canShare({ files: [file] })) {
    navigator.share({ files: [file], title: name }).catch(err => {
      if (err && err.name === 'AbortError') return;      // user hit cancel
      if (onRefused) onRefused(); else downloadBlob(blob, name);
    });
    return;
  }
  downloadBlob(blob, name);
}
function downloadBlob(blob, name) {
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = name;
  document.body.appendChild(a); a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 2000);
}

// ---------- bottom sheet drag ----------
const panel = $('panel'), grip = $('grip');
const SNAPS = [0.16, 0.52, 0.88];
let sheet = 1, dragFrom = null, dragH = 0;
function setSheet(fr) {
  document.documentElement.style.setProperty('--sheet', (fr * 100).toFixed(1) + 'vh');
  needDraw();
}
grip.addEventListener('pointerdown', e => {
  grip.setPointerCapture(e.pointerId);
  dragFrom = e.clientY;
  dragH = panel.getBoundingClientRect().height;
  panel.classList.add('drag');
});
grip.addEventListener('pointermove', e => {
  if (dragFrom === null) return;
  const h = Math.min(Math.max(dragH - (e.clientY - dragFrom), 60), innerHeight * 0.92);
  setSheet(h / innerHeight);
});
function gripEnd() {
  if (dragFrom === null) return;
  dragFrom = null;
  panel.classList.remove('drag');
  const fr = panel.getBoundingClientRect().height / innerHeight;
  sheet = SNAPS.reduce((b, s, i) =>
    Math.abs(s - fr) < Math.abs(SNAPS[b] - fr) ? i : b, 0);
  setSheet(SNAPS[sheet]);
}
grip.addEventListener('pointerup', gripEnd);
grip.addEventListener('pointercancel', gripEnd);
grip.addEventListener('click', () => {
  if (dragFrom !== null) return;
  sheet = (sheet + 1) % SNAPS.length;
  setSheet(SNAPS[sheet]);
});

// ---------- go ----------
sceneChanged();
renderList();
renderInspector();
$('resVal').textContent = parseFloat($('resInp').value).toFixed(2) + ' mm';
setHint();
frameModel();
setStatus(nodes.length + ' shapes');
needDraw();

} catch (err) {
  showErr('Startup: ' + err.message);
  throw err;
}
</script>
</body>
</html>
