<!-- viewport-fit=cover + safe-area padding below: without it iOS puts the
     bottom sheet under the home indicator -->
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<!-- names the Home Screen shortcut; without it iOS uses the whole title -->
<meta name="apple-mobile-web-app-title" content="MetaMeld">
<meta name="theme-color" content="#101418">
<title>MetaMeld</title>
<style>
  :root { --bg:#101418; --panel:#1a2027f2; --ink:#dfe7ee; --dim:#8fa0af;
          --acc:#f0913b; --err:#ff6b6b; --note:#ffc857; --sel:#5ec8f0;
          /* the three axes, shared by the viewport widget and the panel */
          --ax:#ff5a6e; --ay:#5fd38d; --az:#7d92ff;
          --line:#3a4652; --btn:#2a333d;
          --sheet:52vh; }
  * { box-sizing:border-box; margin:0; -webkit-tap-highlight-color:transparent; }
  html,body { height:100%; background:var(--bg); color:var(--ink); overflow:hidden;
              font:14px/1.4 -apple-system,'Segoe UI',Roboto,sans-serif;
              -webkit-user-select:none; user-select:none;
              overscroll-behavior:none; }
  /* canvas is a replaced element: left+right don't stretch it, so size it
     explicitly or it stays at its intrinsic 300x150 */
  #view { position:fixed; top:0; left:0; width:100vw; height:100vh;
          height:100dvh; touch-action:none; display:block; }
  #topbar { position:fixed; top:0; left:0; right:0; z-index:6;
            padding:calc(env(safe-area-inset-top) + 8px) 12px 8px;
            display:flex; gap:8px; align-items:center; flex-wrap:wrap;
            background:linear-gradient(#101418dd,#10141800); pointer-events:none; }
  #topbar > * { pointer-events:auto; }
  #status { color:var(--dim); font-size:12px; margin-left:auto; text-align:right;
            max-width:52vw; }
  .btn { background:var(--btn); color:var(--ink); border:1px solid var(--line);
         border-radius:9px; padding:8px 12px; font-size:13px; cursor:pointer;
         min-height:38px; font-family:inherit; }
  .btn:active { background:#38434f; }
  .btn.on { background:var(--acc); border-color:var(--acc); color:#181818;
            font-weight:600; }
  .btn:disabled { opacity:.4; }
  .btn.sm { padding:5px 9px; min-height:32px; font-size:12px; }
  .seg { display:flex; border:1px solid var(--line); border-radius:9px;
         overflow:hidden; background:#1a2027cc; }
  .seg button { background:none; border:0; color:var(--dim); padding:8px 12px;
                font-size:13px; cursor:pointer; font-family:inherit;
                min-height:38px; }
  .seg button.on { background:var(--acc); color:#181818; font-weight:600; }
  /* text, not a button: the tool's own controls should win the top bar */
  #back { color:var(--dim); text-decoration:none; font-size:12.5px;
          padding:8px 2px; white-space:nowrap; }
  #back:hover, #back:focus-visible { color:var(--acc); }
  /* full-screen off the Home Screen there is no tab to read the name from */
  #brand { color:var(--ink); font-size:13px; font-weight:600;
           letter-spacing:.02em; white-space:nowrap; padding:8px 0; }
  .tm { font-size:.62em; vertical-align:.5em; opacity:.75; margin-left:.5px; }
  /* a phone needs the width for the controls, and its shortcut is labelled */
  @media (max-width:560px) { #brand { display:none; } }
  #errbar { position:fixed; top:calc(env(safe-area-inset-top) + 52px);
            left:50%; transform:translateX(-50%); background:#4a1520;
            color:#ffb3b3; border:1px solid #7a2535; border-radius:8px;
            padding:6px 12px; font-size:12px; display:none; max-width:92vw;
            z-index:30; }
  #hint { position:fixed; left:12px; z-index:4; bottom:calc(var(--sheet) + 8px);
          color:var(--dim); font-size:11.5px; pointer-events:none;
          max-width:min(60vw,420px); text-shadow:0 1px 3px #000; }

  /* ---- bottom sheet (phone) / right rail (desktop) ---- */
  #panel { position:fixed; left:0; right:0; bottom:0; height:var(--sheet);
           background:var(--panel); backdrop-filter:blur(8px);
           border-top:1px solid var(--line); z-index:5;
           display:flex; flex-direction:column;
           transition:height .18s ease; }
  #panel.drag { transition:none; }
  #grip { height:26px; flex:0 0 auto; display:flex; align-items:center;
          justify-content:center; touch-action:none; cursor:grab; }
  #grip div { width:44px; height:5px; border-radius:3px; background:#4a5764; }
  #sheetBody { flex:1 1 auto; overflow-y:auto; -webkit-overflow-scrolling:touch;
               padding:0 12px calc(env(safe-area-inset-bottom) + 16px); }
  h3 { font-size:10.5px; letter-spacing:.12em; text-transform:uppercase;
       color:var(--acc); margin:14px 0 6px; }
  #nodes { display:flex; flex-direction:column; gap:5px; }
  .node { display:flex; align-items:center; gap:8px; padding:7px 9px;
          border:1px solid var(--line); border-radius:9px; background:#20272f;
          font-size:13px; }
  .node.sel { border-color:var(--sel); background:#22313a; }
  .node.off { opacity:.45; }
  .node .nm { flex:1 1 auto; overflow:hidden; text-overflow:ellipsis;
              white-space:nowrap; }
  .node .op { font-size:10px; letter-spacing:.06em; text-transform:uppercase;
              padding:2px 6px; border-radius:5px; background:#33404b;
              color:var(--dim); }
  .node.away { opacity:.55; }
  /* selected reads blue, the same blue the model is tinted with */
  .node.pick { border-color:var(--sel); background:#1a2c36; }
  .node.pick .nm { color:#cfe9f6; }
  /* the primary — what the sliders edit — carries a bar down its edge */
  .node.pick.sel { box-shadow:inset 3px 0 0 var(--sel); }
  .node.body .nm { font-weight:600; }
  .node.body.sel { border-color:var(--acc); background:#2b2519; }
  #bodies { display:flex; flex-direction:column; gap:5px; }
  #bnm { width:100%; background:#10141a; color:var(--ink); font:inherit;
         border:1px solid var(--line); border-radius:8px; padding:9px 10px; }
  .node .bd { font-size:10px; letter-spacing:.04em; padding:2px 6px;
              border-radius:5px; border:1px solid var(--line); color:var(--dim);
              max-width:96px; overflow:hidden; text-overflow:ellipsis;
              white-space:nowrap; }
  .node .op.cut { background:#4a2530; color:#ffb3b3; }
  .node .op.keep { background:#2a3d4a; color:#a8d8ee; }
  .node .ic { width:26px; height:26px; border:0; background:none; color:var(--dim);
              font-size:15px; cursor:pointer; padding:0; }
  .row { margin:9px 0; }
  .row label { display:flex; align-items:center; gap:7px;
               color:var(--dim); font-size:12px; margin-bottom:3px; }
  /* The icon says which handle in the viewport this row drives. Axis rows are
     drawn in the axis colour, so a red arrow on screen and a red icon in the
     panel are the same thing without either having to say so. */
  .row label .gl { width:15px; height:15px; flex:0 0 auto; display:block; }
  .row label b { color:var(--ink); font-weight:600; margin-left:auto;
                 font-variant-numeric:tabular-nums; }
  /* the value is a button: tap it and type the number you actually want,
     which a slider with a 0.5 mm step cannot give you */
  .row label b.tap { cursor:pointer; padding:1px 5px; margin-right:-5px;
                     border-radius:5px; border:1px dashed transparent; }
  .row label b.tap:hover { border-color:var(--line); }
  .row label b.tap:active { color:var(--acc); border-color:var(--acc); }
  .numin { width:92px; margin-left:auto; background:#10141a; color:var(--ink);
           border:1px solid var(--acc); border-radius:6px; padding:2px 6px;
           font:600 12px/1.35 inherit; font-variant-numeric:tabular-nums;
           text-align:right; -webkit-user-select:text; user-select:text; }
  .slide { display:flex; align-items:center; gap:8px; }
  .slide input[type=range] { flex:1 1 auto; accent-color:var(--acc);
                             height:30px; }
  .step { width:32px; height:32px; flex:0 0 auto; border:1px solid var(--line);
          border-radius:8px; background:var(--btn); color:var(--ink);
          font-size:16px; line-height:1; cursor:pointer; padding:0; }
  /* The widget's own mode switch. Docked to the edge rather than floating by
     the selection: a bar that follows the model covers the model, and on a
     phone it ends up under the thumb that is trying to drag a handle. */
  #gizbar { position:fixed; left:10px; top:50%; transform:translateY(-50%);
            display:none; flex-direction:column; gap:7px; z-index:6; }
  #gizbar.on { display:flex; }
  #gizbar button { width:44px; height:44px; padding:0; cursor:pointer;
                   border:1px solid var(--line); border-radius:12px;
                   background:#1a2027e6; color:var(--dim);
                   display:flex; align-items:center; justify-content:center;
                   -webkit-backdrop-filter:blur(6px); backdrop-filter:blur(6px); }
  #gizbar button.on { border-color:var(--acc); color:var(--acc);
                      background:#2b2519f2; }
  #gizbar svg { width:22px; height:22px; display:block; }
  .grid3 { display:grid; grid-template-columns:repeat(3,1fr); gap:6px; }
  .toggles { display:flex; gap:6px; flex-wrap:wrap; }
  select { width:100%; background:#10141a; color:var(--ink); font-family:inherit;
           border:1px solid var(--line); border-radius:8px; padding:9px;
           font-size:14px; }
  .bar { display:flex; gap:6px; flex-wrap:wrap; }
  .bar .btn { flex:1 1 auto; }
  #modal { position:fixed; inset:0; background:#000b; z-index:40; display:none;
           align-items:center; justify-content:center; padding:16px; }
  #modal .card { background:#1a2027; border:1px solid var(--line);
                 border-radius:14px; padding:16px; width:min(520px,94vw);
                 max-height:86vh; overflow-y:auto; }
  #modal h4 { font-size:14px; margin-bottom:10px; }
  #modal p { color:var(--dim); font-size:12px; margin:8px 0; }
  textarea { width:100%; height:170px; background:#10141a; color:#cfe3c8;
             border:1px solid var(--line); border-radius:8px; padding:8px;
             font:12px ui-monospace,SFMono-Regular,monospace;
             -webkit-user-select:text; user-select:text; }
  .picker { display:grid; grid-template-columns:repeat(auto-fill,minmax(96px,1fr));
            gap:8px; }
  .picker button { background:var(--btn); border:1px solid var(--line);
                   border-radius:10px; color:var(--ink); padding:12px 6px;
                   font-size:12.5px; cursor:pointer; font-family:inherit; }
  @media (min-width:761px) {
    #panel { top:0; left:auto; width:340px; height:auto !important;
             border-top:0; border-left:1px solid var(--line); }
    #view { width:calc(100vw - 340px); }
    #topbar { right:340px; }                 /* keep it off the side rail */
    #grip { display:none; }
    #sheetBody { padding-top:48px; }
    #hint { bottom:12px; }
  }
</style>
</head>
<body>
<canvas id="view"></canvas>

<div id="topbar">
  <!-- target=_top so the link home escapes the iframe when the editor is
       embedded in the site's EDITOR section; a no-op when it runs standalone -->
  <a id="back" href="https://josiahsmakercave.xyz/" target="_top">‹ Maker Cave</a>
  <!-- the visible wordmark asserts the mark; the Home Screen label and
       <title> stay plain, since a shortcut name with a (TM) in it reads
       badly and the claim is already made here and in TRADEMARK.md -->
  <span id="brand">MetaMeld<sup class="tm">™</sup></span>
  <div class="seg" id="modeSeg">
    <button data-mode="orbit" class="on">Orbit</button>
    <button data-mode="grab">Move</button>
  </div>
  <button class="btn" id="undoBtn" title="Undo">↶</button>
  <button class="btn" id="viewBtn" title="Frame the model">⤢</button>
  <div id="status">starting…</div>
</div>
<div id="errbar"></div>
<div id="hint"></div>

<!-- The move / rotate / scale widget's mode switch. Hidden until something is
     selected, because the widget it drives is drawn at the selection. -->
<div id="gizbar">
  <button data-giz="move" class="on" title="Move along an axis" aria-label="Move">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"
         stroke-linecap="round" stroke-linejoin="round">
      <path d="M12 3v18M3 12h18"/><path d="M12 3 9.5 5.8M12 3l2.5 2.8"/>
      <path d="M12 21l-2.5-2.8M12 21l2.5-2.8"/>
      <path d="M3 12l2.8-2.5M3 12l2.8 2.5"/><path d="M21 12l-2.8-2.5M21 12l-2.8 2.5"/>
    </svg>
  </button>
  <button data-giz="rotate" title="Turn about an axis" aria-label="Rotate">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"
         stroke-linecap="round" stroke-linejoin="round">
      <path d="M20 12a8 8 0 1 1-3.2-6.4"/><path d="M20.5 4v4.6h-4.6"/>
    </svg>
  </button>
  <button data-giz="scale" title="Scale about the centre" aria-label="Scale">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"
         stroke-linecap="round" stroke-linejoin="round">
      <path d="M4 20 20 4"/><path d="M14 4h6v6"/><path d="M10 20H4v-6"/>
    </svg>
  </button>
</div>

<div id="panel">
  <div id="grip"><div></div></div>
  <div id="sheetBody">
    <h3>Baked <span style="color:var(--dim);text-transform:none;letter-spacing:0"
        id="bakedCount"></span></h3>
    <div id="baked"></div>
    <div class="bar" style="margin-top:6px">
      <button class="btn sm" id="bakeBtn">Bake this body</button>
    </div>
    <h3>Bodies <span style="color:var(--dim);text-transform:none;letter-spacing:0"
        id="bodyCount"></span></h3>
    <div id="bodies"></div>
    <div class="bar" style="margin-top:6px">
      <button class="btn sm" id="addBodyBtn">＋ Body</button>
    </div>
    <h3>Shapes <span style="color:var(--dim);text-transform:none;letter-spacing:0"
        id="nodeCount"></span></h3>
    <div class="seg" id="selSeg" style="margin-bottom:7px">
      <button data-s="single" class="on">Single</button>
      <button data-s="sticky">Sticky</button>
    </div>
    <div id="nodes"></div>
    <p id="selHint" style="color:var(--dim);font-size:11px;margin:6px 0 0"></p>
    <div class="bar" style="margin-top:8px">
      <button class="btn" id="addBtn">＋ Add shape</button>
      <button class="btn" id="dupBtn">Duplicate</button>
      <button class="btn" id="delBtn">Delete</button>
    </div>
    <div id="inspector"></div>
    <h3>Model</h3>
    <div class="bar">
      <button class="btn" id="stlBtn">Save STL</button>
      <button class="btn" id="jsonBtn">JSON</button>
      <button class="btn" id="saveBtn">Save</button>
      <button class="btn" id="openBtn">Open</button>
      <button class="btn" id="importBtn">Import</button>
      <input type="file" id="fileInp" accept=".json,application/json"
             style="display:none">
      <button class="btn" id="startBtn">Starters</button>
    </div>
    <div class="row" id="resRow">
      <label><span>STL resolution</span><b id="resVal" class="tap" role="button"
             tabindex="0" title="Tap to type a value">0.5 mm</b>
        <input class="numin" id="resNum" type="text" inputmode="decimal" hidden></label>
      <div class="slide">
        <button class="step" data-step="res:-1">−</button>
        <input type="range" id="resInp" min="0.2" max="2" step="0.05" value="0.5">
        <button class="step" data-step="res:1">＋</button>
      </div>
    </div>
    <p style="color:var(--dim);font-size:11.5px;margin:10px 0 4px" id="info"></p>
  </div>
</div>

<div id="modal"><div class="card" id="modalCard"></div></div>

<script>
"use strict";
// ======================================================================
// visible error reporting — a phone has no console to open
// ======================================================================
const errbar = document.getElementById('errbar');
function showErr(msg) { errbar.textContent = msg; errbar.style.display = 'block'; }
addEventListener('error', e => {
  const m = e.message || (e.target && e.target.tagName
    ? e.target.tagName + ' failed to load' : 'unknown error');
  showErr('Error: ' + m + (e.lineno ? ' @' + e.lineno : ''));
});
addEventListener('unhandledrejection',
  e => showErr('Error: ' + ((e.reason && e.reason.message) || e.reason)));
</script>

  // wire costs nothing extra, and it is exact where a lerped radius is not: a
  // tapered surface is slanted, so measuring perpendicular to the axis
  // over-reports by the secant of the slant. This formula measures to the
  // slant.
  //
  // Consecutive segments share an endpoint, so the sphere there fills the
  // joint and there is no corner case to write. That is the whole reason a
  // wire is simpler than a sweep: a ball revolved about any axis is the same
  // ball, so the turn direction never matters.
  //
  // Rolled, like `profile`, with the segments reached through intrinsics --
  // `slotDecls` unrolls this same loop for the GPU, from this source.
  wire: { fn: 'pWire', slotted: true, spec: true,
    src: `float pWire(polyline w, vec3 p, vec3 d, float r){
  float best = 1e18;
  int n = segCount(w);
  for (int i = 0; i < n; i++) {
    vec3 A = segA(w, i);
    vec3 B = segB(w, i);
    vec2 rr = segR(w, i);
    vec3 ba = B - A;
    vec3 pa = p - A;
    float l2 = dot(ba, ba);
    float dr = rr.x - rr.y;
    float a2 = l2 - dr*dr;

    // tangent cone between them, and the hull is just the larger sphere. min
    // of the two gives exactly that, since the contained one is never nearer.
    if (a2 <= 0.0) {

}` },

  // A sweep: a section dragged along a path, at a scale and a roll that may
  // both vary as it goes. The largest of the slotted primitives, and a direct
  // transcription of sweep.js's evaluator -- which is the point, because that
  // evaluator is the one check-sweep holds against tangent fillets, an exact
  // torus and the kernel's own cone in a slanted frame.
  //
  // Each item is one path segment carrying its own frame, span, scale, roll,
  // caps and turn. The section travels with every segment rather than once per
  // slot: a few floats repeated, and the compiler folds the branch away since
  // the kind arrives as a literal.
  //
  // Two things here are not obvious and both were bugs first. The rounded
  // joint revolves the section about *the axis the path turns about* -- a
  // circular section cannot show the difference, anything else bunches at the
  // corner. And it is a term of its own rather than something the segment
  // answers past its end, gated on reach and clamped into the turn.
  //
  // The item is laid out in the order this reads it, which is not the order it
  // was worked out in: the five values the cull test needs come first, so a
  // segment that cannot win is answered without reading the other nineteen.
  // build-twins.mjs's intrinsic table and sweep.js's `pack` say that same
  // layout, and check-glsl runs both ends of it on the same data.
  sweep: { fn: 'pSweep', slotted: true, spec: true,
    src: `float sweepSection(float kind, vec3 sp, float u, float v){
  if (kind < 0.5) return length(vec2(u, v)) - sp.x;
  if (kind < 1.5) {
    float hw = max(sp.x*0.5 - sp.z, 0.0), hh = max(sp.y*0.5 - sp.z, 0.0);
    float qu = abs(u) - hw, qv = abs(v) - hh;
    return length(max(vec2(qu, qv), 0.0)) + min(max(qu, qv), 0.0) - sp.z;
  }
  if (kind < 2.5) return max(length(vec2(u, v)) - sp.x, -v);

  // primitive extrudes, and the same polygonSDF the kernel evaluates.
  return sectionPoly(sp.x, u, v);

float pSweep(sweeppath w, vec3 p, vec3 d, float r){
  float best = 1e18;
  int n = swCount(w);
  for (int i = 0; i < n; i++) {
    // Only what the cull test needs is read here. A segment that cannot win
    // costs one dot, one length and a compare, and never touches the other
    // nineteen numbers of its item -- which is most of the item, and on the JS
    // side most of the memory traffic.
    vec3 A = swA(w, i);
    vec3 T = swT(w, i);
    vec3 LS = swLS(w, i);
    vec3 M = swMisc(w, i);
    float cull = swCull(w, i);

    vec3 pa = p - A;
    float proj = dot(pa, T);
    float q = clamp(proj, 0.0, LS.x);
    // Everything this segment can contribute -- the prism, its caps, a miter's
    // run-on and the fill at its joint -- lies within cull of the axis, so a
    // point further than that from the axis cannot beat what is already in
    // best. The taper divides the answer down, so it has to be allowed for
    // here, exactly as the joint's own reach test allows for it.
    //
    // This is what makes a sweep affordable. The union is over every segment
    // by definition -- that is what stops a self-crossing path from taking
    // bites out of itself -- but a point near one end of the path is nowhere
    // near the far end, and answering for the far end costs a hundred flops to
    // return a number that loses. The test drops only terms that provably
    // lose, so a culled sweep is bit-for-bit the sweep it would have been.
    if (length(pa - T*q) - cull < best*M.y) {
      vec3 U = swU(w, i);
      vec3 V = swV(w, i);
      vec2 K = swK(w, i);
      vec2 TC = swTurn(w, i);
      vec2 E = swE(w, i);
      vec3 C = swCaps(w, i);
      float kind = swKind(w, i);
      vec3 sp = swSect(w, i);

      float t = q/LS.x;
      float oStart = -(proj + E.x);
      float oEnd = proj - (LS.x + E.y);
      bool atA = oStart > oEnd;
      float past = atA ? oStart : oEnd;
      float capped = max(C.x > 0.5 ? oStart : -1e30, C.y > 0.5 ? oEnd : -1e30);
      float s = LS.y + (LS.z - LS.y)*t;
      float u0 = dot(pa, U);
      float v0 = dot(pa, V);
      float u = u0;
      float v = v0;
      if (M.x != 0.0) {
        float a = M.x*t;
        float ca = cos(a);
        float sa = sin(a);
        u = u0*ca + v0*sa;
        v = v0*ca - u0*sa;
      }
      float d2 = s > 1e-9 ? sweepSection(kind, sp, u/s, v/s)*s : length(vec2(u, v));
      float raw;
      if (past > 0.0) raw = d2 <= 0.0 ? past : length(vec2(d2, past));
      else raw = max(d2, capped);
      best = min(best, raw/M.y);

      if (C.z > 0.5) {
        float oJ = proj - LS.x;
        if (length(vec3(u0, v0, oJ)) - M.z < best*M.y) {
          float uj = u0;
          float vj = v0;
          if (M.x != 0.0) {
            float ca = cos(M.x);
            float sa = sin(M.x);
            uj = u0*ca + v0*sa;
            vj = v0*ca - u0*sa;
          }
          float sJ = LS.z;
          float pk = uj*K.x + vj*K.y;
          float pm = vj*K.x - uj*K.y;
          float beta;
          float off;
          if (oJ < 0.0) { beta = pm; off = oJ; }
          else if (pm*TC.y - oJ*TC.x >= 0.0) { beta = length(vec2(pm, oJ)); off = 0.0; }
          else { beta = pm*TC.x + oJ*TC.y; off = oJ*TC.x - pm*TC.y; }
          float p2 = sweepSection(kind, sp, (pk*K.x - beta*K.y)/sJ,
                                            (pk*K.y + beta*K.x)/sJ)*sJ;
          float c = (off == 0.0 ? p2 : length(vec2(max(p2, 0.0), abs(off))))/M.y;
          best = min(best, c);
        }
      }
    }
  }
  return best;
}` },

  // A profile is the other one whose data cannot travel in the uniform block,
  // and it does not need to: an outline is a few hundred vec2s, and the
  // distance to a polygon is a loop over its edges.
  //
  // This is the definition -- rolled, with the outline reached through the
  // `edgeCount`/`edgeA`/`edgeB` INTRINSICS, which is how the JS twin is
  // derived from it. What the GPU actually runs is the unrolled form
  // specialises this same loop by unrolling the edges into straight-line code.
  // That is an optimisation forced by WebGL2 (see the note there), not a
  // second definition, and check-glsl holds the unrolled form against the JS
  // this one generates.
  profile: { fn: 'pProfile', slotted: true, spec: true,
    src: `float pProfile(outline o, vec3 p, vec3 d, float r){
  float dd = 1e18;
  bool ins = false;
  int n = edgeCount(o);
  for (int i = 0; i < n; i++) {
    vec2 A = edgeA(o, i);
    vec2 B = edgeB(o, i);
    vec2 e = B - A;
    vec2 w = p.xy - A;
    vec2 q = w - e*clamp(dot(w, e)/dot(e, e), 0.0, 1.0);
    dd = min(dd, dot(q, q));
    bool c1 = p.y >= A.y;
    bool c2 = p.y < B.y;
    float cr = e.x*w.y - e.y*w.x;
    if ((c1 && c2 && cr > 0.0) || (!c1 && !c2 && cr < 0.0)) ins = !ins;
  }
  float da = (ins ? -1.0 : 1.0)*sqrt(dd);
  float db = abs(p.z) - d.z;
  return min(max(da, db), 0.0) + length(max(vec2(da, db), 0.0));
}` },

  // A construct: masses hung on a skeleton of connectors, folded with smin.
  //
  // The skeleton is not here. construct.js walks the tree once and hands over
  // a flat list in which every item already carries its own resolved frame --
  // the same division sweep.js makes, and for the same reason: composing
  // parents is a global property of the rig and this is a local evaluation. So
  // there is no hierarchy in this loop, no recursion, and nothing indexed
  // dynamically. A pose is different numbers in the same list.
  //
  // The frame arrives as a unit quaternion, already inverted, because what a
  // mass wants is its own local point: local = R'(p - o). Inverting a unit
  // quaternion is a sign flip on three floats, so construct.js does it once
  // per pack instead of once per sample per item, and the shader applies it
  // with the standard two-cross-product form. Four floats rather than a 3x3's
  // nine is worth it here: an item is read out of a uniform block whose size
  // is the consumer's whole budget, and a timeline will want to slerp them.
  //
  // Every transform is rigid. That is not a convention, it is what keeps this
  // a distance function -- construct.js refuses a scaled connector rather than
  // let the marcher step by a number that is too big.
  //
  // The cull is sweep's, for the same payoff: a bounding sphere first, so a
  // connector that cannot beat what has already been found is answered in four
  // reads instead of seventeen. smin(best, dd, k) is best whenever
  // dd >= best + k, and the k is already inside the radius construct.js packed,
  // so skipping is exact -- it changes the cost and never the answer.
  //
  // Exact *provided* a mass never reports less than the distance to its own
  // bounding sphere, and one of them does. An ellipsoid's is iq's bound rather
  // than its distance, and an anisotropic bound falls behind the true distance
  // without limit as you go out: no sphere is large enough to make the
  // implication hold, so this was not a radius to enlarge. What fixes it is
  // that the ball distance is *itself* a valid under-estimate -- the mass is
  // inside the ball -- so the greater of the two is one as well, and taking it
  // makes the premise true by construction. It costs a `max` and it tightens
  // the ellipsoid's far field on the way past, which the marcher is glad of.
  construct: { fn: 'pConstruct', slotted: true, spec: true,
    src: `float constructMass(float kind, vec3 q, vec3 dm, float tip){
  if (kind < 0.5) {
    float r0 = dm.x;
    float h = dm.z;
    // The cross-section's second axis, as a ratio of the first. A limb is not
    // a circle in section -- a wrist is 55 mm across and 40 through -- and a
    // figure built from round bones reads as tubing however good its
    // proportions are. Dividing the point by the ratio and multiplying the
    // answer by the smaller scale is the standard way to make an anisotropic
    // shape out of an isotropic one and stay 1-Lipschitz: the gradient picks
    // up 1/min(scale) and the factor takes it straight back out.
    float asp = max(dm.y, 1e-4);
    vec3 e = vec3(q.x, q.y/asp, q.z);
    float m = min(asp, 1.0);
    float sl = (r0 - tip)/h;
    float a2 = 1.0 - sl*sl;
    // One ball swallowing the other leaves no tangent cone between them and
    // the hull is just the larger ball -- the same degenerate case a wire's
    // round cone guards, reachable here by tapering a short bone hard.
    if (a2 <= 0.0) return min(length(e) - r0, length(e - vec3(0.0, 0.0, h)) - tip)*m;
    float a = sqrt(a2);
    vec2 w = vec2(length(e.xy), e.z);
    float t = dot(w, vec2(-sl, a));
    if (t < 0.0) return (length(w) - r0)*m;
    if (t > a*h) return (length(w - vec2(0.0, h)) - tip)*m;
    return (dot(w, vec2(a, sl)) - r0)*m;
  }
  if (kind < 1.5) {
    vec3 rr = max(dm, vec3(1e-3));
    float k0 = length(q/rr);
    float k1 = length(q/(rr*rr));
    if (k1 < 1e-6) return -min(rr.x, min(rr.y, rr.z));
    return k0*(k0 - 1.0)/k1;
  }
  if (kind < 2.5) return length(q) - dm.x;
  vec3 e = max(dm - tip, vec3(0.0));
  vec3 g = abs(q) - e;
  return length(max(g, 0.0)) + min(max(g.x, max(g.y, g.z)), 0.0) - tip;
}

float pConstruct(rig c, vec3 p, vec3 d, float r){
  float best = 1e18;
  int n = conCount(c);
  for (int i = 0; i < n; i++) {
    vec3 bc = conCull(c, i);
    float br = conCullR(c, i);
    float bd = length(p - bc) - br;
    if (bd < best) {
      vec3 org = conOrg(c, i);
      vec3 qv = conQ(c, i);
      float qw = conQW(c, i);
      vec3 dm = conMass(c, i);
      vec3 ms = conMisc(c, i);
      vec3 pa = p - org;
      vec3 t = vec3(qv.y*pa.z - qv.z*pa.y, qv.z*pa.x - qv.x*pa.z, qv.x*pa.y - qv.y*pa.x);
      vec3 lp = pa + (t*qw + vec3(qv.y*t.z - qv.z*t.y, qv.z*t.x - qv.x*t.z,

    }

// The whole primitive function library, ready to paste into a fragment
// shader. Pass a key list to emit a subset.
// The fold's own functions, which are not primitives but are just as much a
// definition: `smin` is what a blend *is*, and `invRot` is what a rotation is.
//
// These used to be hand-written in three places -- once in JavaScript in the
// kernel, and once in GLSL in each of the two files that assemble a shader,
// character for character identical. That is the same duplication the twins no
// longer have, so it is written here once and everyone reads it from here.
//
// `smin` and `smax` are translated into the kernel's generated block like any
// primitive. `invRot` is not, and deliberately: its JS twin writes into a
// caller-supplied array rather than returning one, because `sceneSDF` calls it
// once per node per sample and a returned array would be a hundred million
// allocations in a single mesh. It stays hand-written on the JS side, and
// check-glmesh compares the two ends of it per sample on a rotated scene.
const FOLD = `float smin(float a, float b, float k){
  if (k <= 0.0) return min(a, b);
  float h = clamp(0.5 + 0.5*(b - a)/k, 0.0, 1.0);
  return mix(b, a, h) - k*h*(1.0 - h);

float smax(float a, float b, float k){ return -smin(-a, -b, k); }

vec3 invRot(vec3 p, vec3 e){
  float c, s; vec3 q = p;
  c = cos(e.z); s = sin(e.z); q = vec3( c*q.x + s*q.y, -s*q.x + c*q.y, q.z);
  c = cos(e.y); s = sin(e.y); q = vec3( c*q.x - s*q.z, q.y, s*q.x + c*q.z);
  c = cos(e.x); s = sin(e.x); q = vec3( q.x, c*q.y + s*q.z, -s*q.y + c*q.z);
  return q;

const FOLD_TWINS = ['smin', 'smax'];

function foldSource() { return FOLD; }

// GLSL has no function pointers and cannot build a name from a float, so this
// is a dispatch over however many slots the plan named -- three or four lines,
// and the compiler folds it away because the slot arrives as a literal.
//
// A profile extruded with a half-thickness of 1e9 is exactly its own 2D

// profiles first, then the section dispatcher, then everything else -- because
// a sweep with a drawn section calls into the profiles and GLSL wants a
// function declared before it is used. `slots` is
// { profile: [items], wire: [...], sweep: [...] } from SinterForm.slotList.
//

// differently and writes its own map(), but the unrolling is the kernel's --
// written once per primitive, and called.

    + sectionPolyDecl(nProfile) + '\n'

// translates -- and not code any shader runs: `profile`'s names an `outline`
// type that GLSL does not have, because what the GPU runs is the unrolled
// specialisation `slotDecls` writes. Emitting it would not compile.

  return (keys || Object.keys(GLSL))
    .filter(k => !GLSL[k].spec)
    .map(k => GLSL[k].src).join('\n');

// slot for a baked primitive. Emitting this here rather than in the consumer
// is what lets the sampler-first calling convention stay a detail of this
// file.

  // slot is part of the name and there is no round to pass.
  if (g.slotted) return `${g.fn}${field | 0}(${point}, ${dims})`;
  return g.sampler
    ? `${g.fn}(uField${field | 0}, ${point}, ${dims}, ${round})`
    : `${g.fn}(${point}, ${dims}, ${round})`;

  syncBodies(); resetPicked();
  document.getElementById('undoBtn').disabled = !undoStack.length;
  sceneChanged(); renderList(); save(); needDraw();
}
// Every edit ends here — that is what makes this the one place the meshed
// view can be invalidated from without hunting down each mutation. A camera
// move or a resize never saves, which is exactly the distinction the mesh
// cares about: the model changed, so the triangles are of something else.
function save() {
  dropMesh();
  try { localStorage.setItem(STORE, JSON.stringify(
      { nodes, bodies, sel, activeBody,
        fields: SF.fields.length ? SF.fields.map(encodeField) : undefined })); }
  catch (e) { /* private browsing: editing still works, it just won't persist */ }
}

// Takes a stored or pasted document into the editor. Documents written before
// bodies existed have neither `bodies` nor `b`/`tg` on their shapes; they load
// as one body whose cuts are all global, which is what they always meant.
function adopt(doc) {
  const list = (doc && (doc.nodes || doc)) || [];
  if (!Array.isArray(list)) return false;
  const kept = list.filter(n => n && PRIMS[n.t]).map(n => makeNode(n.t, n));
  if (!kept.length) return false;
  // Baked fields, decoded before anything else is committed: a corrupt one
  // should fail the load, not half-apply it. `field` (singular) is the shape
  // the first exports used, still read so those documents keep working.
  const raw = doc.fields || (doc.field ? [doc.field] : []);
  const incoming = raw.slice(0, MAXFIELDS).map(decodeField).filter(Boolean);
  for (const f of SF.fields) if (f.tex) gl.deleteTexture(f.tex);
  SF.fields = incoming;
  nodes = kept;
  bodies = (doc.bodies || []).filter(b => b && typeof b.id === 'number')
             .map(b => ({ id: b.id, name: String(b.name || 'Body ' + (b.id + 1)),
                          on: b.on !== false }));
  // a document may name bodies only on its shapes (v2 pruned empty ones)
  for (const n of nodes)
    if (n.op === 'add' && typeof n.b === 'number' && !bodies.some(b => b.id === n.b))
      bodies.push({ id: n.b, name: 'Body ' + (n.b + 1), on: true });

             : bodies.length ? bodies[0].id : 0;

    if (typeof n.b !== 'number') n.b = 0;
    if (typeof n.fi !== 'number') n.fi = 0;
    if (isField(n)) n.fi = Math.min(Math.max(n.fi, 0),
                                    Math.max(SF.fields.length - 1, 0));
    if (n.op === 'add') n.tg = null;
    else if (n.tg && !Array.isArray(n.tg)) n.tg = null;
    if (Array.isArray(n.tg)) n.tg = n.tg.filter(id => typeof id === 'number');
  }
  syncBodies();
  picked = new Set();   // open showing the model, not a selection
  return true;
}

function load() {
  try {
    // fall back to the pre-rename key so nobody loses the model they were
    // working on; the next save writes it under the new one
    const raw = localStorage.getItem(STORE) || localStorage.getItem(STORE_OLD);
    const d = JSON.parse(raw || 'null');
    if (adopt(d)) { sel = Math.min(d.sel || 0, nodes.length - 1); return true; }
  } catch (e) {}
  return false;
}
if (!load()) {
  nodes = JSON.parse(JSON.stringify(STARTERS['Ice cream']));
  bodies = [{ id: 0, name: 'Body 1', on: true }];
  activeBody = 0;
  sel = 0;
  picked = new Set();
}

// ======================================================================
// WebGL2 — two ways to draw it
// ======================================================================
// The raymarcher runs the kernel's GLSL per pixel: shadows, ambient
// occlusion, the selection blue mixed across a blend with the same weight the
// distance is. It is the better picture and it is the one this editor is for.
// What it cannot do is scale — every shape in the scene is unrolled into
// `map()`, and `map()` runs a few hundred times per ray.
//
// So there is a second path: mesh the same field with the kernel's own
// surface nets and draw the triangles. Its cost is in the *build*, once per
// edit, and then it draws for nothing however many shapes went into it. That
// makes it the right picture in two places — for a model past what the
// marcher's uniforms hold, and as a stand-in while the camera is moving,
// where the shape is not changing and only the view is.
const canvas = document.getElementById('view');
const gl = canvas.getContext('webgl2', { antialias: false, alpha: false });
if (!gl) {
  showErr('WebGL2 is not available — on iPhone use Safari or Chrome, iOS 15+');
  throw new Error('no webgl2');
}

// ---------- what this GPU can hold ----------
// Three vec4 per shape, plus the camera, the tints and the tolerances. What
// is left of the fragment uniform block after those is how many shapes can be
// handed to a shader at once — a number the driver reports rather than one to
// guess at. GLES 3.0 guarantees 224 vectors and a desktop typically has 1024,
// so this is between 69 and 336 shapes where the old constant said 32.
const UNI = gl.getParameter(gl.MAX_FRAGMENT_UNIFORM_VECTORS) || 224;
const SLOTS = Math.max(8, Math.floor((UNI - 16) / 3));
// glmesh compiles the same map() with none of the shading around it, so it
// gets the whole allowance. Past this the grid is filled in JavaScript
// instead — slower, same answer, and no ceiling.
const GPU_N = SLOTS;
// The marcher stops short of the uniforms, and deliberately. Fitting is not
// the same as being worth drawing: a hundred shapes unrolled into a loop that
// runs 260 times a ray is a slideshow, while the mesh of the same model draws
// in a millisecond. This is where the cheaper of the two changes hands.
const RAY_N = Math.min(SLOTS, matchMedia('(pointer: coarse)').matches ? 48 : 96);
function compile(type, src) {
  const s = gl.createShader(type);
  gl.shaderSource(s, src); gl.compileShader(s);
  if (!gl.getShaderParameter(s, gl.COMPILE_STATUS))
    throw new Error('shader: ' + gl.getShaderInfoLog(s));
  return s;
}

  const pr = gl.createProgram();
  gl.attachShader(pr, compile(gl.VERTEX_SHADER, vs));
  gl.attachShader(pr, compile(gl.FRAGMENT_SHADER, fs));
  gl.linkProgram(pr);
  if (!gl.getProgramParameter(pr, gl.LINK_STATUS))
    throw new Error('link: ' + gl.getProgramInfoLog(pr));
  return pr;
}

const QUAD_VS =
'#version 300 es\n' +
'const vec2 v[3] = vec2[3](vec2(-1.,-1.), vec2(3.,-1.), vec2(-1.,3.));\n' +
'void main(){ gl_Position = vec4(v[gl_VertexID], 0.0, 1.0); }';

// The libraries a slotted primitive's shape comes out of. This editor can
// author only one of the four — baked fields — but a document written
// elsewhere can name any of them, and `slotList` hands back the primitive's
// own default for a slot nothing has filled, so an unknown one draws a shape
// rather than failing to compile.
const slotsFor = plan => ({
  profile: SF.slotList('profile', SF.profiles, GL.maxSlot(plan, 'profile')),
  wire: SF.slotList('wire', SF.wires, GL.maxSlot(plan, 'wire')),
  sweep: SF.slotList('sweep', SF.sweeps, GL.maxSlot(plan, 'sweep')),
  construct: SF.slotList('construct', SF.constructs, GL.maxSlot(plan, 'construct'))
});

function fragSource(plan, mapBody) {
  return `#version 300 es
precision highp float;
out vec4 frag;
uniform vec2 uRes;
uniform vec3 uEye;
uniform mat3 uCam;          // columns: right, up, forward
uniform float uFocal;
uniform vec4 uD[${SLOTS * 3}];
uniform vec3 uTint;
uniform vec3 uSelTint;
// x*t + y: how close a ray has to get before it counts as a hit. Sphere
// tracing stops *near* the surface, not on it, so this is exactly how far
// proud of the real d=0 surface the picture is drawn. Loose while a finger
// is down, tight once the view settles.
uniform vec2 uHit;
${GL.samplerDecls(MAXFIELDS).trimEnd()}
${GL.foldSource()}

// How much of the *accumulated* side survives a smin/smax. The colour has to
// be mixed with the same weight the distance is, or the blue would sit off
// the blend instead of fading across it. Set by map(), read after the hit.
// These are the folds' twins and have to be kept in step with them by hand:
// smin's h, and smax's, which is smin's with the sign of the difference
// turned round.
float gSel;
float wmin(float a, float b, float k){
  return (k <= 0.0) ? ((a < b) ? 1.0 : 0.0)
                    : clamp(0.5 + 0.5*(b - a)/k, 0.0, 1.0);
}
float wmax(float a, float b, float k){
  return (k <= 0.0) ? ((a > b) ? 1.0 : 0.0)
                    : clamp(0.5 - 0.5*(b - a)/k, 0.0, 1.0);
}
${GL.library(PRIM_KEYS)}
${GL.slotBlock(plan, slotsFor(plan))}

float map(vec3 P){
  float d = 1e9, dB, di, w, sw = 0.0, swB = 0.0; vec3 q;
${mapBody}  gSel = sw;
  return d;
}

vec3 normalAt(vec3 p){
  // tetrahedron differences: 4 evaluations instead of 6
  const vec2 e = vec2(1.0, -1.0)*0.0015;
  return normalize(e.xyy*map(p + e.xyy) + e.yyx*map(p + e.yyx) +
                   e.yxy*map(p + e.yxy) + e.xxx*map(p + e.xxx));
}
float shadow(vec3 ro, vec3 rd, float tmax){
  float res = 1.0, t = 0.6;
  for (int i = 0; i < 48; i++){
    float h = map(ro + rd*t);
    res = min(res, 12.0*h/t);
    // smooth blends make map() an over-estimate, so creep along it
    t += clamp(h*0.7, 0.25, 4.0);
    if (res < 0.02 || t > tmax) break;
  }
  return clamp(res, 0.0, 1.0);
}
float ao(vec3 p, vec3 n){
  float occ = 0.0, sca = 1.0;
  for (int i = 0; i < 5; i++){
    float h = 0.4 + 1.6*float(i)/5.0;
    occ += (h - map(p + n*h))*sca;
    sca *= 0.7;
  }
  return clamp(1.0 - 0.9*occ, 0.0, 1.0);
}

void main(){
  vec2 uv = (gl_FragCoord.xy - 0.5*uRes)/uRes.y;
  vec3 rd = normalize(uCam*vec3(uv, uFocal));
  vec3 ro = uEye;

  // model
  float t = 0.0, tMax = 2000.0;
  bool hit = false;
  for (int i = 0; i < 260; i++){
    float d = map(ro + rd*t);
    if (d < uHit.x*t + uHit.y) { hit = true; break; }
    // neither smin nor the ellipsoid bound is a true distance: full steps
    // tunnel through thin blended shoulders and leave banding behind
    t += d*0.72;

  float tg = (rd.z < -1e-5) ? (-ro.z/rd.z) : -1.0;
  bool ground = tg > 0.0 && (!hit || tg < t);

  vec3 col;
  if (ground){
    vec3 p = ro + rd*tg;
    float fade = exp(-0.0022*tg);
    vec2 g = abs(fract(p.xy/10.0 + 0.5) - 0.5)/fwidth(p.xy/10.0);
    float minor = 1.0 - min(min(g.x, g.y), 1.0);
    vec2 G = abs(fract(p.xy/50.0 + 0.5) - 0.5)/fwidth(p.xy/50.0);
    float major = 1.0 - min(min(G.x, G.y), 1.0);
    col = mix(vec3(0.055, 0.070, 0.085), vec3(0.16, 0.20, 0.24), minor*0.55);
    col = mix(col, vec3(0.26, 0.32, 0.38), major*0.6);
    float sh = shadow(p + vec3(0.0, 0.0, 0.05), normalize(vec3(0.42, -0.5, 0.76)), 400.0);
    col *= mix(0.35, 1.0, sh)*fade;
    col = mix(vec3(0.063, 0.078, 0.094), col, fade);
  } else if (hit){
    vec3 p = ro + rd*t;
    vec3 n = normalAt(p);
    vec3 L1 = normalize(vec3(0.42, -0.5, 0.76));
    vec3 L2 = normalize(vec3(-0.6, 0.55, 0.25));
    float dif = max(dot(n, L1), 0.0)*0.78*mix(0.35, 1.0, shadow(p + n*0.05, L1, 400.0))
              + max(dot(n, L2), 0.0)*0.22;
    vec3 V = normalize(uEye - p);
    float spec = pow(max(dot(n, normalize(L1 + V)), 0.0), 40.0)*0.35;
    float amb = (0.30 + 0.12*n.z)*ao(p, n);
    // normalAt() ran map() four times, so re-read the field here for gSel
    map(p);
    vec3 base = mix(uTint, uSelTint, clamp(gSel, 0.0, 1.0));
    col = base*(amb + dif) + vec3(spec);
    col = pow(col, vec3(0.62));
  } else {
    col = mix(vec3(0.063, 0.078, 0.094), vec3(0.10, 0.12, 0.145),
              clamp(rd.z*1.6 + 0.4, 0.0, 1.0));
  }
  frag = vec4(col, 1.0);
}`;
}

const lineProg = makeProgram(
'#version 300 es\n' +
'layout(location=0) in vec3 aPos;\n' +
'uniform mat4 uMVP;\n' +
'void main(){ gl_Position = uMVP*vec4(aPos, 1.0); }',
'#version 300 es\n' +
'precision highp float;\n' +
'uniform vec3 uC;\n' +
'out vec4 frag;\n' +
'void main(){ frag = vec4(uC, 1.0); }');
const lineVAO = gl.createVertexArray();
gl.bindVertexArray(lineVAO);
const lineBuf = gl.createBuffer();
gl.bindBuffer(gl.ARRAY_BUFFER, lineBuf);
gl.enableVertexAttribArray(0);
gl.vertexAttribPointer(0, 3, gl.FLOAT, false, 0, 0);
gl.bindVertexArray(null);

const emptyVAO = gl.createVertexArray();
let prog = null, U = {};
// Which uniform slot each shape's data goes in, for whatever was last
// compiled. Empty when the model is past RAY_N and no shader was built.
let slotAt = new Map();
let rayFits = true;

// The *structure* of the model changed: which shapes exist, what type or
// operation they are, which body they build or cut, whether they are mirrored.
// Values — a position, a radius, a blend — do not come through here, because
// they only move uniforms and the compiled shader already reads those.
function sceneChanged() {
  dropMesh();
  const plan = buildPlan(nodes);
  // Slots are per *shape*, not per appearance: a cut aimed at three bodies is
  // emitted three times in map() and packed once.
  const at = new Map();
  for (const part of plan)
    for (const n of part.nodes) if (!at.has(n)) at.set(n, at.size);
  slotAt = at;
  rayFits = at.size <= RAY_N;
  if (!rayFits) {
    // Nothing to compile — the mesh is the picture now. The old program goes
    // back to the driver rather than sitting there holding a model it cannot
    // draw.
    if (prog) { gl.deleteProgram(prog); prog = null; }
    errbar.style.display = 'none';
    scheduleProxy();
    return;
  }
  let body = '';
  for (const part of plan) {
    body += '  dB = 1e9; swB = 0.0;\n';
    for (const n of part.nodes) {
      const i = at.get(n);
      if (i === undefined) continue;
      const b = 3 * i;
      body += '  q = P;\n';
      // mirror the *world* point, so a shape at x = 20 also appears at x = -20
      if (n.mx) body += '  q.x = abs(q.x);\n';
      if (n.my) body += '  q.y = abs(q.y);\n';
      if (n.mz) body += '  q.z = abs(q.z);\n';

      // GL.call knows the sampler-first calling convention for a baked field

      // no longer has to. Only a field's slot is a texture unit and only a

      const fi = isField(n) ? Math.min(Math.max(n.fi || 0, 0), MAXFIELDS - 1)

      if (n.op === 'add') {
        body += `  w = wmin(dB, di, uD[${b}].w);\n`;
        body += `  dB = smin(dB, di, uD[${b}].w);\n`;
      } else if (n.op === 'cut') {
        body += `  w = wmax(dB, -di, uD[${b}].w);\n`;
        body += `  dB = smax(dB, -di, uD[${b}].w);\n`;

        body += `  dB = smax(dB, di, uD[${b}].w);\n`;

// The field as a 3D texture, uploaded once and left on unit 0. A scene with
// no field still binds something: sampling an unbound sampler3D is undefined,

let blankTex = null;

    gl.texSubImage3D(gl.TEXTURE_3D, 0, 0, 0, 0, 1, 1, 1,

      gl.texParameteri(gl.TEXTURE_3D, k, gl.LINEAR);

  for (let i = 0; i < MAXFIELDS; i++) {
    const f = SF.fields[i];
    if (f && !f.tex) {

      gl.bindTexture(gl.TEXTURE_3D, f.tex);

  // glsl.js generated and whoever fills the array — so it is filled by the
  // same file rather than written out a second time here. That includes the
  // rule that a baked field takes its sample *range* through the slot every
  // other primitive uses for corner rounding: pack `round` there by hand and
  // the field comes out multiplied by zero, which draws as its bounding box
  // and looks exactly like a texture that never arrived.
  GL.packPlan(slotAt, { maxN: SLOTS, roundSlot, into: uData });

// ======================================================================
// the meshed view
// ======================================================================
// The same field, found the other way: sampled on a grid and walked into
// triangles by the kernel's surface nets — the same mesher the STL comes out
// of, at a coarser spacing. Once built it draws as a vertex buffer, which
// costs the same for four hundred shapes as for four.
//
// Plain by design. It has no selection blue, because a triangle does not know
// which shape it came from and the wireframe boxes already say what is picked;
// no shadows and no ambient occlusion, because those are ray queries against a
// field this path does not have. What it does have is the outline, and the
// outline is the thing you are modelling.
const MESH_VS = `#version 300 es
layout(location=0) in vec3 aP;
layout(location=1) in vec3 aN;
uniform mat4 uMVP;
out vec3 vN; out vec3 vW;
void main(){ vN = aN; vW = aP; gl_Position = uMVP*vec4(aP, 1.0); }`;
const MESH_FS = `#version 300 es
precision highp float;
in vec3 vN; in vec3 vW; out vec4 frag;
uniform vec3 uTint; uniform vec3 uEye;
void main(){
  vec3 n = normalize(vN);
  vec3 L1 = normalize(vec3(0.42, -0.5, 0.76));
  vec3 L2 = normalize(vec3(-0.6, 0.55, 0.25));
  // the marcher's lighting with its two ray queries replaced by their
  // averages, so switching between the pictures is not a change of scene
  float dif = max(dot(n, L1), 0.0)*0.78*0.80 + max(dot(n, L2), 0.0)*0.22;
  vec3 V = normalize(uEye - vW);
  float spec = pow(max(dot(n, normalize(L1 + V)), 0.0), 40.0)*0.35;
  float amb = (0.30 + 0.12*n.z)*0.85;

// glmesh fills the grid by compiling the same map() and rendering it into a
// float target: one SDF evaluation per corner, which is essentially all of the
// cost of meshing, done on the hardware that is good at it. Resolved once,
// because asking makes a context.
let gpuSample;

  if (gpuSample === undefined)
    gpuSample = (GM && GM.available(gl))
      ? GM.sampler({ gl, maxN: GPU_N, maxFields: MAXFIELDS }) : null;
  return gpuSample;
}
const planCount = plan => {
  const seen = new Set();

  return seen.size;
};

// Grid spacing for a picture, which is a different question from the STL's.
// Here the answer wanted is "as fine as a few milliseconds buys", so it comes
// from a sample budget and the model's own size rather than from the export
// slider. On the GPU that is a grid around 120 cubed; in JavaScript it has to
// be an order of magnitude coarser, and the picture says so by looking it.
const VIEW_SAMPLES = matchMedia('(pointer: coarse)').matches ? 6e5 : 1.6e6;
