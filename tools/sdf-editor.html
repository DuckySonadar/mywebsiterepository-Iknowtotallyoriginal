<!-- viewport-fit=cover + safe-area padding below: without it iOS puts the
     bottom sheet under the home indicator -->
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<!-- names the Home Screen shortcut; without it iOS uses the whole title -->
<meta name="apple-mobile-web-app-title" content="MetaMeld">
<meta name="theme-color" content="#101418">
<title>MetaMeld</title>
<style>
  :root { --bg:#101418; --panel:#1a2027f2; --ink:#dfe7ee; --dim:#8fa0af;
          --acc:#f0913b; --err:#ff6b6b; --note:#ffc857; --sel:#5ec8f0;
          --line:#3a4652; --btn:#2a333d;
          --sheet:52vh; }
  * { box-sizing:border-box; margin:0; -webkit-tap-highlight-color:transparent; }
  html,body { height:100%; background:var(--bg); color:var(--ink); overflow:hidden;
              font:14px/1.4 -apple-system,'Segoe UI',Roboto,sans-serif;
              -webkit-user-select:none; user-select:none;
              overscroll-behavior:none; }
  /* canvas is a replaced element: left+right don't stretch it, so size it
     explicitly or it stays at its intrinsic 300x150 */
  #view { position:fixed; top:0; left:0; width:100vw; height:100vh;
          height:100dvh; touch-action:none; display:block; }
  #topbar { position:fixed; top:0; left:0; right:0; z-index:6;
            padding:calc(env(safe-area-inset-top) + 8px) 12px 8px;
            display:flex; gap:8px; align-items:center; flex-wrap:wrap;
            background:linear-gradient(#101418dd,#10141800); pointer-events:none; }
  #topbar > * { pointer-events:auto; }
  #status { color:var(--dim); font-size:12px; margin-left:auto; text-align:right;
            max-width:52vw; }
  .btn { background:var(--btn); color:var(--ink); border:1px solid var(--line);
         border-radius:9px; padding:8px 12px; font-size:13px; cursor:pointer;
         min-height:38px; font-family:inherit; }
  .btn:active { background:#38434f; }
  .btn.on { background:var(--acc); border-color:var(--acc); color:#181818;
            font-weight:600; }
  .btn:disabled { opacity:.4; }
  .btn.sm { padding:5px 9px; min-height:32px; font-size:12px; }
  .seg { display:flex; border:1px solid var(--line); border-radius:9px;
         overflow:hidden; background:#1a2027cc; }
  .seg button { background:none; border:0; color:var(--dim); padding:8px 12px;
                font-size:13px; cursor:pointer; font-family:inherit;
                min-height:38px; }
  .seg button.on { background:var(--acc); color:#181818; font-weight:600; }
  /* text, not a button: the tool's own controls should win the top bar */
  #back { color:var(--dim); text-decoration:none; font-size:12.5px;
          padding:8px 2px; white-space:nowrap; }
  #back:hover, #back:focus-visible { color:var(--acc); }
  /* full-screen off the Home Screen there is no tab to read the name from */
  #brand { color:var(--ink); font-size:13px; font-weight:600;
           letter-spacing:.02em; white-space:nowrap; padding:8px 0; }
  .tm { font-size:.62em; vertical-align:.5em; opacity:.75; margin-left:.5px; }
  /* a phone needs the width for the controls, and its shortcut is labelled */
  @media (max-width:560px) { #brand { display:none; } }
  #errbar { position:fixed; top:calc(env(safe-area-inset-top) + 52px);
            left:50%; transform:translateX(-50%); background:#4a1520;
            color:#ffb3b3; border:1px solid #7a2535; border-radius:8px;
            padding:6px 12px; font-size:12px; display:none; max-width:92vw;
            z-index:30; }
  #hint { position:fixed; left:12px; z-index:4; bottom:calc(var(--sheet) + 8px);
          color:var(--dim); font-size:11.5px; pointer-events:none;
          max-width:min(60vw,420px); text-shadow:0 1px 3px #000; }

  /* ---- bottom sheet (phone) / right rail (desktop) ---- */
  #panel { position:fixed; left:0; right:0; bottom:0; height:var(--sheet);
           background:var(--panel); backdrop-filter:blur(8px);
           border-top:1px solid var(--line); z-index:5;
           display:flex; flex-direction:column;
           transition:height .18s ease; }
  #panel.drag { transition:none; }
  #grip { height:26px; flex:0 0 auto; display:flex; align-items:center;
          justify-content:center; touch-action:none; cursor:grab; }
  #grip div { width:44px; height:5px; border-radius:3px; background:#4a5764; }
  #sheetBody { flex:1 1 auto; overflow-y:auto; -webkit-overflow-scrolling:touch;
               padding:0 12px calc(env(safe-area-inset-bottom) + 16px); }
  h3 { font-size:10.5px; letter-spacing:.12em; text-transform:uppercase;
       color:var(--acc); margin:14px 0 6px; }
  #nodes { display:flex; flex-direction:column; gap:5px; }
  .node { display:flex; align-items:center; gap:8px; padding:7px 9px;
          border:1px solid var(--line); border-radius:9px; background:#20272f;
          font-size:13px; }
  .node.sel { border-color:var(--sel); background:#22313a; }
  .node.off { opacity:.45; }
  .node .nm { flex:1 1 auto; overflow:hidden; text-overflow:ellipsis;
              white-space:nowrap; }
  .node .op { font-size:10px; letter-spacing:.06em; text-transform:uppercase;
              padding:2px 6px; border-radius:5px; background:#33404b;
              color:var(--dim); }
  .node.away { opacity:.55; }
  /* selected reads blue, the same blue the model is tinted with */
  .node.pick { border-color:var(--sel); background:#1a2c36; }
  .node.pick .nm { color:#cfe9f6; }
  /* the primary — what the sliders edit — carries a bar down its edge */
  .node.pick.sel { box-shadow:inset 3px 0 0 var(--sel); }
  .node.body .nm { font-weight:600; }
  .node.body.sel { border-color:var(--acc); background:#2b2519; }
  #bodies { display:flex; flex-direction:column; gap:5px; }
  #bnm { width:100%; background:#10141a; color:var(--ink); font:inherit;
         border:1px solid var(--line); border-radius:8px; padding:9px 10px; }
  .node .bd { font-size:10px; letter-spacing:.04em; padding:2px 6px;
              border-radius:5px; border:1px solid var(--line); color:var(--dim);
              max-width:96px; overflow:hidden; text-overflow:ellipsis;
              white-space:nowrap; }
  .node .op.cut { background:#4a2530; color:#ffb3b3; }
  .node .op.keep { background:#2a3d4a; color:#a8d8ee; }
  .node .ic { width:26px; height:26px; border:0; background:none; color:var(--dim);
              font-size:15px; cursor:pointer; padding:0; }
  .row { margin:9px 0; }
  .row label { display:flex; justify-content:space-between; align-items:baseline;
               color:var(--dim); font-size:12px; margin-bottom:3px; }
  .row label b { color:var(--ink); font-weight:600;
                 font-variant-numeric:tabular-nums; }
  .slide { display:flex; align-items:center; gap:8px; }
  .slide input[type=range] { flex:1 1 auto; accent-color:var(--acc);
                             height:30px; }
  .step { width:32px; height:32px; flex:0 0 auto; border:1px solid var(--line);
          border-radius:8px; background:var(--btn); color:var(--ink);
          font-size:16px; line-height:1; cursor:pointer; padding:0; }
  .grid3 { display:grid; grid-template-columns:repeat(3,1fr); gap:6px; }
  .toggles { display:flex; gap:6px; flex-wrap:wrap; }
  select { width:100%; background:#10141a; color:var(--ink); font-family:inherit;
           border:1px solid var(--line); border-radius:8px; padding:9px;
           font-size:14px; }
  .bar { display:flex; gap:6px; flex-wrap:wrap; }
  .bar .btn { flex:1 1 auto; }
  #modal { position:fixed; inset:0; background:#000b; z-index:40; display:none;
           align-items:center; justify-content:center; padding:16px; }
  #modal .card { background:#1a2027; border:1px solid var(--line);
                 border-radius:14px; padding:16px; width:min(520px,94vw);
                 max-height:86vh; overflow-y:auto; }
  #modal h4 { font-size:14px; margin-bottom:10px; }
  #modal p { color:var(--dim); font-size:12px; margin:8px 0; }
  textarea { width:100%; height:170px; background:#10141a; color:#cfe3c8;
             border:1px solid var(--line); border-radius:8px; padding:8px;
             font:12px ui-monospace,SFMono-Regular,monospace;
             -webkit-user-select:text; user-select:text; }
  .picker { display:grid; grid-template-columns:repeat(auto-fill,minmax(96px,1fr));
            gap:8px; }
  .picker button { background:var(--btn); border:1px solid var(--line);
                   border-radius:10px; color:var(--ink); padding:12px 6px;
                   font-size:12.5px; cursor:pointer; font-family:inherit; }
  @media (min-width:761px) {
    #panel { top:0; left:auto; width:340px; height:auto !important;
             border-top:0; border-left:1px solid var(--line); }
    #view { width:calc(100vw - 340px); }
    #topbar { right:340px; }                 /* keep it off the side rail */
    #grip { display:none; }
    #sheetBody { padding-top:48px; }
    #hint { bottom:12px; }
  }
</style>
</head>
<body>
<canvas id="view"></canvas>

<div id="topbar">
  <!-- target=_top so the link home escapes the iframe when the editor is
       embedded in the site's EDITOR section; a no-op when it runs standalone -->
  <a id="back" href="https://josiahsmakercave.xyz/" target="_top">‹ Maker Cave</a>
  <!-- the visible wordmark asserts the mark; the Home Screen label and
       <title> stay plain, since a shortcut name with a (TM) in it reads
       badly and the claim is already made here and in TRADEMARK.md -->
  <span id="brand">MetaMeld<sup class="tm">™</sup></span>
  <div class="seg" id="modeSeg">
    <button data-mode="orbit" class="on">Orbit</button>
    <button data-mode="grab">Move</button>
  </div>
  <button class="btn" id="undoBtn" title="Undo">↶</button>
  <button class="btn" id="viewBtn" title="Frame the model">⤢</button>
  <div id="status">starting…</div>
</div>
<div id="errbar"></div>
<div id="hint"></div>

<div id="panel">
  <div id="grip"><div></div></div>
  <div id="sheetBody">
    <h3>Baked <span style="color:var(--dim);text-transform:none;letter-spacing:0"
        id="bakedCount"></span></h3>
    <div id="baked"></div>
    <div class="bar" style="margin-top:6px">
      <button class="btn sm" id="bakeBtn">Bake this body</button>
    </div>
    <h3>Bodies <span style="color:var(--dim);text-transform:none;letter-spacing:0"
        id="bodyCount"></span></h3>
    <div id="bodies"></div>
    <div class="bar" style="margin-top:6px">
      <button class="btn sm" id="addBodyBtn">＋ Body</button>
    </div>
    <h3>Shapes <span style="color:var(--dim);text-transform:none;letter-spacing:0"
        id="nodeCount"></span></h3>
    <div class="seg" id="selSeg" style="margin-bottom:7px">
      <button data-s="single" class="on">Single</button>
      <button data-s="sticky">Sticky</button>
    </div>
    <div id="nodes"></div>
    <p id="selHint" style="color:var(--dim);font-size:11px;margin:6px 0 0"></p>
    <div class="bar" style="margin-top:8px">
      <button class="btn" id="addBtn">＋ Add shape</button>
      <button class="btn" id="dupBtn">Duplicate</button>
      <button class="btn" id="delBtn">Delete</button>
    </div>
    <div id="inspector"></div>
    <h3>Model</h3>
    <div class="bar">
      <button class="btn" id="stlBtn">Save STL</button>
      <button class="btn" id="jsonBtn">JSON</button>
      <button class="btn" id="saveBtn">Save</button>
      <button class="btn" id="openBtn">Open</button>
      <button class="btn" id="importBtn">Import</button>
      <input type="file" id="fileInp" accept=".json,application/json"
             style="display:none">
      <button class="btn" id="startBtn">Starters</button>
    </div>
    <div class="row" id="resRow">
      <label>STL resolution <b id="resVal">0.5 mm</b></label>
      <div class="slide">
        <button class="step" data-step="res:-1">−</button>
        <input type="range" id="resInp" min="0.2" max="2" step="0.05" value="0.5">
        <button class="step" data-step="res:1">＋</button>
      </div>
    </div>
    <p style="color:var(--dim);font-size:11.5px;margin:10px 0 4px" id="info"></p>
  </div>
</div>

<div id="modal"><div class="card" id="modalCard"></div></div>

<script>
"use strict";
// ======================================================================
// visible error reporting — a phone has no console to open
// ======================================================================
const errbar = document.getElementById('errbar');
function showErr(msg) { errbar.textContent = msg; errbar.style.display = 'block'; }
addEventListener('error', e => {
  const m = e.message || (e.target && e.target.tagName
    ? e.target.tagName + ' failed to load' : 'unknown error');
  showErr('Error: ' + m + (e.lineno ? ' @' + e.lineno : ''));
});
addEventListener('unhandledrejection',
  e => showErr('Error: ' + ((e.reason && e.reason.message) || e.reason)));
</script>

// ======================================================================
// baked fields
// ======================================================================
// A shape the editor cannot describe with primitives -- the flexi fish, whose
// body is swept from NURBS curves -- arrives instead as its distance field,
// sampled on a grid. That is enough to cut against, blend with and mesh, which
// is the whole reason to want it here: a joint tool has to be positioned
// against the body it will cut, not against a guess at it.
//
// One field per document. It lives on the document rather than inside a node,
// so undo snapshots and the shape list stay small, and a node of type `field`
// refers to it. Samples are one byte each: 0..255 across +/-`range` mm, which
// is ~0.06 mm at the 8 mm range the exporter uses -- far finer than the grid
// spacing, so the quantisation is never the limit.
const MAXFIELDS = 4;     // one 3D texture each; the shader declares this many
let fields = [];         // [{ name, nx, ny, nz, box:[hx,hy,hz], range, data, tex }]

function decodeField(f) {
  if (!f || !f.data) return null;
  const bin = atob(f.data);
  const data = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) data[i] = bin.charCodeAt(i);
  const need = f.nx * f.ny * f.nz;
  if (data.length !== need)
    throw new Error(`field is ${data.length} bytes, expected ${need}`);
  return { name: String(f.name || 'Baked'), nx: f.nx, ny: f.ny, nz: f.nz,
           box: f.box.slice(), range: f.range, data, tex: null };
}
// Chunked, because fromCharCode(...half a million bytes) overflows the call
// stack. Cached, because the samples never change once loaded and this runs on
// every save -- which is every drag of every slider.
function encodeField(f) {
  if (!f.b64) {
    let s = '';
    for (let i = 0; i < f.data.length; i += 8192)
      s += String.fromCharCode.apply(null, f.data.subarray(i, i + 8192));
    f.b64 = btoa(s);
  }
  return { name: f.name, nx: f.nx, ny: f.ny, nz: f.nz, box: f.box,
           range: f.range, data: f.b64 };
}

// Trilinear sample in the field's own local frame. Outside the grid this
// returns the nearest edge sample, and `pField` unions that with the box so
// the result stays a safe under-estimate for the marcher.
function sampleField(f, x, y, z) {
  if (!f) return 1e9;
  const gx = (x + f.box[0]) / (2 * f.box[0]) * (f.nx - 1);
  const gy = (y + f.box[1]) / (2 * f.box[1]) * (f.ny - 1);
  const gz = (z + f.box[2]) / (2 * f.box[2]) * (f.nz - 1);
  const cl = (v, n) => Math.min(Math.max(v, 0), n - 1);
  const x0 = Math.floor(cl(gx, f.nx)), y0 = Math.floor(cl(gy, f.ny)),
        z0 = Math.floor(cl(gz, f.nz));
  const x1 = Math.min(x0 + 1, f.nx - 1), y1 = Math.min(y0 + 1, f.ny - 1),
        z1 = Math.min(z0 + 1, f.nz - 1);
  const tx = cl(gx, f.nx) - x0, ty = cl(gy, f.ny) - y0, tz = cl(gz, f.nz) - z0;
  const at = (i, j, k) => f.data[(i * f.ny + j) * f.nz + k];
  const lerp = (a, b, t) => a + (b - a) * t;
  const c00 = lerp(at(x0, y0, z0), at(x1, y0, z0), tx);
  const c10 = lerp(at(x0, y1, z0), at(x1, y1, z0), tx);
  const c01 = lerp(at(x0, y0, z1), at(x1, y0, z1), tx);
  const c11 = lerp(at(x0, y1, z1), at(x1, y1, z1), tx);
  const c = lerp(lerp(c00, c10, ty), lerp(c01, c11, ty), tz);
  return (c / 255 * 2 - 1) * f.range;
}

  if (Math.abs(Math.cos(b)) > 1e-6)
    return [Math.atan2(m[7], m[8]) * R2D, b * R2D, Math.atan2(m[3], m[0]) * R2D];
  // gimbal lock: at ±90° pitch the roll and yaw axes coincide, so put the
  // whole turn in roll rather than letting the two of them fight
  return [Math.atan2(-m[5], m[4]) * R2D, b * R2D, 0];
}
function mMul(A, B) {
  const o = new Array(9);
  for (let r = 0; r < 3; r++)
    for (let c = 0; c < 3; c++)
      o[3 * r + c] = A[3 * r] * B[c] + A[3 * r + 1] * B[3 + c] + A[3 * r + 2] * B[6 + c];
  return o;
}
function axisM(ax, deg) {
  const c = Math.cos(deg * D2R), s = Math.sin(deg * D2R);
  if (ax === 0) return [1, 0, 0, 0, c, -s, 0, s, c];
  if (ax === 1) return [c, 0, s, 0, 1, 0, -s, 0, c];
  return [c, -s, 0, s, c, 0, 0, 0, 1];
}
const mApply = (m, v) => [m[0] * v[0] + m[1] * v[1] + m[2] * v[2],
                          m[3] * v[0] + m[4] * v[1] + m[5] * v[2],
                          m[6] * v[0] + m[7] * v[1] + m[8] * v[2]];

// what the group turns about: the mean of the selected shapes' own origins
function selCentre() {
  const c = [0, 0, 0];
  for (const n of picked) { c[0] += n.p[0]; c[1] += n.p[1]; c[2] += n.p[2]; }
  const k = picked.size || 1;
  return [c[0] / k, c[1] / k, c[2] / k];
}

// Clamp the *shared* delta, not each shape: clamping them one at a time would
// stop the ones that hit the limit while the rest kept going, and the group
// would come apart at the edge of the build volume.
function translateSelection(dx, dy, dz) {
  if (!picked.size) return;
  const d = [dx, dy, dz];
  for (const n of picked)
    for (let i = 0; i < 3; i++) {
      d[i] = Math.min(d[i], POSLIM - n.p[i]);
      d[i] = Math.max(d[i], -POSLIM - n.p[i]);
    }
  for (const n of picked)
    for (let i = 0; i < 3; i++) n.p[i] += d[i];

// Uniform only. Per-axis scaling of a rotated assembly is not expressible in
// this representation -- a box turned 30 degrees and squashed in x is no
// longer a box -- so offering it would quietly lie about what it did.
// Everything with a length scales: the shapes' own dimensions, their offset
// from the centre, and the blend and corner radii, which are lengths too and
// would otherwise grow in proportion as the model shrank.
function scaleSelection(f) {
  if (!picked.size || !(f > 0) || f === 1) return;
  const C = selCentre();
  for (const n of picked) {
    for (let i = 0; i < 3; i++)
      n.p[i] = Math.min(Math.max(C[i] + (n.p[i] - C[i]) * f, -POSLIM), POSLIM);
    const P = PRIMS[n.t];
    // a plane has no size; a baked field's box is the grid it samples, and
    // scaling that would resample it wrong, so both are left alone. Within a
    // shape, only the dims that are lengths scale: a hexagon scaled by 1.5 is
    // a bigger hexagon, not a nine-sided one, and a 90° arc stays 90°.
    if (!P.infinite && !P.baked)
      for (let i = 0; i < n.d.length; i++)
        if (dimIsLength(n.t, i)) n.d[i] *= f;
    n.k *= f;
    if (n.round) n.round *= f;
  }
}

function rotateSelection(ax, deg) {
  if (!picked.size || !deg) return;
  const D = axisM(ax, deg), C = selCentre();
  for (const n of picked) {
    const v = mApply(D, [n.p[0] - C[0], n.p[1] - C[1], n.p[2] - C[2]]);
    for (let i = 0; i < 3; i++)
      n.p[i] = Math.min(Math.max(C[i] + v[i], -POSLIM), POSLIM);
    n.r = mToEuler(mMul(D, eulerToM(n.r)));
  }
}

// after nodes are replaced or spliced, drop members that are no longer there
const syncPicked = () =>
  picked = new Set([...picked].filter(n => nodes.indexOf(n) >= 0));
const resetPicked = () => picked = new Set(nodes[sel] ? [nodes[sel]] : []);

// sceneBounds() is defined in an earlier script block, so it cannot reach
// bodyShown — hand it a list with the hidden bodies already taken out.
const shownNodes = () => nodes.filter(n => n.op !== 'add' || bodyShown(n.b));

// One entry per body, holding the shapes that body is folded from: its own
// adds plus every cut/keep aimed at it, in list order. Bodies with nothing
// to build are dropped so they cost no shader.
function buildPlan(list) {
  const live = list.filter(n => n.on);
  const plan = [];
  for (const b of bodies) {
    if (b.on === false) continue;          // hidden: out of the view and the STL
    const own = live.filter(n => n.op === 'add' ? n.b === b.id : hits(n, b.id));
    if (own.some(n => n.op === 'add')) plan.push({ id: b.id, nodes: own });
  }
  return plan;
}

function snapshot() {
  undoStack.push(JSON.stringify({ nodes, bodies, sel, activeBody }));
  if (undoStack.length > 40) undoStack.shift();
  document.getElementById('undoBtn').disabled = false;
}
function undo() {
  const s = undoStack.pop();
  if (!s) return;
  const d = JSON.parse(s);
  nodes = d.nodes; sel = Math.min(d.sel, nodes.length - 1);
  if (Array.isArray(d.bodies) && d.bodies.length) bodies = d.bodies;
  if (typeof d.activeBody === 'number') activeBody = d.activeBody;
  syncBodies(); resetPicked();
  document.getElementById('undoBtn').disabled = !undoStack.length;
  rebuildShader(); renderList(); save(); needDraw();
}
function save() {
  try { localStorage.setItem(STORE, JSON.stringify(
      { nodes, bodies, sel, activeBody,
        fields: SF.fields.length ? SF.fields.map(encodeField) : undefined })); }
  catch (e) { /* private browsing: editing still works, it just won't persist */ }
}

// Takes a stored or pasted document into the editor. Documents written before
// bodies existed have neither `bodies` nor `b`/`tg` on their shapes; they load
// as one body whose cuts are all global, which is what they always meant.
function adopt(doc) {
  const list = (doc && (doc.nodes || doc)) || [];
  if (!Array.isArray(list)) return false;
  const kept = list.filter(n => n && PRIMS[n.t]).slice(0, MAXN)
                   .map(n => makeNode(n.t, n));
  if (!kept.length) return false;
  // Baked fields, decoded before anything else is committed: a corrupt one
  // should fail the load, not half-apply it. `field` (singular) is the shape
  // the first exports used, still read so those documents keep working.
  const raw = doc.fields || (doc.field ? [doc.field] : []);
  const incoming = raw.slice(0, MAXFIELDS).map(decodeField).filter(Boolean);
  for (const f of SF.fields) if (f.tex) gl.deleteTexture(f.tex);
  SF.fields = incoming;
  nodes = kept;
  bodies = (doc.bodies || []).filter(b => b && typeof b.id === 'number')
             .map(b => ({ id: b.id, name: String(b.name || 'Body ' + (b.id + 1)),
                          on: b.on !== false }));
  // a document may name bodies only on its shapes (v2 pruned empty ones)
  for (const n of nodes)
    if (n.op === 'add' && typeof n.b === 'number' && !bodies.some(b => b.id === n.b))
      bodies.push({ id: n.b, name: 'Body ' + (n.b + 1), on: true });
  activeBody = typeof doc.activeBody === 'number' ? doc.activeBody
             : bodies.length ? bodies[0].id : 0;
  for (const n of nodes) {
    if (typeof n.b !== 'number') n.b = 0;
    if (typeof n.fi !== 'number') n.fi = 0;
    if (PRIMS[n.t].baked) n.fi = Math.min(Math.max(n.fi, 0),
                                          Math.max(SF.fields.length - 1, 0));
    if (n.op === 'add') n.tg = null;
    else if (n.tg && !Array.isArray(n.tg)) n.tg = null;
    if (Array.isArray(n.tg)) n.tg = n.tg.filter(id => typeof id === 'number');
  }
  syncBodies();
  picked = new Set();   // open showing the model, not a selection
  return true;
}

function load() {
  try {
    // fall back to the pre-rename key so nobody loses the model they were
    // working on; the next save writes it under the new one
    const raw = localStorage.getItem(STORE) || localStorage.getItem(STORE_OLD);
    const d = JSON.parse(raw || 'null');
    if (adopt(d)) { sel = Math.min(d.sel || 0, nodes.length - 1); return true; }
  } catch (e) {}
  return false;
}
if (!load()) {
  nodes = JSON.parse(JSON.stringify(STARTERS['Ice cream']));
  bodies = [{ id: 0, name: 'Body 1', on: true }];
  activeBody = 0;
  sel = 0;
  picked = new Set();
}

// WebGL2 raymarcher

const canvas = document.getElementById('view');
const gl = canvas.getContext('webgl2', { antialias: false, alpha: false });
if (!gl) {
  showErr('WebGL2 is not available — on iPhone use Safari or Chrome, iOS 15+');
  throw new Error('no webgl2');
}
function compile(type, src) {
  const s = gl.createShader(type);
  gl.shaderSource(s, src); gl.compileShader(s);
  if (!gl.getShaderParameter(s, gl.COMPILE_STATUS))
    throw new Error('shader: ' + gl.getShaderInfoLog(s));
  return s;
}
function makeProgram(vs, fs) {
  const pr = gl.createProgram();
  gl.attachShader(pr, compile(gl.VERTEX_SHADER, vs));
  gl.attachShader(pr, compile(gl.FRAGMENT_SHADER, fs));
  gl.linkProgram(pr);
  if (!gl.getProgramParameter(pr, gl.LINK_STATUS))
    throw new Error('link: ' + gl.getProgramInfoLog(pr));
  return pr;
}

const QUAD_VS =
'#version 300 es\n' +
'const vec2 v[3] = vec2[3](vec2(-1.,-1.), vec2(3.,-1.), vec2(-1.,3.));\n' +
'void main(){ gl_Position = vec4(v[gl_VertexID], 0.0, 1.0); }';

function fragSource(mapBody) {
  return `#version 300 es
precision highp float;
out vec4 frag;
uniform vec2 uRes;
uniform vec3 uEye;
uniform mat3 uCam;          // columns: right, up, forward
uniform float uFocal;
uniform vec4 uD[${MAXN * 3}];
uniform vec3 uTint;
uniform vec3 uSelTint;
// x*t + y: how close a ray has to get before it counts as a hit. Sphere
// tracing stops *near* the surface, not on it, so this is exactly how far
// proud of the real d=0 surface the picture is drawn. Loose while a finger
// is down, tight once the view settles.
uniform vec2 uHit;
// GLSL ES 3.0 has no default precision for sampler3D; it must be stated
precision highp sampler3D;
uniform sampler3D uField0;
uniform sampler3D uField1;
uniform sampler3D uField2;
uniform sampler3D uField3;

// How much of the *accumulated* side survives a smin/smax. The colour has to
// be mixed with the same weight the distance is, or the blue would sit off
// the blend instead of fading across it. Set by map(), read after the hit.
float gSel;
float wmin(float a, float b, float k){
  return (k <= 0.0) ? ((a < b) ? 1.0 : 0.0)
                    : clamp(0.5 + 0.5*(b - a)/k, 0.0, 1.0);
}
float wmax(float a, float b, float k){
  return (k <= 0.0) ? ((a > b) ? 1.0 : 0.0)
                    : clamp(0.5 - 0.5*(b - a)/k, 0.0, 1.0);
}

float smin(float a, float b, float k){
  if (k <= 0.0) return min(a, b);
  float h = clamp(0.5 + 0.5*(b - a)/k, 0.0, 1.0);
  return mix(b, a, h) - k*h*(1.0 - h);
}
float smax(float a, float b, float k){
  if (k <= 0.0) return max(a, b);
  float h = clamp(0.5 - 0.5*(b - a)/k, 0.0, 1.0);
  return mix(b, a, h) + k*h*(1.0 - h);
}
vec3 invRot(vec3 p, vec3 e){
  float c, s; vec3 q = p;
  c = cos(e.z); s = sin(e.z); q = vec3( c*q.x + s*q.y, -s*q.x + c*q.y, q.z);
  c = cos(e.y); s = sin(e.y); q = vec3( c*q.x - s*q.z, q.y, s*q.x + c*q.z);
  c = cos(e.x); s = sin(e.x); q = vec3( q.x, c*q.y + s*q.z, -s*q.y + c*q.z);
  return q;
}
${PRIM_KEYS.map(k => PRIMS[k].glsl).join('\n')}

float map(vec3 P){
  float d = 1e9, dB, di, w, sw = 0.0, swB = 0.0; vec3 q;
${mapBody}  gSel = sw;
  return d;
}

vec3 normalAt(vec3 p){
  // tetrahedron differences: 4 evaluations instead of 6
  const vec2 e = vec2(1.0, -1.0)*0.0015;
  return normalize(e.xyy*map(p + e.xyy) + e.yyx*map(p + e.yyx) +
                   e.yxy*map(p + e.yxy) + e.xxx*map(p + e.xxx));
}
float shadow(vec3 ro, vec3 rd, float tmax){
  float res = 1.0, t = 0.6;
  for (int i = 0; i < 48; i++){
    float h = map(ro + rd*t);
    res = min(res, 12.0*h/t);
    // smooth blends make map() an over-estimate, so creep along it
    t += clamp(h*0.7, 0.25, 4.0);
    if (res < 0.02 || t > tmax) break;
  }
  return clamp(res, 0.0, 1.0);
}
float ao(vec3 p, vec3 n){
  float occ = 0.0, sca = 1.0;
  for (int i = 0; i < 5; i++){
    float h = 0.4 + 1.6*float(i)/5.0;
    occ += (h - map(p + n*h))*sca;
    sca *= 0.7;
  }
  return clamp(1.0 - 0.9*occ, 0.0, 1.0);
}

void main(){
  vec2 uv = (gl_FragCoord.xy - 0.5*uRes)/uRes.y;
  vec3 rd = normalize(uCam*vec3(uv, uFocal));
  vec3 ro = uEye;

  // model
  float t = 0.0, tMax = 2000.0;
  bool hit = false;
  for (int i = 0; i < 260; i++){
    float d = map(ro + rd*t);
    if (d < uHit.x*t + uHit.y) { hit = true; break; }
    // neither smin nor the ellipsoid bound is a true distance: full steps
    // tunnel through thin blended shoulders and leave banding behind
    t += d*0.72;
    if (t > tMax) break;
  }
  // build plate at z = 0
  float tg = (rd.z < -1e-5) ? (-ro.z/rd.z) : -1.0;
  bool ground = tg > 0.0 && (!hit || tg < t);

  vec3 col;
  if (ground){
    vec3 p = ro + rd*tg;
    float fade = exp(-0.0022*tg);
    vec2 g = abs(fract(p.xy/10.0 + 0.5) - 0.5)/fwidth(p.xy/10.0);
    float minor = 1.0 - min(min(g.x, g.y), 1.0);
    vec2 G = abs(fract(p.xy/50.0 + 0.5) - 0.5)/fwidth(p.xy/50.0);
    float major = 1.0 - min(min(G.x, G.y), 1.0);
    col = mix(vec3(0.055, 0.070, 0.085), vec3(0.16, 0.20, 0.24), minor*0.55);
    col = mix(col, vec3(0.26, 0.32, 0.38), major*0.6);
    float sh = shadow(p + vec3(0.0, 0.0, 0.05), normalize(vec3(0.42, -0.5, 0.76)), 400.0);
    col *= mix(0.35, 1.0, sh)*fade;
    col = mix(vec3(0.063, 0.078, 0.094), col, fade);
  } else if (hit){
    vec3 p = ro + rd*t;
    vec3 n = normalAt(p);
    vec3 L1 = normalize(vec3(0.42, -0.5, 0.76));
    vec3 L2 = normalize(vec3(-0.6, 0.55, 0.25));
    float dif = max(dot(n, L1), 0.0)*0.78*mix(0.35, 1.0, shadow(p + n*0.05, L1, 400.0))
              + max(dot(n, L2), 0.0)*0.22;
    vec3 V = normalize(uEye - p);
    float spec = pow(max(dot(n, normalize(L1 + V)), 0.0), 40.0)*0.35;
    float amb = (0.30 + 0.12*n.z)*ao(p, n);
    // normalAt() ran map() four times, so re-read the field here for gSel
    map(p);
    vec3 base = mix(uTint, uSelTint, clamp(gSel, 0.0, 1.0));
    col = base*(amb + dif) + vec3(spec);
    col = pow(col, vec3(0.62));
  } else {
    col = mix(vec3(0.063, 0.078, 0.094), vec3(0.10, 0.12, 0.145),
              clamp(rd.z*1.6 + 0.4, 0.0, 1.0));
  }
  frag = vec4(col, 1.0);
}`;
}

const lineProg = makeProgram(
'#version 300 es\n' +
'layout(location=0) in vec3 aPos;\n' +
'uniform mat4 uMVP;\n' +
'void main(){ gl_Position = uMVP*vec4(aPos, 1.0); }',
'#version 300 es\n' +
'precision highp float;\n' +
'uniform vec3 uC;\n' +
'out vec4 frag;\n' +
'void main(){ frag = vec4(uC, 1.0); }');
const lineVAO = gl.createVertexArray();
gl.bindVertexArray(lineVAO);
const lineBuf = gl.createBuffer();
gl.bindBuffer(gl.ARRAY_BUFFER, lineBuf);
gl.enableVertexAttribArray(0);
gl.vertexAttribPointer(0, 3, gl.FLOAT, false, 0, 0);
gl.bindVertexArray(null);

const emptyVAO = gl.createVertexArray();
let prog = null, U = {};
const uData = new Float32Array(MAXN * 12);

function rebuildShader() {
  let body = '';
  const used = nodes.slice(0, MAXN);
  // uniform slots stay keyed to a shape's index in `nodes`, so a shape that
  // several bodies cut is emitted several times but packed only once
  const slot = new Map();
  used.forEach((n, i) => slot.set(n, i));
  buildPlan(used).forEach(part => {
    body += '  dB = 1e9; swB = 0.0;\n';
    part.nodes.forEach(n => {
      const i = slot.get(n);
      if (i === undefined) return;
      const b = 3 * i;
      body += '  q = P;\n';
      // mirror the *world* point, so a shape at x = 20 also appears at x = -20
      if (n.mx) body += '  q.x = abs(q.x);\n';
      if (n.my) body += '  q.y = abs(q.y);\n';
      if (n.mz) body += '  q.z = abs(q.z);\n';
      body += `  q = invRot(q - uD[${b}].xyz, uD[${b + 1}].xyz);\n`;
      body += PRIMS[n.t].baked
        ? `  di = pFieldS(uField${Math.min(n.fi || 0, MAXFIELDS - 1)}, q, `
          + `uD[${b + 2}].xyz, uD[${b + 1}].w);\n`
        : `  di = ${PRIMS[n.t].fn}(q, uD[${b + 2}].xyz, uD[${b + 1}].w);\n`;
      // weight first, then the distance: wmin/wmax need the pre-blend dB
      if (n.op === 'add') {
        body += `  w = wmin(dB, di, uD[${b}].w);\n`;
        body += `  dB = smin(dB, di, uD[${b}].w);\n`;
      } else if (n.op === 'cut') {
        body += `  w = wmax(dB, -di, uD[${b}].w);\n`;
        body += `  dB = smax(dB, -di, uD[${b}].w);\n`;
      } else {
        body += `  w = wmax(dB, di, uD[${b}].w);\n`;
        body += `  dB = smax(dB, di, uD[${b}].w);\n`;
      }
      body += `  swB = mix(uD[${b + 2}].w, swB, w);\n`;
    });
    // plain min: bodies must not blend, so the colour switches rather than fades
    body += '  if (dB < d) { d = dB; sw = swB; }\n';
  });
  if (!body) body = '  d = 1e9;\n';
  let np;
  try { np = makeProgram(QUAD_VS, fragSource(body)); }
  catch (e) { showErr(String(e.message).slice(0, 200)); return; }
  if (prog) gl.deleteProgram(prog);
  prog = np;
  U = {};
  for (const k of ['uRes', 'uEye', 'uCam', 'uFocal', 'uTint', 'uSelTint', 'uHit',
                 'uField0', 'uField1', 'uField2', 'uField3'])
    U[k] = gl.getUniformLocation(prog, k);
  U.uD = gl.getUniformLocation(prog, 'uD[0]');
  errbar.style.display = 'none';
}

// The field as a 3D texture, uploaded once and left on unit 0. A scene with
// no field still binds something: sampling an unbound sampler3D is undefined,
// and on some drivers it is a black screen rather than a warning.
let blankTex = null;
function bindField() {
  if (!blankTex) {
    blankTex = gl.createTexture();
    gl.bindTexture(gl.TEXTURE_3D, blankTex);
    gl.texStorage3D(gl.TEXTURE_3D, 1, gl.R8, 1, 1, 1);
    gl.texSubImage3D(gl.TEXTURE_3D, 0, 0, 0, 0, 1, 1, 1,
                     gl.RED, gl.UNSIGNED_BYTE, new Uint8Array([255]));
    for (const k of [gl.TEXTURE_MIN_FILTER, gl.TEXTURE_MAG_FILTER])
      gl.texParameteri(gl.TEXTURE_3D, k, gl.LINEAR);
  }
  for (let i = 0; i < MAXFIELDS; i++) {
    const f = SF.fields[i];
    if (f && !f.tex) {
      f.tex = gl.createTexture();
      gl.bindTexture(gl.TEXTURE_3D, f.tex);
      gl.pixelStorei(gl.UNPACK_ALIGNMENT, 1);
      // the grid is stored x-major (x*ny + y)*nz + z, which is exactly the
      // order texImage3D wants with width = nz, height = ny, depth = nx
      gl.texStorage3D(gl.TEXTURE_3D, 1, gl.R8, f.nz, f.ny, f.nx);
      gl.texSubImage3D(gl.TEXTURE_3D, 0, 0, 0, 0, f.nz, f.ny, f.nx,
                       gl.RED, gl.UNSIGNED_BYTE, f.data);
      for (const k of [gl.TEXTURE_MIN_FILTER, gl.TEXTURE_MAG_FILTER])
        gl.texParameteri(gl.TEXTURE_3D, k, gl.LINEAR);
      for (const k of [gl.TEXTURE_WRAP_S, gl.TEXTURE_WRAP_T, gl.TEXTURE_WRAP_R])
        gl.texParameteri(gl.TEXTURE_3D, k, gl.CLAMP_TO_EDGE);
    }
    gl.activeTexture(gl.TEXTURE0 + i);
    gl.bindTexture(gl.TEXTURE_3D, f ? f.tex : blankTex);
    gl.uniform1i(U['uField' + i], i);
  }
}

function packUniforms() {
  uData.fill(0);
  nodes.slice(0, MAXN).forEach((n, i) => {
    const b = 12 * i;
    uData[b] = n.p[0]; uData[b + 1] = n.p[1]; uData[b + 2] = n.p[2];
    uData[b + 3] = Math.max(n.k, 0);
    uData[b + 4] = n.r[0] * Math.PI / 180;
    uData[b + 5] = n.r[1] * Math.PI / 180;
    uData[b + 6] = n.r[2] * Math.PI / 180;
    uData[b + 7] = n.round || 0;
    uData[b + 8] = n.d[0]; uData[b + 9] = n.d[1]; uData[b + 10] = n.d[2];
    uData[b + 11] = picked.has(n) ? 1 : 0;   // spare slot: drives the blue
  });
}

// ---------- camera ----------
// One vertical field of view shared by the raymarcher, the line overlay and
// the drag-to-move maths — they disagree visibly if it is written out twice.
const FOV = 45 * Math.PI / 180;
const TAN_HALF_FOV = Math.tan(FOV / 2);
const cam = { yaw: -0.9, pitch: 0.45, dist: 150, tgt: [0, 0, 12] };
function camEye() {
  const cp = Math.cos(cam.pitch);
  return [cam.tgt[0] + cam.dist * cp * Math.cos(cam.yaw),
          cam.tgt[1] + cam.dist * cp * Math.sin(cam.yaw),
          cam.tgt[2] + cam.dist * Math.sin(cam.pitch)];
}
function camBasis() {
  const eye = camEye();
  let f = [cam.tgt[0] - eye[0], cam.tgt[1] - eye[1], cam.tgt[2] - eye[2]];
  const fl = Math.hypot(f[0], f[1], f[2]) || 1;
  f = [f[0] / fl, f[1] / fl, f[2] / fl];
  let r = [f[1], -f[0], 0];                   // f × worldUp(0,0,1)
  const rl = Math.hypot(r[0], r[1], r[2]) || 1;
  r = [r[0] / rl, r[1] / rl, 0];
  const u = [r[1] * f[2] - r[2] * f[1], r[2] * f[0] - r[0] * f[2],
             r[0] * f[1] - r[1] * f[0]];
  return { eye, r, u, f };
}
// The canvas runs full-bleed behind the bottom sheet, so the part of it you
// can actually see is only the band above the sheet — fit the model to that.
function visibleBand() {
  const w = canvas.clientWidth || innerWidth;
  const H = canvas.clientHeight || innerHeight;
  const pr = panel.getBoundingClientRect();
  const overlaps = pr.left < w - 1 && pr.top < H;      // false on the desktop rail
  const hidden = overlaps ? Math.min(Math.max(H - pr.top, 0), H * 0.8) : 0;
  return { w, H, h: H - hidden, hidden };
}
function frameModel() {
  const B = sceneBounds(shownNodes());
  if (!B) { cam.tgt = [0, 0, 12]; cam.dist = 150; needDraw(); return; }
  cam.tgt = [(B.lo[0] + B.hi[0]) / 2, (B.lo[1] + B.hi[1]) / 2,
             (B.lo[2] + B.hi[2]) / 2];
  // bounding sphere, so the fit holds at every orbit angle
  const R = Math.max(0.5 * Math.hypot(B.hi[0] - B.lo[0], B.hi[1] - B.lo[1],
                                      B.hi[2] - B.lo[2]), 5);
  const V = visibleBand();
  // the projection maps the whole canvas height to 2*dist*tan(fov/2); a band
  // of p pixels therefore shows 2*dist*tan(fov/2)*p/H of world
  const fit = Math.min(V.h, V.w);
  cam.dist = Math.min(Math.max(1.1 * R * V.H / (TAN_HALF_FOV * fit), 30), 2000);
  // and push the model up into that band instead of the canvas centre
  if (V.hidden > 1) {
    const { u } = camBasis();
    const mmPerPx = 2 * cam.dist * TAN_HALF_FOV / V.H;
    const shift = V.hidden / 2 * mmPerPx;
    for (let a = 0; a < 3; a++) cam.tgt[a] -= u[a] * shift;
  }
  needDraw();
}

// ---------- matrices for the selection box ----------
function mvpMatrix(aspect) {
  const { eye, r, u, f } = camBasis();
  const near = 1, far = 4000;
  const t = 1 / TAN_HALF_FOV;
  // view = R^T * translate(-eye), with -f as the camera's +Z
  const V = [
    r[0], u[0], -f[0], 0,
    r[1], u[1], -f[1], 0,
    r[2], u[2], -f[2], 0,
    -(r[0] * eye[0] + r[1] * eye[1] + r[2] * eye[2]),
    -(u[0] * eye[0] + u[1] * eye[1] + u[2] * eye[2]),
     (f[0] * eye[0] + f[1] * eye[1] + f[2] * eye[2]), 1];
  const P = [t / aspect, 0, 0, 0, 0, t, 0, 0,
             0, 0, (far + near) / (near - far), -1,
             0, 0, 2 * far * near / (near - far), 0];
  const M = new Float32Array(16);
  for (let c = 0; c < 4; c++)
    for (let rr = 0; rr < 4; rr++) {
      let s = 0;
      for (let k = 0; k < 4; k++) s += P[k * 4 + rr] * V[c * 4 + k];
      M[c * 4 + rr] = s;
    }
  return M;
}
function selectionLines(n) {
  if (!n || PRIMS[n.t].infinite) return null;
  const h = PRIMS[n.t].ext(n.d).map(v => v + (n.round || 0));
  const e = n.r.map(v => v * Math.PI / 180);
  const c = e.map(Math.cos), s = e.map(Math.sin);
  const rot = v => {
    let x = v[0], y = c[0] * v[1] - s[0] * v[2], z = s[0] * v[1] + c[0] * v[2];
    const x2 = c[1] * x + s[1] * z; z = -s[1] * x + c[1] * z; x = x2;
    return [c[2] * x - s[2] * y, s[2] * x + c[2] * y, z];
  };
  const E = [[0,1],[1,3],[3,2],[2,0],[4,5],[5,7],[7,6],[6,4],
             [0,4],[1,5],[2,6],[3,7]];
  const out = [];
  const signs = [[1,1,1]];
  if (n.mx) signs.push(...signs.map(v => [-v[0], v[1], v[2]]));
  if (n.my) signs.push(...signs.map(v => [v[0], -v[1], v[2]]));
  if (n.mz) signs.push(...signs.map(v => [v[0], v[1], -v[2]]));
  for (const sg of signs) {
    const corners = [];
    for (let i = 0; i < 8; i++) {
      const v = rot([(i & 1 ? 1 : -1) * h[0], (i & 2 ? 1 : -1) * h[1],
                     (i & 4 ? 1 : -1) * h[2]]);
      corners.push([sg[0] * (v[0] + n.p[0]), sg[1] * (v[1] + n.p[1]),
                    sg[2] * (v[2] + n.p[2])]);
    }
    for (const [a, b] of E) out.push(...corners[a], ...corners[b]);
  }
  return new Float32Array(out);
}

// one box per selected shape
function selectionOutlines() {
  const parts = [];
  for (const n of picked) {
    if (!n.on) continue;
    const l = selectionLines(n);
    if (l && l.length) parts.push(l);
  }
  if (!parts.length) return null;
  const total = parts.reduce((a, p) => a + p.length, 0);
  const out = new Float32Array(total);
  let at = 0;
  for (const p of parts) { out.set(p, at); at += p.length; }
  return out;
}

// ---------- draw loop: full res when idle, coarse while a finger is down ----
let pending = false, interacting = false, idleTimer = 0;
function needDraw() {
  if (pending) return;
  pending = true;
  requestAnimationFrame(draw);
}
function markInteracting() {
  interacting = true;
  clearTimeout(idleTimer);
  idleTimer = setTimeout(() => { interacting = false; needDraw(); }, 180);
  needDraw();
}
function draw() {
  pending = false;
  if (!prog) return;
  const dpr = Math.min(devicePixelRatio || 1, 2);
  const scale = interacting ? 0.55 : 1;
  const cw = canvas.clientWidth || innerWidth, ch = canvas.clientHeight || innerHeight;
  const w = Math.max(1, Math.round(cw * dpr * scale));
  const h = Math.max(1, Math.round(ch * dpr * scale));
  if (canvas.width !== w || canvas.height !== h) { canvas.width = w; canvas.height = h; }
  gl.viewport(0, 0, w, h);
  gl.disable(gl.DEPTH_TEST);

  const { eye, r, u, f } = camBasis();
  packUniforms();
  gl.useProgram(prog);
  gl.uniform2f(U.uRes, w, h);
  gl.uniform3f(U.uEye, eye[0], eye[1], eye[2]);
  gl.uniformMatrix3fv(U.uCam, false,
    new Float32Array([r[0], r[1], r[2], u[0], u[1], u[2], f[0], f[1], f[2]]));
  gl.uniform1f(U.uFocal, 0.5 / TAN_HALF_FOV);
  gl.uniform3f(U.uTint, 0.91, 0.53, 0.22);
  gl.uniform3f(U.uSelTint, 0.24, 0.60, 0.95);
  // the settled picture is worth matching the STL; the dragged one is not
  bindField();
  if (interacting) gl.uniform2f(U.uHit, 0.0015, 0.004);
  else             gl.uniform2f(U.uHit, 0.0004, 0.002);
  gl.uniform4fv(U.uD, uData);
  gl.bindVertexArray(emptyVAO);
  gl.drawArrays(gl.TRIANGLES, 0, 3);

  const lines = selectionOutlines();
  if (lines && lines.length) {
    gl.useProgram(lineProg);
    gl.bindVertexArray(lineVAO);
    gl.bindBuffer(gl.ARRAY_BUFFER, lineBuf);
    gl.bufferData(gl.ARRAY_BUFFER, lines, gl.DYNAMIC_DRAW);
    gl.uniformMatrix4fv(gl.getUniformLocation(lineProg, 'uMVP'), false,
                        mvpMatrix(w / h));
    gl.uniform3f(gl.getUniformLocation(lineProg, 'uC'), 0.37, 0.78, 0.94);
    gl.drawArrays(gl.LINES, 0, lines.length / 3);
  }
  gl.bindVertexArray(null);
}
addEventListener('resize', () => needDraw());

// ======================================================================
// pointer input — one finger orbits (or moves the shape in Move mode),
// two fingers pinch-zoom and pan
// ======================================================================
let mode = 'orbit';
const pts = new Map();
let last1 = null, lastPinch = 0, lastMid = null;

function screenAxes() {
  const { r, u } = camBasis();
  // mm per pixel at the orbit target, for a 45° vertical fov
  const s = 2 * cam.dist * TAN_HALF_FOV / (canvas.clientHeight || innerHeight);
  return { r, u, s };
}
// Move drags the whole selection, which is the point of being able to make one
function moveSelected(dx, dy, dz) {
  if (!picked.size) return;
  translateSelection(dx, dy, dz);
  refreshInspectorValues();
  save(); scheduleInfo();
}
canvas.addEventListener('pointerdown', e => {
  canvas.setPointerCapture(e.pointerId);
  pts.set(e.pointerId, [e.clientX, e.clientY]);
  if (pts.size === 1) { last1 = [e.clientX, e.clientY]; if (mode === 'grab') snapshot(); }
  else { last1 = null; lastPinch = 0; lastMid = null; }
});
canvas.addEventListener('pointermove', e => {
  if (!pts.has(e.pointerId)) return;
  pts.set(e.pointerId, [e.clientX, e.clientY]);
  const P = [...pts.values()];
  if (P.length === 1 && last1) {
    const dx = e.clientX - last1[0], dy = e.clientY - last1[1];
    last1 = [e.clientX, e.clientY];
    if (mode === 'grab') {
      const { r, u, s } = screenAxes();
      moveSelected((r[0] * dx - u[0] * dy) * s, (r[1] * dx - u[1] * dy) * s,
                   (r[2] * dx - u[2] * dy) * s);
    } else {
      cam.yaw -= dx * 0.006;
      cam.pitch = Math.min(Math.max(cam.pitch + dy * 0.006, -1.45), 1.45);
    }
  } else if (P.length >= 2) {
    const d = Math.hypot(P[0][0] - P[1][0], P[0][1] - P[1][1]);
    const mid = [(P[0][0] + P[1][0]) / 2, (P[0][1] + P[1][1]) / 2];
    if (lastPinch && d) cam.dist = Math.min(Math.max(cam.dist * lastPinch / d, 8), 2000);
    if (lastMid) {
      const dx = mid[0] - lastMid[0], dy = mid[1] - lastMid[1];
      const { r, u, s } = screenAxes();
      if (mode === 'grab' && picked.size) {
        // two fingers in Move mode raise/lower along the build direction
        moveSelected(0, 0, -dy * s);
      } else {
        cam.tgt[0] -= (r[0] * dx - u[0] * dy) * s;
        cam.tgt[1] -= (r[1] * dx - u[1] * dy) * s;
        cam.tgt[2] -= (r[2] * dx - u[2] * dy) * s;
      }
    }
    lastPinch = d; lastMid = mid;
  }
  markInteracting();
});
function endPtr(e) {
  pts.delete(e.pointerId);
  const P = [...pts.values()];
  last1 = P.length === 1 ? P[0] : null;
  if (P.length < 2) { lastPinch = 0; lastMid = null; }
  markInteracting();
}
canvas.addEventListener('pointerup', endPtr);
canvas.addEventListener('pointercancel', endPtr);
canvas.addEventListener('wheel', e => {
  e.preventDefault();
  cam.dist = Math.min(Math.max(cam.dist * Math.exp(e.deltaY * 0.0012), 8), 2000);
  markInteracting();
}, { passive: false });
// iOS fires these on double-tap zoom attempts over the canvas
document.addEventListener('gesturestart', e => e.preventDefault());
document.addEventListener('dblclick', e => e.preventDefault());

const statusEl = $('status'), infoEl = $('info'), hintEl = $('hint');
const fmt = v => (Math.abs(v) < 100 ? (Math.round(v * 10) / 10).toFixed(1)
                                    : Math.round(v).toString());

function setStatus(s) { statusEl.textContent = s; }
function setHint() {

// ---------- baked library ----------
function renderBaked() {
  const box = $('baked');
  box.innerHTML = '';
  SF.fields.forEach((f, i) => {
    const used = nodes.filter(n => PRIMS[n.t].baked && n.fi === i).length;
    const el = document.createElement('div');
    el.className = 'node body' + (i === activeField ? ' sel' : '');
    el.innerHTML =
      `<span class="nm">${f.name}</span>` +
      `<span class="bd">${f.nx}\u00d7${f.ny}\u00d7${f.nz}</span>` +
      `<button class="ic" data-act="place" title="Place one">\uff0b</button>` +
      `<button class="ic" data-act="rename">\u270e</button>` +
      `<button class="ic" data-act="del" title="${used ? used + ' in use' : ''}">\u2715</button>`;
    el.onclick = ev => {
      const act = ev.target.dataset && ev.target.dataset.act;
      if (act === 'place') {
        if (nodes.length >= MAXN) { showErr('Shape limit is ' + MAXN); return; }
        snapshot();
        const c = makeNode('field', { fi: i, b: activeBody, p: [0, 0, f.box[2]],
                                      d: f.box.slice(), round: f.range });
        nodes.push(c);
        sel = nodes.length - 1; picked = new Set([c]);
      } else if (act === 'rename') {
        renameField(f); return;
      } else if (act === 'del') {
        if (used) { showErr(`${used} shape(s) still use ${f.name}`); return; }
        snapshot();
        if (f.tex) gl.deleteTexture(f.tex);
        SF.fields.splice(i, 1);
        // instances after it shift down with it
        for (const n of nodes)
          if (PRIMS[n.t].baked && n.fi > i) n.fi--;
        activeField = Math.max(0, Math.min(activeField, SF.fields.length - 1));
      } else activeField = i;
      rebuildShader(); renderList(); renderInspector(); save(); needDraw();
    };
    box.appendChild(el);
  });
  $('bakedCount').textContent = SF.fields.length
    ? SF.fields.length + '/' + MAXFIELDS : '';
}

function renameField(f) {
  openModal('Rename baked shape',
    `<input id="bnm" type="text" maxlength="24" value="${f.name.replace(/"/g, '&quot;')}">` +
    '<div class="bar" style="margin-top:10px"><button class="btn" id="bok">Rename</button></div>',
    () => {
      const inp = $('bnm'); inp.focus(); inp.select();
      const go = () => {
        const v = inp.value.trim();
        if (v) { snapshot(); f.name = v; f.b64 = null; }
        closeModal(); renderList(); save();
      };
      $('bok').onclick = go;
      inp.onkeydown = e => { if (e.key === 'Enter') go(); };
    });
}

$('bakeBtn').onclick = () => {
  const res = parseFloat(prompt(
    'Grid spacing in mm for the bake.\n\nFiner is truer but the document '
    + 'grows as the cube of it.', '0.8') || '0');
  if (!(res > 0.05)) return;
  try {
    snapshot();
    const id = activeBody;
    const r = bakeBody(id, res);
    // The body's shapes are replaced by the one baked shape. Its cuts were
    // baked in too, so a cut that reached nothing but this body has done its
    // work and goes; one that also reaches a body still standing has to stay,
    // and will simply find nothing left to do here.
    const live = new Set(bodies.map(x => x.id));
    const spent = n => n.op === 'add'
      ? n.b === id
      : (n.tg ? n.tg.every(t => t === id)
              : [...live].every(t => t === id));
    const gone = new Set(nodes.filter(spent));
    nodes = nodes.filter(n => !gone.has(n));
    const c = makeNode('field', { fi: r.fi, b: id, p: r.centre,
                                  d: r.box.slice(), round: r.range });
    nodes.push(c);
    sel = nodes.indexOf(c); picked = new Set([c]);
    activeField = r.fi;
    syncBodies(); syncPicked();
    rebuildShader(); renderList(); renderInspector(); save(); needDraw();
  } catch (e) { undo(); showErr('bake: ' + e.message); }
};

// ---------- body list ----------
// The whole point of a body is that it is a thing you work on, so it needs to
// be visible without hunting through the shapes: what exists, which one you
// are building into, and a way to get the others out of the way.
function renderBodies() {
  const box = $('bodies');
  box.innerHTML = '';
  bodies.forEach(b => {
    const el = document.createElement('div');
    const count = bodyShapeCount(b.id);
    el.className = 'node body' + (b.id === activeBody ? ' sel' : '') +
                   (b.on === false ? ' off' : '');
    el.innerHTML =
      `<button class="ic" data-act="show">${b.on === false ? '○' : '●'}</button>` +
      `<span class="nm">${b.name}</span>` +
      `<span class="bd">${count} shape${count === 1 ? '' : 's'}</span>` +
      `<button class="ic" data-act="rename">✎</button>` +
      (bodies.length > 1 ? `<button class="ic" data-act="del">✕</button>` : '');
    el.onclick = ev => {
      const act = ev.target.dataset && ev.target.dataset.act;
      if (act === 'show') {
        snapshot(); b.on = b.on === false;
      } else if (act === 'rename') {
        renameBody(b); return;
      } else if (act === 'del') {
        snapshot();
        nodes = nodes.filter(n => !(n.op === 'add' && n.b === b.id));
        bodies = bodies.filter(x => x.id !== b.id);
        sel = Math.max(0, Math.min(sel, nodes.length - 1));
        syncBodies(); syncPicked();
      } else {
        // the body browser is the way to select a body: everything it is
        // made of, its own shapes and the cuts that reach them
        activeBody = b.id;
        pickBody(b.id);
      }
      rebuildShader(); renderList(); renderInspector(); save(); needDraw();
    };
    box.appendChild(el);
  });
  $('bodyCount').textContent = bodies.length;
}

function renameBody(b) {
  openModal('Rename body',
    `<input id="bnm" type="text" maxlength="24" value="${b.name.replace(/"/g, '&quot;')}">` +
    '<div class="bar" style="margin-top:10px"><button class="btn" id="bok">Rename</button></div>',
    () => {
      const inp = $('bnm');
      inp.focus(); inp.select();
      const go = () => {
        const v = inp.value.trim();
        if (v) { snapshot(); b.name = v; }
        closeModal();
        renderList(); renderInspector(); save();
      };
      $('bok').onclick = go;
      inp.onkeydown = e => { if (e.key === 'Enter') go(); };
    });
}

$('addBodyBtn').onclick = () => {

// ---------- shape list ----------
function renderList() {
  const box = $('nodes');
  box.innerHTML = '';
  nodes.forEach((n, i) => {
    const el = document.createElement('div');
    // shapes outside the body you are working on stay legible but step back
    const elsewhere = bodies.length > 1 &&
      (n.op === 'add' ? n.b !== activeBody : !hits(n, activeBody));
    el.className = 'node' + (picked.has(n) ? ' pick' : '') +
                   (i === sel && picked.has(n) ? ' sel' : '') +
                   (n.on ? '' : ' off') + (elsewhere ? ' away' : '');
    const opCls = n.op === 'cut' ? 'cut' : n.op === 'keep' ? 'keep' : '';
    // a one-body model reads exactly as it did before bodies existed
    const badge = bodies.length < 2 ? ''
      : `<span class="bd">${n.op === 'add' ? bodyName(n.b)
          : !n.tg ? 'all'
          : n.tg.length ? n.tg.map(bodyName).join('·')
          : 'none'}</span>`;
    el.innerHTML =
      `<button class="ic" data-act="on">${n.on ? '●' : '○'}</button>` +
      `<span class="nm">${PRIMS[n.t].name}</span>` +
      badge +
      `<span class="op ${opCls}">${OPS.find(o => o[0] === n.op)[1]}</span>` +
      `<button class="ic" data-act="up">▲</button>` +
      `<button class="ic" data-act="down">▼</button>`;
    el.onclick = ev => {
      const act = ev.target.dataset && ev.target.dataset.act;
      if (act === 'on') { snapshot(); n.on = !n.on; rebuildShader(); }
      else if (act === 'up' && i > 0) {
        snapshot(); nodes.splice(i - 1, 0, nodes.splice(i, 1)[0]);
        sel = i - 1; rebuildShader();
      } else if (act === 'down' && i < nodes.length - 1) {
        snapshot(); nodes.splice(i + 1, 0, nodes.splice(i, 1)[0]);
        sel = i + 1; rebuildShader();
      } else {
        // picking a shape also moves you into its body, so the next shape you
        // add lands where you are looking
        pickShape(n);
      }
      renderList(); renderInspector(); save(); needDraw();
    };
    box.appendChild(el);
  });
  $('nodeCount').textContent = nodes.length + '/' + MAXN;
  $('selHint').textContent = picked.size > 1
    ? picked.size + ' selected · Place moves and turns them as one'
    : picked.size ? '1 selected'
    : 'Nothing selected · tap a shape, or a body above';
  renderBodies();
  renderBaked();
  scheduleInfo();
}

// ---------- one slider row ----------
function sliderRow(label, unit, get, set, min, max, step) {
  const row = document.createElement('div');
  row.className = 'row';
  row.innerHTML =
    `<label><span>${label}</span><b></b></label>` +
    `<div class="slide"><button class="step">−</button>` +
    `<input type="range" min="${min}" max="${max}" step="${step}">` +
    `<button class="step">＋</button></div>`;
  const out = row.querySelector('b'), inp = row.querySelector('input');
  const [minus, plus] = row.querySelectorAll('.step');
  const show = () => {
    const v = get();
    out.textContent = fmt(v) + unit;
    if (document.activeElement !== inp) inp.value = v;
  };
  let touched = false;
  const commit = v => {
    if (!touched) { snapshot(); touched = true; }
    set(Math.min(Math.max(v, min), max));
    show(); save(); needDraw(); scheduleInfo();
  };
  inp.addEventListener('input', () => { commit(parseFloat(inp.value)); markInteracting(); });
  inp.addEventListener('change', () => { touched = false; needDraw(); });
  const bump = s => () => {
    // round to the step grid, then to 4 places so 0.1 steps stay 0.1
    commit(parseFloat((Math.round((get() + s * step) / step) * step).toFixed(4)));
    touched = false;
  };
  minus.onclick = bump(-1); plus.onclick = bump(1);
  row.refresh = show;
  show();
  return row;
}

// ---------- body controls ----------
function chipRow(label, hint) {
  const row = document.createElement('div');
  row.className = 'row';
  row.innerHTML = `<label><span>${label}</span></label>`;
  const box = document.createElement('div');
  box.className = 'toggles';
  row.appendChild(box);
  if (hint) {
    const p = document.createElement('p');
    p.style.cssText = 'color:var(--dim);font-size:11.5px;margin:6px 0 0';
    p.textContent = hint;
    row.appendChild(p);
  }
  row.box = box;
  return row;
}
function chip(text, on, fn) {
  const b = document.createElement('button');
  b.className = 'btn sm' + (on ? ' on' : '');
  b.textContent = text;
  b.onclick = () => {
    snapshot(); fn();
    syncBodies();
    rebuildShader(); renderList(); renderInspector(); save(); needDraw();
  };
  return b;
}

// Which body this shape builds. Everything an `add` does — its blend above
// all — stays inside the body it belongs to.
function bodyRow(n) {
  const row = chipRow('Body');
  bodies.forEach(b => row.box.appendChild(
    chip(b.name, n.b === b.id, () => { n.b = b.id; activeBody = b.id; })));
  row.box.appendChild(chip('＋ New body', false,
    () => { n.b = addBody(); activeBody = n.b; }));
  return row;
}

// Which bodies this cut/keep reaches. "All bodies" also covers bodies made
// later, which is what the build-plate cut wants.
function targetRow(n) {
  const none = n.tg && !n.tg.length;
  const row = chipRow('Applies to', none
    ? 'No bodies left to cut — this shape does nothing. Pick one, or All.'
    : bodies.length < 2
      ? 'Add a second body to a shape above to aim this cut at one of them.'
      : '');
  row.box.appendChild(chip('All bodies', !n.tg, () => n.tg = null));
  bodies.forEach(b => {
    const on = !!n.tg && n.tg.indexOf(b.id) >= 0;
    row.box.appendChild(chip(b.name, on, () => {
      if (!n.tg) { n.tg = [b.id]; return; }      // All -> just this one
      const at = n.tg.indexOf(b.id);
      if (at < 0) n.tg.push(b.id);
      else if (n.tg.length > 1) n.tg.splice(at, 1);
      else n.tg = null;                          // last one off -> back to All
    }));
  });
  return row;
}

let inspectorRows = [];
function refreshInspectorValues() {
  inspectorRows.forEach(r => r.refresh && r.refresh());
  needDraw();
}

function renderInspector() {
  const host = $('inspector');
  host.innerHTML = '';
  inspectorRows = [];
  const n = primaryNode();
  if (!n) {
    const p = document.createElement('p');
    p.style.cssText = 'color:var(--dim);font-size:12px;margin:16px 0';
    p.textContent = 'Nothing selected. Tap a shape to edit it.';
    host.appendChild(p);
    scheduleInfo();
    return;
  }
  const P = PRIMS[n.t];
  const add = el => { host.appendChild(el); if (el.refresh) inspectorRows.push(el); };

  const h = document.createElement('h3');
  // with several picked, Move drags them all but the sliders edit this one
  h.textContent = picked.size > 1
    ? `Editing 1 of ${picked.size} selected` : 'Selected shape';
  host.appendChild(h);

  // type
  const typeRow = document.createElement('div');
  typeRow.className = 'row';
  typeRow.innerHTML = '<label><span>Type</span></label>';
  const selEl = document.createElement('select');
  PRIM_KEYS.forEach(k => {
    const o = document.createElement('option');
    o.value = k; o.textContent = PRIMS[k].name; o.selected = k === n.t;
    selEl.appendChild(o);
  });
  selEl.onchange = () => {
    snapshot();
    n.t = selEl.value;
    n.d = PRIMS[n.t].def.slice();
    rebuildShader(); renderList(); renderInspector(); save(); needDraw();
  };
  typeRow.appendChild(selEl);

  // op
  const opRow = document.createElement('div');
  opRow.className = 'row';
  opRow.innerHTML = '<label><span>Operation</span></label>';
  const seg = document.createElement('div');
  seg.className = 'seg';
  OPS.forEach(([k, lbl]) => {
    const b = document.createElement('button');
    b.textContent = lbl; b.className = n.op === k ? 'on' : '';
    b.style.flex = '1';
    b.onclick = () => {
      snapshot(); n.op = k;
      syncBodies();   // an add turned into a cut can strand its old body
      rebuildShader(); renderList(); renderInspector(); save(); needDraw();
    };
    seg.appendChild(b);
  });
  opRow.appendChild(seg);
  host.appendChild(opRow);

  host.appendChild(n.op === 'add' ? bodyRow(n) : targetRow(n));

  add(sliderRow('Blend', ' mm', () => n.k, v => n.k = v, 0, 25, 0.25));

  P.dims.forEach(([lbl, mn, mx, st], i) =>
    add(sliderRow(lbl, dimUnit(n.t, i), () => n.d[i], v => n.d[i] = v, mn, mx, st)));
  if (P.round)
    add(sliderRow('Corner round', ' mm', () => n.round, v => n.round = v, 0, 20, 0.25));

  // With several shapes picked, Place drives the whole selection as one rigid
  // piece: the slider still reads this shape's value, but what it applies is
  // the *change* — translated straight through, or turned about the group's
  // centre. The size and blend rows stay on this shape alone, since there is
  // no sensible way to resize a mixed bag of primitives together.
  const group = picked.size > 1;
  const ph = document.createElement('h3');
  ph.textContent = group ? `Place — ${picked.size} as one` : 'Place';
  host.appendChild(ph);
  ['X', 'Y', 'Z'].forEach((ax, i) =>
    add(sliderRow('Position ' + ax, ' mm', () => n.p[i],
      group ? v => {
        const d = [0, 0, 0];
        d[i] = v - n.p[i];
        translateSelection(d[0], d[1], d[2]);
        refreshInspectorValues();
      } : v => n.p[i] = v,
      -150, 150, 0.5)));
  ['X', 'Y', 'Z'].forEach((ax, i) =>
    add(sliderRow('Rotate ' + ax, '°', () => n.r[i],
      group ? v => { rotateSelection(i, v - n.r[i]); refreshInspectorValues(); }
            : v => n.r[i] = v,
      -180, 180, 1)));
  // Scale has no absolute to read back -- there is no "size" of a mixed bag
  // of shapes -- so the row carries a running factor and applies the ratio
  // between readings. It resets to 1 whenever the selection changes.
  add(sliderRow('Scale', '\u00d7', scaleFactor,
    v => {
      scaleSelection(v / scaleFactor());
      scaleShown = v;
      refreshInspectorValues();
    }, 0.2, 4, 0.01));

  const mr = document.createElement('div');
  mr.className = 'row';
  mr.innerHTML = '<label><span>Mirror</span></label>';
  const tg = document.createElement('div');
  tg.className = 'toggles';
  [['mx', 'X'], ['my', 'Y'], ['mz', 'Z']].forEach(([key, lbl]) => {
    const b = document.createElement('button');
    b.className = 'btn sm' + (n[key] ? ' on' : '');
    b.textContent = 'Mirror ' + lbl;
    b.onclick = () => {
      snapshot(); n[key] = !n[key];
      rebuildShader(); renderInspector(); save(); needDraw();
    };
    tg.appendChild(b);
  });
  mr.appendChild(tg);
  host.appendChild(mr);
  scheduleInfo();
}

// The add-shape AABB is what the mesher sweeps, but it ignores every cut, so
// it is a poor size readout. Probe the real field on a coarse grid instead.
function probeSize(B) {
  const span = Math.max(B.hi[0] - B.lo[0], B.hi[1] - B.lo[1],
                        B.hi[2] - B.lo[2], 1);
  const cell = span / 32;
  const N = a => Math.max(2, Math.min(56,
                 Math.ceil((B.hi[a] - B.lo[a]) / cell) + 1));
  const n = [N(0), N(1), N(2)];
  const d = [0, 1, 2].map(a => (B.hi[a] - B.lo[a]) / (n[a] - 1));
  const live = buildPlan(nodes);
  const lo = [1e9, 1e9, 1e9], hi = [-1e9, -1e9, -1e9];
  // For each of the six extremes keep the *deepest* sample in that outermost
  // slab, not the first one found: bisecting from a thin corner of the slab
  // lands short of the real surface, bisecting from the thick middle doesn't.
  const at = [null, null, null, null, null, null];
  const deep = [0, 0, 0, 0, 0, 0];
  let any = false;
  for (let i = 0; i < n[0]; i++) {
    const x = B.lo[0] + i * d[0];
    for (let j = 0; j < n[1]; j++) {
      const y = B.lo[1] + j * d[1];
      for (let k = 0; k < n[2]; k++) {
        const z = B.lo[2] + k * d[2];
        const v = sceneSDF(live, x, y, z);
        if (v >= 0) continue;
        any = true;
        const P = [x, y, z];
        for (let a = 0; a < 3; a++) {
          if (P[a] < lo[a] || (P[a] === lo[a] && v < deep[2 * a])) {
            lo[a] = P[a]; at[2 * a] = P; deep[2 * a] = v;
          }
          if (P[a] > hi[a] || (P[a] === hi[a] && v < deep[2 * a + 1])) {
            hi[a] = P[a]; at[2 * a + 1] = P; deep[2 * a + 1] = v;
          }
        }
      }
    }
  }
  if (!any) return null;
  // the grid only brackets each extreme to half a cell — walk the last
  // inside point outward by bisection to land on the surface itself
  const walk = (P, a, limit) => {
    let ins = P[a], out = limit;
    const q = P.slice();
    for (let it = 0; it < 20; it++) {
      const m = 0.5 * (ins + out);
      q[a] = m;
      if (sceneSDF(live, q[0], q[1], q[2]) < 0) ins = m; else out = m;
    }
    return ins;
  };
  for (let a = 0; a < 3; a++) {
    lo[a] = walk(at[2 * a], a, B.lo[a]);
    hi[a] = walk(at[2 * a + 1], a, B.hi[a]);
  }
  return { lo, hi, cell: d };
}

let infoTimer = 0;
function scheduleInfo() {
  clearTimeout(infoTimer);
  infoTimer = setTimeout(updateInfo, 160);
}
function updateInfo() {
  clearTimeout(infoTimer);
  const B = sceneBounds(shownNodes());
  if (!B) { infoEl.textContent = 'Nothing to print yet — add a shape.'; return; }
  const res = parseFloat($('resInp').value);
  const vox = Math.ceil((B.hi[0] - B.lo[0]) / res + 5) *
              Math.ceil((B.hi[1] - B.lo[1]) / res + 5) *
              Math.ceil((B.hi[2] - B.lo[2]) / res + 5);
  const P = probeSize(B);
  if (!P) {
    infoEl.innerHTML = '<span style="color:var(--note)">Everything is cut ' +
      'away — nothing solid left.</span>';
    return;
  }
  const sz = [0, 1, 2].map(a => P.hi[a] - P.lo[a]);
  const under = P.lo[2] < -P.cell[2];
  infoEl.innerHTML =
    `Size ≈ ${sz.map(v => v.toFixed(1)).join(' × ')} mm` +
    (under ? ' · <span style="color:var(--note)">reaches below the plate — ' +
      'a Plane cut at z 0 gives it a flat base</span>' : '') +
    `<br>STL grid ≈ ${(vox / 1e6).toFixed(1)} M voxels` +
    (vox > 12e6 ? ' <span style="color:var(--note)">(coarsen it on a phone)</span>'
                : '');
}

// ---------- add / duplicate / delete ----------
$('addBtn').onclick = () => {
  openModal('Add a shape',
    `<div class="picker">${PRIM_KEYS.filter(k => !PRIMS[k].baked || SF.fields.length)
      .map(k =>
      `<button data-prim="${k}">${PRIMS[k].name}</button>`).join('')}</div>`,
    card => {
      card.onclick = e => {
        const b = e.target.closest('button[data-prim]');
        if (!b) return;
        if (nodes.length >= MAXN) { showErr('Shape limit is ' + MAXN); closeModal(); return; }
        snapshot();
        const fresh = makeNode(b.dataset.prim);
        // a field node carries no dimensions of its own: its box and its
        // quantisation range come from the document's baked grid
        if (PRIMS[fresh.t].baked && SF.fields.length) {
          fresh.fi = Math.min(activeField, SF.fields.length - 1);
          fresh.d = SF.fields[fresh.fi].box.slice();
          fresh.round = SF.fields[fresh.fi].range;
        }
        fresh.b = activeBody;      // build into the body you are standing in
        nodes.push(fresh);
        sel = nodes.length - 1;
        if (selMode === 'single') picked = new Set();
        picked.add(fresh);
        closeModal();
        rebuildShader(); renderList(); renderInspector(); save(); needDraw();
      };
    });
};
const clone = n => JSON.parse(JSON.stringify(n));
const nudge = c => { c.p[0] = Math.min(c.p[0] + 10, 150); return c; };

$('dupBtn').onclick = () => {
  if (!picked.size) return;
  const src = nodes.filter(n => picked.has(n));    // in list order

  // one shape: copy it beside itself, in the body it already belongs to
  if (src.length === 1) {
    if (nodes.length >= MAXN) { showErr('Shape limit is ' + MAXN); return; }
    snapshot();
    const c = nudge(clone(src[0]));
    nodes.splice(sel + 1, 0, c);
    sel++;
    resetPicked();
    rebuildShader(); renderList(); renderInspector(); save(); needDraw();
    return;
  }

  // several: this is a body being copied, so the copies become a body of
  // their own — dropping them into the source body would just bury them
  // inside the shape they were copied from.
  const from = [...new Set(src.filter(n => n.op === 'add').map(n => n.b))];
  if (!from.length) { showErr('Nothing to duplicate — no shapes, only cuts'); return; }

  // A cut that named only bodies being copied comes along, repointed at the
  // copies. One that was already global reaches the new bodies anyway, so
  // copying it would just double up; one that also names a body staying put
  // would have the copy cutting the original, so neither is brought over.
  const carried = src.filter(n =>
    n.op === 'add' || (n.tg && n.tg.length && n.tg.every(t => from.includes(t))));
  if (nodes.length + carried.length > MAXN) {
    showErr('Shape limit is ' + MAXN + ' — that copy needs ' + carried.length);
    return;
  }

  snapshot();
  const toNew = new Map();
  for (const oldId of from) {
    const id = addBody();
    const nb = bodies.find(x => x.id === id);
    if (nb) nb.name = (bodyName(oldId) + ' copy').slice(0, 24);
    toNew.set(oldId, id);
  }
  const made = carried.map(n => {
    const c = nudge(clone(n));
    if (c.op === 'add') c.b = toNew.get(n.b);
    else c.tg = n.tg.map(t => toNew.get(t));
    return c;
  });
  // Slot the copies in right after the source body's last add, not at the end
  // of the list: a cut only reaches what is above it, so appending would drop
  // the copies below the build-plate cut and leave them without a flat bottom.
  let at = 0;
  for (const n of src)
    if (n.op === 'add') at = Math.max(at, nodes.indexOf(n) + 1);
  nodes.splice(at, 0, ...made);
  activeBody = toNew.get(from[0]);
  picked = new Set(made);
  sel = nodes.indexOf(made[0]);
  syncBodies();
  rebuildShader(); renderList(); renderInspector(); save(); needDraw();
};
$('delBtn').onclick = () => {
  if (!picked.size) return;
  snapshot();
  const doomed = picked;
  const first = nodes.findIndex(n => doomed.has(n));
  nodes = nodes.filter(n => !doomed.has(n));
  sel = Math.max(0, Math.min(first, nodes.length - 1));
  resetPicked();
  syncBodies();   // keep targets and the active body pointing at what is left
  rebuildShader(); renderList(); renderInspector(); save(); needDraw();
};
