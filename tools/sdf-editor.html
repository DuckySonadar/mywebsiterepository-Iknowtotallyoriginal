// ---------- files ----------
// The paste box is fine for a handful of primitives and hopeless once a baked
// field is in the document -- half a megabyte of base64 is not something to
// select by hand. These are the same document, through a file instead.
function currentDoc() {
  return { version: 2, bodies, nodes,
           fields: SF.fields.length ? SF.fields.map(encodeField) : undefined };
}
$('saveBtn').onclick = () => {
  const name = (prompt('Save as', 'metameld_model.json') || '').trim();
  if (!name) return;
  deliver(new Blob([JSON.stringify(currentDoc())], { type: 'application/json' }),
          name.endsWith('.json') ? name : name + '.json');
  setStatus('saved ' + name);
};
// Import merges instead of replacing, which is how two documents that were
// authored apart -- a body from one file, a cutter from another -- end up in
// the same scene. Bodies and baked fields are renumbered on the way in so
// nothing collides with what is already here.
function importDoc(d) {
  const list = (d && (d.nodes || d)) || [];
  if (!Array.isArray(list) || !list.some(n => n && PRIMS[n.t]))
    throw new Error('no shapes in that file');
  const incoming = list.filter(n => n && PRIMS[n.t]).map(n => makeNode(n.t, n));
  if (nodes.length + incoming.length > MAXN)
    throw new Error(`that would make ${nodes.length + incoming.length} shapes; `
                    + `the limit is ${MAXN}`);
  const rawF = d.fields || (d.field ? [d.field] : []);
  const newF = rawF.map(decodeField).filter(Boolean);
  if (SF.fields.length + newF.length > MAXFIELDS)
    throw new Error(`that would make ${SF.fields.length + newF.length} baked `
                    + `shapes; the limit is ${MAXFIELDS}`);
  const fBase = SF.fields.length;
  SF.fields = SF.fields.concat(newF);

  const idBase = bodies.reduce((m, b) => Math.max(m, b.id), -1) + 1;
  const srcBodies = (d.bodies || []).filter(b => b && typeof b.id === 'number');
  const remap = new Map();
  for (const b of srcBodies) {
    remap.set(b.id, idBase + remap.size);
    bodies.push({ id: remap.get(b.id),
                  name: String(b.name || 'Body'), on: b.on !== false });
  }
  const mapId = id => remap.has(id) ? remap.get(id)
    : (remap.set(id, idBase + remap.size),
       bodies.push({ id: remap.get(id), name: 'Body', on: true }),
       remap.get(id));
  for (const n of incoming) {
    if (typeof n.b !== 'number') n.b = 0;
    n.b = mapId(n.b);
    if (n.op === 'add') n.tg = null;
    else if (Array.isArray(n.tg)) n.tg = n.tg.map(mapId);
    if (PRIMS[n.t].baked) n.fi = fBase + Math.min(Math.max(n.fi || 0, 0),
                                                  Math.max(newF.length - 1, 0));
  }
  nodes = nodes.concat(incoming);
  syncBodies();
  picked = new Set(incoming);          // what you just brought in, selected
  sel = nodes.indexOf(incoming[0]);
  if (incoming[0]) activeBody = incoming[0].b;
}

$('openBtn').onclick = () => $('fileInp').click();
$('importBtn').onclick = () => { pendingImport = true; $('fileInp').click(); };
let pendingImport = false;
$('fileInp').onchange = e => {
  const file = e.target.files && e.target.files[0];
  if (!file) return;
  // capture it now: the read is asynchronous, and clearing the flag when the
  // handler returns would leave onload seeing false and replacing the document
  const merge = pendingImport;
  pendingImport = false;
  const r = new FileReader();
  r.onload = () => {
    try {
      const d = JSON.parse(r.result);
      const list = (d && (d.nodes || d)) || [];
      if (!Array.isArray(list) || !list.some(n => n && PRIMS[n.t])) {
        // a fish shape file is curves, which this editor has no evaluator for.
        // It is a reasonable thing to try, so say what to do instead.
        const fish = d && (d.kind === 'flexifish-nurbs'
                           || (d.shape && d.shape.curves) || d.curves);
        throw new Error(fish
          ? 'that is a fish shape file — use Field JSON in the fish editor '
            + 'to bake it, then open that'
          : 'no shapes in that file');
      }
      snapshot();
      if (merge) { importDoc(d); setStatus('imported ' + file.name); }
      else { adopt(d); sel = 0; setStatus('opened ' + file.name); }
      rebuildShader(); renderList(); renderInspector(); save(); frameModel();
    } catch (err) { showErr('open: ' + err.message); }
  };
  r.onerror = () => showErr('open: could not read that file');
  r.readAsText(file);
  e.target.value = '';        // so the same file can be opened twice
};

// ---------- JSON in / out ----------
$('jsonBtn').onclick = () => {
  openModal('Model JSON',
    '<textarea id="jsonTa" spellcheck="false"></textarea>' +
    '<div class="bar" style="margin-top:8px">' +
    '<button class="btn" id="jsCopy">Copy</button>' +
    '<button class="btn" id="jsLoad">Load from box</button></div>' +
    '<p>Paste a model here and press Load. Copy keeps a backup anywhere ' +
    'you can paste text.</p>',
    () => {
      const ta = $('jsonTa');
      ta.value = JSON.stringify(
        { version: 2, bodies, nodes,
          fields: SF.fields.length ? SF.fields.map(encodeField) : undefined },
        null, 1);
      $('jsCopy').onclick = () => {
        ta.select();
        if (navigator.clipboard) navigator.clipboard.writeText(ta.value).catch(() => {});
        else { try { document.execCommand('copy'); } catch (e) {} }
        setStatus('JSON copied');
      };
      $('jsLoad').onclick = () => {
        try {
          const d = JSON.parse(ta.value);
          const list = (d && (d.nodes || d)) || [];
          // check before snapshotting, so a bad paste leaves no undo step
          if (!Array.isArray(list) || !list.some(n => n && PRIMS[n.t]))
            throw new Error('no shapes found');
          snapshot();
          adopt(d);
          sel = 0;
          closeModal();
          rebuildShader(); renderList(); renderInspector(); save(); frameModel();
        } catch (e) { showErr('JSON: ' + e.message); }
      };
    });
};

// ---------- STL ----------
$('resInp').oninput = () => {
  $('resVal').textContent = parseFloat($('resInp').value).toFixed(2) + ' mm';
  scheduleInfo();
};
document.body.addEventListener('click', e => {
  const s = e.target.dataset && e.target.dataset.step;
  if (s !== 'res:-1' && s !== 'res:1') return;
  const inp = $('resInp');
  inp.value = (parseFloat(inp.value) + (s === 'res:1' ? 0.05 : -0.05)).toFixed(2);
  inp.oninput();
});

let building = false, cached = null;      // { key, blob } from the last build
const stlKey = res =>
  JSON.stringify({ n: nodes.filter(n => n.on), b: bodies }) + '@' + res;

$('stlBtn').onclick = () => {
  if (building) return;
  const B = sceneBounds(shownNodes());
  if (!B) { showErr('Nothing to export — add a shape first'); return; }
  const res = parseFloat($('resInp').value);
  // Building runs across several frames, so by the time it ends iOS has
  // forgotten the tap and refuses the share sheet. Keep the blob: this second
  // tap is a fresh gesture, and handing it over now always works.
  if (cached && cached.key === stlKey(res)) {
    deliver(cached.blob, 'metameld_model.stl');
    setStatus('sent metameld_model.stl');
    return;
  }
  const pad = 2 * res;
  const x0 = B.lo[0] - pad, y0 = B.lo[1] - pad, z0 = B.lo[2] - pad;
  const nx = Math.ceil((B.hi[0] - B.lo[0] + 2 * pad) / res) + 1;
  const ny = Math.ceil((B.hi[1] - B.lo[1] + 2 * pad) / res) + 1;
  const nz = Math.ceil((B.hi[2] - B.lo[2] + 2 * pad) / res) + 1;
  const total = nx * ny * nz;
  // the grid is 4 bytes a voxel; iOS kills a tab that asks for too much, so
  // stop well short of that on a phone rather than losing the model with it
  const cap = matchMedia('(pointer: coarse)').matches ? 14e6 : 40e6;
  if (total > cap) {
    showErr('Grid too big (' + (total / 1e6).toFixed(0) + ' M voxels, limit ' +
            (cap / 1e6) + ' M) — raise the resolution number');
    return;
  }
  let vol;
  try { vol = new Float32Array(total); }
  catch (e) { showErr('Out of memory for the grid — raise the resolution'); return; }
  building = true;
  $('stlBtn').disabled = true;
  const live = buildPlan(nodes);
  const t0 = Date.now();
  let i = 0;
  // slice at a time, back to the event loop between slices: a phone stays
  // responsive and Safari never shows the "page is unresponsive" sheet
  const step = () => {
    const until = performance.now() + 24;
    while (i < nx && performance.now() < until) {
      const x = x0 + i * res;
      let idx = i * ny * nz;
      for (let j = 0; j < ny; j++) {
        const y = y0 + j * res;
        for (let k = 0; k < nz; k++)
          vol[idx++] = sceneSDF(live, x, y, z0 + k * res);
      }
      i++;
    }
    setStatus('building STL… ' + Math.round(100 * i / nx) + '%');
    if (i < nx) { requestAnimationFrame(step); return; }
    let mesh;
    try { mesh = surfaceNets(vol, nx, ny, nz, x0, y0, z0, res); }
    catch (e) { showErr('mesh: ' + e.message); building = false;
                $('stlBtn').disabled = false; return; }
    const nt = mesh.indices.length / 3;
    if (!nt) {
      showErr('The model is empty at this resolution');
      building = false; $('stlBtn').disabled = false; setStatus('');
      return;
    }
    const blob = meshToSTL(mesh, 'MetaMeld(TM) model (mm) - metameld');
    cached = { key: stlKey(res), blob };
    building = false; $('stlBtn').disabled = false;
    setStatus(nt.toLocaleString() + ' triangles · ' +
              ((Date.now() - t0) / 1000).toFixed(1) + ' s');
    deliver(blob, 'metameld_model.stl', () =>
      setStatus(nt.toLocaleString() + ' triangles ready — tap Save STL again'));
  };
  requestAnimationFrame(step);
};

function deliver(blob, name, onRefused) {
  const file = new File([blob], name, { type: 'model/stl' });
  // iOS: the share sheet drops the file straight into Files, AirDrop or a
  // slicer app; a plain download link there is a dead end more often than not
  if (navigator.canShare && navigator.canShare({ files: [file] })) {
    navigator.share({ files: [file], title: name }).catch(err => {
      if (err && err.name === 'AbortError') return;      // user hit cancel
      if (onRefused) onRefused(); else downloadBlob(blob, name);
    });
    return;
  }
  downloadBlob(blob, name);
}
function downloadBlob(blob, name) {
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = name;
  document.body.appendChild(a); a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 2000);
}

// ---------- bottom sheet drag ----------
const panel = $('panel'), grip = $('grip');
const SNAPS = [0.16, 0.52, 0.88];
let sheet = 1, dragFrom = null, dragH = 0;
function setSheet(fr) {
  document.documentElement.style.setProperty('--sheet', (fr * 100).toFixed(1) + 'vh');
  needDraw();
}
grip.addEventListener('pointerdown', e => {
  grip.setPointerCapture(e.pointerId);
  dragFrom = e.clientY;
  dragH = panel.getBoundingClientRect().height;
  panel.classList.add('drag');
});
grip.addEventListener('pointermove', e => {
  if (dragFrom === null) return;
  const h = Math.min(Math.max(dragH - (e.clientY - dragFrom), 60), innerHeight * 0.92);
  setSheet(h / innerHeight);
});
function gripEnd() {
  if (dragFrom === null) return;
  dragFrom = null;
  panel.classList.remove('drag');
  const fr = panel.getBoundingClientRect().height / innerHeight;
  sheet = SNAPS.reduce((b, s, i) =>
    Math.abs(s - fr) < Math.abs(SNAPS[b] - fr) ? i : b, 0);
  setSheet(SNAPS[sheet]);
}
grip.addEventListener('pointerup', gripEnd);
grip.addEventListener('pointercancel', gripEnd);
grip.addEventListener('click', () => {
  if (dragFrom !== null) return;
  sheet = (sheet + 1) % SNAPS.length;
  setSheet(SNAPS[sheet]);
});

// ---------- go ----------
rebuildShader();
renderList();
renderInspector();
$('resVal').textContent = parseFloat($('resInp').value).toFixed(2) + ' mm';
setHint();
frameModel();
setStatus(nodes.length + ' shapes');
needDraw();

} catch (err) {
  showErr('Startup: ' + err.message);
  throw err;
}
</script>
</body>
</html>
